    });
    ctx.refresh();
    onLeave(()=>{ MODULES.keno._picks=null; });
  },
  onAutoRound(ctx,d){
    const grid=ctx.q('#kgrid'); if(!grid||!d.detail) return;
    const picks=MODULES.keno._picks||[];
    grid.querySelectorAll('.kcell').forEach(c=>{
      const n=parseInt(c.dataset.n);
      c.className='kcell'+(picks.includes(n)?' pick':'')+(d.detail.includes(n)?(picks.includes(n)?' hit':' draw'):'');
    });
  },
  sim(bet,o){
    const picks=o.picks||[];
    if(!picks.length) return {payout:0,mult:0,tag:'—'};
    const pool=Array.from({length:40},(_,i)=>i+1), drawn=[];
    while(drawn.length<10) drawn.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
    const hits=picks.filter(n=>drawn.includes(n)).length;
    const m=(KENO_PAY[picks.length]||{})[hits]||0;
    return {payout:bet*m, mult:m, tag:hits+'/'+picks.length, detail:drawn};
  }
};

/* ==========================================================
   ROCK PAPER SCISSORS
========================================================== */
const RPS_HAND={rock:'✊',paper:'✋',scissors:'✌️'};
MODULES.rps = {
  blurb:'Three shakes, then throw',
  edge:'Ties push',
  optsHTML(o){ return `<div class="field"><label>Your throw</label>
    <div class="rps-pick" id="rps-pick">
      ${Object.entries(RPS_HAND).map(([k,v])=>`<button data-throw="${k}" class="${(o.throw||'rock')===k?'on':''}">${v}</button>`).join('')}
    </div></div>`; },
  readOpts(w){ const on=w.querySelector('#rps-pick .on'); return {throw:on?on.dataset.throw:'rock'}; },
  onChange(ctx){ ctx.preview(ctx.bet()*0.96,'Win / tie / loss','1.96× / push / 0'); },
  mount(ctx){
    let busy=false;
    ctx.stage.innerHTML=`<div class="rps-flash" id="rps-flash"></div>
      <div class="rps-arena">
        <div class="rps-side"><div class="rps-hand me" id="rps-me">✊</div><div class="rps-tag">You</div></div>
        <div class="rps-vs">VS</div>
        <div class="rps-side"><div class="rps-hand" id="rps-cpu">✊</div><div class="rps-tag">House</div></div>
      </div>`;
    ctx.manual.innerHTML=`<button class="act" id="rps-go">Throw</button>`;
    const me=ctx.q('#rps-me'), cpu=ctx.q('#rps-cpu'), flash=ctx.q('#rps-flash');
    function play(mine,theirs,cb){
      me.textContent='✊'; cpu.textContent='✊';
      me.classList.remove('reveal'); cpu.classList.remove('reveal');
      me.classList.add('shake'); cpu.classList.add('shake');
      for(let i=0;i<3;i++) setTimeout(()=>sfx.tick(), i*340);
      setTimeout(()=>{
        me.classList.remove('shake'); cpu.classList.remove('shake');
        me.textContent=RPS_HAND[mine]; cpu.textContent=RPS_HAND[theirs];
        me.classList.add('reveal'); cpu.classList.add('reveal');
        flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
        if(cb) cb();
      },1030);
    }
    MODULES.rps._play=play;
    ctx.q('#rps-go').addEventListener('click',()=>{
      if(busy||ctx.autoRunning()) return;
      const bet=ctx.bet(), mine=ctx.opts().throw;
      if(!placeBet(bet)) return toast('Not enough balance for that bet.','lose');
      busy=true; ctx.q('#rps-go').disabled=true; ctx.banner(null);
      const keys=Object.keys(RPS_HAND), theirs=keys[Math.floor(Math.random()*3)];
      play(mine,theirs,()=>{
        const beats={rock:'scissors',paper:'rock',scissors:'paper'};
        let payout, win, msg, cls;
        if(mine===theirs){ payout=bet; win=null; msg='Tie — bet returned'; cls='push'; }
        else if(beats[mine]===theirs){ payout=bet*1.96; win=true; msg=`${RPS_HAND[mine]} beats ${RPS_HAND[theirs]} — ${fmt(payout)}`; cls='win'; }
        else { payout=0; win=false; msg=`${RPS_HAND[theirs]} beats ${RPS_HAND[mine]} — ${fmt(bet)} lost`; cls='lose'; }
        resolveRound(payout,win);
        ctx.banner(msg,cls); ctx.strip(win===null?'TIE':(win?'WIN':'LOSS'), win===null?'':(win?'w':'l'));
        win===true?sfx.win():(win===false?sfx.lose():null);
        busy=false; ctx.q('#rps-go').disabled=false;
      });
    });
    onLeave(()=>{ MODULES.rps._play=null; });
  },
  onAutoRound(ctx,d){ if(MODULES.rps._play&&d.detail) MODULES.rps._play(d.detail.mine,d.detail.theirs); },
  sim(bet,o){
    const mine=o.throw||'rock';
    const keys=Object.keys(RPS_HAND), theirs=keys[Math.floor(Math.random()*3)];
    const beats={rock:'scissors',paper:'rock',scissors:'paper'};
    if(mine===theirs) return {payout:bet,mult:1,tag:'TIE',detail:{mine,theirs}};
    if(beats[mine]===theirs) return {payout:bet*1.96,mult:1.96,tag:'WIN',detail:{mine,theirs}};
    return {payout:0,mult:0,tag:'LOSS',detail:{mine,theirs}};
  }
};

/* ==========================================================
   LUCKY NUMBER
========================================================== */
MODULES.luckynumber = {
  blurb:'One number out of the range',
  edge:'1% edge',
  optsHTML(o){ return `
    <div class="field"><label>Range</label>
      <div class="seg" id="ln-range">
        ${[10,20,50,100].map(n=>`<button data-range="${n}" class="${(o.range||10)==n?'on':''}">1–${n}</button>`).join('')}
      </div>
    </div>
    <div class="field"><label>Your number</label>
      <div class="inp-row"><input type="number" id="ln-pick" min="1" value="${o.pick||7}">
        <button class="mini" id="ln-lucky">Random</button></div>
    </div>`; },
  readOpts(w){
    const on=w.querySelector('#ln-range .on');
    const range=on?parseInt(on.dataset.range):10;
    let pick=parseInt(w.querySelector('#ln-pick').value)||1;
    pick=Math.min(range,Math.max(1,pick));
    return {range,pick};
  },
  onChange(ctx){
    const o=ctx.opts(), m=o.range*EDGE;
    const inp=ctx.q('#ln-pick'); if(inp){ inp.max=o.range; if(parseInt(inp.value)>o.range) inp.value=o.range; }
    ctx.preview(ctx.bet()*m-ctx.bet(), `Win chance ${(100/o.range).toFixed(1)}%`, m.toFixed(2)+'×');
  },
  mount(ctx){
    let busy=false;
    ctx.stage.innerHTML=`<div class="bignum" id="ln-num" style="color:var(--amber)">?</div>
      <div class="cx-hint" id="ln-sub">Pick a number and roll.</div>`;
    ctx.manual.innerHTML=`<button class="act" id="ln-go">Roll</button>`;
    const num=ctx.q('#ln-num'), sub=ctx.q('#ln-sub');
    ctx.q('#ln-lucky').addEventListener('click',()=>{
      const o=ctx.opts();
      ctx.q('#ln-pick').value=1+Math.floor(Math.random()*o.range);
      sfx.chip(); ctx.refresh();
    });
    ctx.q('#ln-go').addEventListener('click',()=>{
      if(busy||ctx.autoRunning()) return;
      const bet=ctx.bet(), o=ctx.opts();
      if(!placeBet(bet)) return toast('Not enough balance for that bet.','lose');
      busy=true; ctx.q('#ln-go').disabled=true; ctx.banner(null);
      sub.textContent=`You picked ${o.pick} · pays ${(o.range*EDGE).toFixed(2)}×`;
      sfx.spin();
      let t=0;
      const iv=setInterval(()=>{
        num.textContent=1+Math.floor(Math.random()*o.range);
        num.style.color='var(--amber)';
        if(++t>13){
          clearInterval(iv);
          const roll=1+Math.floor(Math.random()*o.range);
          const win=roll===o.pick, m=o.range*EDGE;
          num.textContent=roll; num.style.color=win?'var(--accent)':'var(--red)';
          resolveRound(win?bet*m:0,win);
          ctx.banner(win?`${roll} — you won ${fmt(bet*m)}`:`${roll} — you picked ${o.pick}`,win?'win':'lose');
          ctx.strip(String(roll),win?'w':'l');
          win?sfx.win():sfx.lose();
          busy=false; ctx.q('#ln-go').disabled=false;
        }
      },65);
    });
  },
  onAutoRound(ctx,d){
    const n=ctx.q('#ln-num'); if(!n) return;
    n.textContent=d.detail; n.style.color=d.win?'var(--accent)':'var(--red)';
  },
  sim(bet,o){
    const range=o.range||10, pick=o.pick||1;
    const roll=1+Math.floor(Math.random()*range);
    const win=roll===pick, m=range*EDGE;
    return {payout:win?bet*m:0, mult:win?m:0, tag:String(roll), detail:roll};
  }
};
/* ==========================================================
   DAILY WHEEL
========================================================== */
const WHEEL=[{v:100,w:22},{v:200,w:18},{v:300,w:16},{v:500,w:12},{v:750,w:9},{v:1000,w:7},{v:2500,w:4},{v:5000,w:2},{v:10000,w:1}];
function pickWheel(){
  const t=WHEEL.reduce((a,r)=>a+r.w,0); let r=Math.random()*t;
  for(let i=0;i<WHEEL.length;i++){ if(r<WHEEL[i].w) return i; r-=WHEEL[i].w; }
  return 0;
}
function countdown(ms){
  if(ms<=0) return '00:00:00';
  const h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000),s=Math.floor(ms%60000/1000);
  return [h,m,s].map(x=>String(x).padStart(2,'0')).join(':');
}
let wheelIv=null;
function renderWheel(content){
  content.classList.add('fixed');
  clearInterval(wheelIv);
  const seg=360/WHEEL.length;
  const stops=WHEEL.map((r,i)=>`${r.v>=10000?'#f0b429':(i%2?'#1b3342':'#234055')} ${i*seg}deg ${(i+1)*seg}deg`);
  content.innerHTML=`<div class="game-wrap">
    <div class="game-bar"><h2>🎡 Daily Wheel <span class="sub">One free spin every 24 hours</span></h2>
      <button class="ghost-btn" data-nav="home">← Lobby</button></div>
    <div class="game-body">
      <div class="panel"><div class="panel-scroll">
        <div class="readout">
          ${WHEEL.map(r=>`<div class="line"><span>${r.v>=10000?'Jackpot':'Prize'}</span><b class="${r.v>=10000?'gold':''}">$${r.v.toLocaleString()}</b></div>`).join('')}
        </div>
        <button class="act" id="dw-spin">Spin the wheel</button>
        <div class="note" id="dw-cool"></div>
      </div></div>
      <div class="stage">
        <div class="banner" id="banner"></div>
        <div class="dw-wrap">
          <div class="pointer"></div>
          <div class="dw" id="dw" style="background:conic-gradient(${stops.join(',')})"></div>
          <div class="hub" id="dw-hub" style="font-size:13px">SPIN</div>
        </div>
      </div>
    </div></div>`;
  const btn=content.querySelector('#dw-spin'), cool=content.querySelector('#dw-cool');
  const wheel=content.querySelector('#dw'), banner=content.querySelector('#banner');
  const DAY=24*3600*1000;
  function tick(){
    const left=DAY-(Date.now()-state.wheel.last);
    if(state.wheel.last===0||left<=0){ btn.disabled=false; cool.textContent='Your free spin is ready.'; }
    else{ btn.disabled=true; cool.textContent='Next free spin in '+countdown(left); }
  }
  tick(); wheelIv=setInterval(tick,1000);
  onLeave(()=>clearInterval(wheelIv));
  btn.addEventListener('click',()=>{
    if(btn.disabled) return;
    btn.disabled=true;
    const idx=forceJackpot?WHEEL.length-1:pickWheel();
    forceJackpot=false;
    const prize=WHEEL[idx].v;
    const deg=(6+Math.floor(Math.random()*3))*360+(360-(idx*seg+seg/2));
    sfx.spin();
    wheel.style.transform=`rotate(${deg}deg)`;
    setTimeout(()=>{
      content.querySelector('#dw-hub').textContent='$'+prize.toLocaleString();
      state.wheel.last=Date.now();
      state.balance=round2(state.balance+prize); save(); renderWallet(true);
      banner.textContent = prize>=10000?`Jackpot — $${prize.toLocaleString()} added`:`$${prize.toLocaleString()} added to your balance`;
      banner.className='banner show win';
      if(prize>=10000){ sfx.jackpot(); toast('Jackpot! $10,000 from the Daily Wheel.','gold'); } else sfx.win();
      tick();
    },4300);
  });
}

/* ==========================================================
   LIFELINE
========================================================== */
document.getElementById('emergency-btn').addEventListener('click',()=>{
  if(state.balance>0.001) return toast('The lifeline only unlocks at $0.');
  const WEEK=7*24*3600*1000, since=Date.now()-state.lifeline.last;
  if(state.lifeline.last>0 && since<WEEK) return toast(`Lifeline recharges in ${countdown(WEEK-since)}.`,'lose');
  state.lifeline.last=Date.now();
  state.balance=round2(state.balance+50); save(); renderWallet(true);
  toast('$50 lifeline claimed. Make it count.','win'); sfx.win();
});

/* ==========================================================
   STATISTICS
========================================================== */
function renderStats(content){
  const s=state.stats;
  const decided=s.wins+s.losses;
  const rate=decided?(s.wins/decided*100):0;
  const rtp=s.wagered?(s.returned/s.wagered*100):0;
  const net=s.returned-s.wagered;
  content.innerHTML=`
    <div class="row-head"><h2>Statistics</h2><span>Lifetime, stored in this browser</span></div>
    <div class="stat-grid">
      <div class="stat"><b>${fmt(state.balance)}</b><small>Balance</small></div>
      <div class="stat"><b>${s.played.toLocaleString()}</b><small>Bets placed</small></div>
      <div class="stat"><b class="${net>=0?'pos':'neg'}">${fmtSigned(net)}</b><small>Net result</small></div>
      <div class="stat"><b>${rate.toFixed(1)}%</b><small>Win rate</small><div class="meter"><i style="width:${Math.min(100,rate)}%"></i></div></div>
      <div class="stat"><b>${rtp.toFixed(1)}%</b><small>Return to player</small><div class="meter"><i style="width:${Math.min(100,rtp)}%"></i></div></div>
      <div class="stat"><b>${fmt(s.wagered)}</b><small>Total wagered</small></div>
      <div class="stat"><b class="gold">${fmt(s.biggestWin)}</b><small>Biggest single payout</small></div>
      <div class="stat"><b class="${s.streak>=0?'pos':'neg'}">${s.streak>0?'+':''}${s.streak}</b><small>Current streak</small></div>
      <div class="stat"><b>${state.wheel.last?new Date(state.wheel.last).toLocaleDateString():'—'}</b><small>Last daily wheel</small></div>
    </div>
    <div class="row-head"><h2>Autobet sessions</h2><span>${Object.keys(Auto.sess).length} running</span></div>
    ${Object.keys(Auto.sess).length ? `<div class="stat-grid">${Object.values(Auto.sess).map(x=>`
        <div class="stat"><b class="${x.profit>=0?'pos':'neg'}">${fmtSigned(x.profit)}</b><small>${gameById(x.id).name} · ${x.done} bets</small></div>`).join('')}</div>`
      : `<div class="note">Nothing running. Open any game, switch the panel to Auto, and set your stop rules.</div>`}
  `;
}

/* ==========================================================
   DEV MENU
========================================================== */
const dev=document.getElementById('dev');
document.addEventListener('keydown',e=>{
  if(e.shiftKey&&(e.key==='H'||e.key==='h')&&!/input|select|textarea/i.test((e.target.tagName||''))) dev.classList.toggle('open');
});
dev.addEventListener('click',e=>{
  const b=e.target.closest('[data-dev]'); if(!b) return;
  const a=b.dataset.dev;
  const add=v=>{ state.balance=round2(state.balance+v); save(); renderWallet(true); toast(`${fmt(v)} added.`); };
  if(a==='add100') add(100);
  if(a==='add1000') add(1000);
  if(a==='add10000') add(10000);
  if(a==='setbal'){ const v=prompt('Set balance to:',state.balance); if(v!==null&&!isNaN(parseFloat(v))){ state.balance=Math.max(0,round2(parseFloat(v))); save(); renderWallet(true); } }
  if(a==='resetbal'){ state.balance=1000; save(); renderWallet(true); toast('Balance reset to $1,000.'); }
  if(a==='resetwheel'){ state.wheel.last=0; save(); toast('Daily wheel reset.'); if(currentView==='dailywheel') navigate('dailywheel'); }
  if(a==='resetemerg'){ state.lifeline.last=0; save(); toast('Lifeline reset.'); }
  if(a==='jackpot'){ forceJackpot=true; toast('Next wheel spin is a jackpot.'); }
  if(a==='stopauto'){ Auto.stopAll('dev stop'); }
  if(a==='close') dev.classList.remove('open');
});

/* ==========================================================
   SOUND + INIT
========================================================== */
const soundBtn=document.getElementById('sound-btn');
function paintSound(){ soundBtn.textContent=state.muted?'🔇':'🔊'; }
soundBtn.addEventListener('click',()=>{ state.muted=!state.muted; save(); paintSound(); });
paintSound();

window.addEventListener('beforeunload',e=>{
  if(Auto.any()){ e.preventDefault(); e.returnValue=''; }
});

buildSidebar();
renderWallet(false);
navigate('home');
</script>
