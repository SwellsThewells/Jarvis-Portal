<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JarvisBet — Jarvsino</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

:root{
  --root:#0b1620;
  --bg:#0f1e29;
  --panel:#152936;
  --panel-2:#1b3342;
  --panel-3:#234055;
  --line:#254458;
  --line-soft:#1d3546;
  --accent:#37d67a;
  --accent-dim:#26a95e;
  --amber:#f0b429;
  --gem:#7cc4f5;
  --red:#e5484d;
  --blue:#4a9fd8;
  --text:#dce8ef;
  --text-2:#93aebd;
  --text-3:#5f7f92;
  --r:8px;
  --r-sm:5px;
}
*{box-sizing:border-box;}
html,body{height:100%;width:100%;margin:0;}
body{
  margin:0;font-family:'Inter',system-ui,sans-serif;font-size:14px;
  background:var(--root);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#26445a;border-radius:6px;}
::-webkit-scrollbar-thumb:hover{background:#31576f;}
::-webkit-scrollbar-track{background:transparent;}
h1,h2,h3,h4{margin:0;font-family:'Barlow Condensed','Inter',sans-serif;font-weight:600;letter-spacing:.4px;text-transform:uppercase;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}
svg{display:block;}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;}

#app{display:flex;height:100vh;width:100vw;}

/* ============ SIDEBAR ============ */
#sidebar{
  width:272px;min-width:272px;background:var(--bg);
  border-right:1px solid var(--line-soft);display:flex;flex-direction:column;overflow:hidden;
}
.brand{display:flex;align-items:center;gap:11px;padding:16px 16px 14px;border-bottom:1px solid var(--line-soft);flex:none;}
.brand-mark{width:36px;height:36px;border-radius:var(--r);background:var(--accent);display:flex;align-items:center;justify-content:center;}
.brand-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:21px;letter-spacing:1px;text-transform:uppercase;}
.brand-name em{font-style:normal;color:var(--accent);}
#sidebar .scroll{flex:1;min-height:0;overflow-y:auto;padding:10px;}
.nav-block+.nav-block{margin-top:12px;padding-top:12px;border-top:1px solid var(--line-soft);}
.nav-head{font-family:'Barlow Condensed',sans-serif;font-size:12.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-3);padding:2px 6px 8px;font-weight:600;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r);
  color:var(--text-2);font-size:14px;font-weight:500;cursor:pointer;user-select:none;position:relative;margin-bottom:3px;
}
.nav-item:hover{background:var(--panel);color:var(--text);}
.nav-item.active{background:var(--panel-2);color:#fff;}
.nav-item .ic{width:20px;height:20px;flex:none;color:var(--text-3);}
.nav-item.active .ic,.nav-item:hover .ic{color:var(--accent);}
/* bigger game boxes */
.game-nav{
  display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--r);
  background:var(--panel);border:1px solid var(--line-soft);
  cursor:pointer;user-select:none;margin-bottom:6px;position:relative;
}
.game-nav:hover{background:var(--panel-2);border-color:var(--line);}
.game-nav.active{background:var(--panel-2);border-color:var(--accent-dim);}
.game-nav .thumb{width:42px;height:42px;flex:none;border-radius:var(--r-sm);overflow:hidden;background:#0d1c26;}
.game-nav .thumb svg{width:100%;height:100%;}
.game-nav .gn-text{min-width:0;flex:1;}
.game-nav .gn-text b{display:block;font-size:14px;font-weight:600;color:var(--text);letter-spacing:.2px;}
.game-nav .gn-text small{display:block;font-size:11px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.auto-dot{position:absolute;top:9px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(55,214,122,.16);animation:blip 1.2s ease-in-out infinite;}
.auto-dot.neg{background:var(--red);box-shadow:0 0 0 3px rgba(229,72,77,.16);}
.auto-dot.paused{background:var(--amber);box-shadow:0 0 0 3px rgba(240,180,41,.16);animation:none;}
@keyframes blip{0%,100%{opacity:1;}50%{opacity:.25;}}
.sb-foot{padding:11px 16px;font-size:11px;color:var(--text-3);line-height:1.6;border-top:1px solid var(--line-soft);flex:none;}

/* ============ MAIN ============ */
#main{flex:1;display:flex;flex-direction:column;min-width:0;}
#topbar{height:58px;min-height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:var(--bg);border-bottom:1px solid var(--line-soft);}
.tb-left,.tb-right{display:flex;align-items:center;gap:9px;}
#menu-toggle{display:none;background:var(--panel-2);border:1px solid var(--line);color:var(--text);width:36px;height:36px;border-radius:var(--r);}
.wallet{display:flex;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;}
.wallet .amt{padding:7px 13px;display:flex;flex-direction:column;justify-content:center;}
.wallet .amt b{font-family:'JetBrains Mono',monospace;font-size:14.5px;font-weight:700;}
.wallet .amt small{font-size:9.5px;color:var(--text-3);letter-spacing:.9px;text-transform:uppercase;margin-top:1px;}
.wallet .tag{background:var(--panel-2);border-left:1px solid var(--line);display:flex;align-items:center;padding:0 11px;font-size:11px;color:var(--amber);font-weight:600;white-space:nowrap;}
.wallet .tag.ghost{color:var(--gem);}
.gem-pill{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:7px 12px;cursor:pointer;}
.gem-pill:hover{border-color:var(--gem);}
.gem-pill b{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--gem);}
.gem-pill small{font-size:9.5px;color:var(--text-3);letter-spacing:.9px;text-transform:uppercase;display:block;margin-top:1px;}
.flash-up{animation:fUp .5s ease;}
.flash-down{animation:fDn .5s ease;}
@keyframes fUp{0%{color:var(--accent);}100%{color:var(--text);}}
@keyframes fDn{0%{color:var(--red);}100%{color:var(--text);}}
.tb-btn{height:36px;padding:0 12px;background:var(--panel);border:1px solid var(--line);color:var(--text-2);border-radius:var(--r);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px;}
.tb-btn:hover{background:var(--panel-2);color:var(--text);}
.tb-btn.alert{background:#3a1417;border-color:#7a2126;color:#ff9b9e;}

#content{flex:1;min-height:0;overflow-y:auto;padding:18px 20px 26px;}
#content.fixed{overflow:hidden;padding:12px;}

/* ============ LOBBY ============ */
.masthead{
  border:1px solid var(--line-soft);border-radius:var(--r);background:#11242f;
  padding:24px 26px;display:flex;justify-content:space-between;align-items:flex-end;gap:22px;flex-wrap:wrap;
}
.masthead h1{font-size:32px;line-height:1;letter-spacing:1px;}
.masthead h1 em{font-style:normal;color:var(--accent);}
.masthead p{margin:10px 0 0;color:var(--text-2);font-size:13px;max-width:520px;line-height:1.6;}
.mast-stats{display:flex;gap:24px;}
.mast-stats div small{display:block;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-3);margin-bottom:3px;}
.mast-stats div b{font-family:'JetBrains Mono',monospace;font-size:17px;}
.row-head{display:flex;align-items:baseline;justify-content:space-between;margin:24px 0 11px;padding-bottom:8px;border-bottom:1px solid var(--line-soft);}
.row-head h2{font-size:18px;letter-spacing:1.2px;}
.row-head span{font-size:11.5px;color:var(--text-3);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:11px;}
.tile{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden;cursor:pointer;position:relative;transition:border-color .13s,transform .13s;}
.tile:hover{border-color:var(--panel-3);transform:translateY(-2px);}
.tile-art{height:106px;background:#0d1c26;position:relative;}
.tile-art svg{width:100%;height:100%;}
.tile-meta{padding:10px 12px 12px;border-top:1px solid var(--line-soft);}
.tile-meta h3{font-size:14px;letter-spacing:.5px;color:#fff;}
.tile-meta p{margin:4px 0 0;font-size:11.5px;color:var(--text-3);line-height:1.4;}
.live-chip{position:absolute;top:8px;right:8px;z-index:2;background:#0b1620;border:1px solid var(--accent);color:var(--accent);font-size:9.5px;font-weight:700;letter-spacing:.8px;padding:3px 6px;border-radius:var(--r-sm);}

/* ============ GAME FRAME ============ */
.game-wrap{height:100%;display:flex;flex-direction:column;gap:10px;}
.game-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border:1px solid var(--line-soft);border-radius:var(--r);padding:9px 13px;min-height:46px;}
.game-bar h2{font-size:16.5px;letter-spacing:1.1px;display:flex;align-items:center;gap:9px;}
.game-bar .sub{font-size:11.5px;color:var(--text-3);letter-spacing:.3px;text-transform:none;font-family:'Inter';font-weight:400;}
.bar-tools{display:flex;align-items:center;gap:8px;}
.ghost-btn{background:transparent;border:1px solid var(--line);color:var(--text-2);border-radius:var(--r);padding:7px 11px;font-size:12px;font-weight:600;}
.ghost-btn.confirm-armed{background:rgba(229,72,77,.12);border-color:#e5484d;color:#e5484d;}
.ghost-btn:hover{background:var(--panel);color:var(--text);}
.game-body{flex:1;min-height:0;display:grid;grid-template-columns:320px 1fr;grid-template-rows:minmax(0,1fr);gap:10px;}
.panel{background:var(--bg);border:1px solid var(--line-soft);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;}
.panel-scroll{overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px;}
.stage{background:#102029;border:1px solid var(--line-soft);border-radius:var(--r);position:relative;min-height:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;overflow:hidden;}

.mode-tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:3px;gap:3px;}
.mode-tabs button{flex:1;background:transparent;border:none;color:var(--text-2);font-size:12.5px;font-weight:600;padding:8px 0;border-radius:var(--r-sm);}
.mode-tabs button.on{background:var(--panel-3);color:#fff;}

.field{display:flex;flex-direction:column;gap:6px;}
.field>label{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--text-3);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.field>label span{color:var(--text-2);text-transform:none;letter-spacing:0;font-weight:500;font-size:11px;}
.inp-row{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;}
.inp-row input,.inp-row select{flex:1;min-width:0;background:transparent;border:none;color:var(--text);padding:9px 10px;font-size:13.5px;font-weight:600;font-family:'JetBrains Mono',monospace;}
.inp-row select{font-family:'Inter';font-weight:500;cursor:pointer;}
.inp-row select option{background:#152936;}
.inp-row input:focus,.inp-row select:focus{outline:none;}
.inp-row input:disabled{color:var(--text-3);}
.inp-row .unit{display:flex;align-items:center;padding:0 9px;color:var(--text-3);font-size:12px;border-left:1px solid var(--line);}
.inp-row .unit.pre{border-left:none;border-right:1px solid var(--line);}
.mini{background:var(--panel-2);border:none;border-left:1px solid var(--line);color:var(--text-2);padding:0 10px;font-size:11.5px;font-weight:700;}
.mini:hover{background:var(--panel-3);color:#fff;}
.seg{display:flex;gap:5px;flex-wrap:wrap;}
.seg button{flex:1;min-width:64px;background:var(--panel);border:1px solid var(--line);color:var(--text-2);border-radius:var(--r);padding:8px 5px;font-size:12px;font-weight:600;}
.seg button.on{background:var(--panel-3);color:#fff;border-color:var(--accent-dim);}
.seg button:disabled{opacity:.45;cursor:not-allowed;}
.seg.col{flex-direction:column;}
.seg.col button{width:100%;}

.act{border:none;border-radius:var(--r);padding:12px 15px;font-weight:700;font-size:14px;color:#08301b;background:var(--accent);transition:filter .12s,transform .08s;}
.act:hover{filter:brightness(1.08);}
.act:active{transform:translateY(1px);}
.act:disabled{opacity:.42;cursor:not-allowed;filter:none;transform:none;}
.act-2{background:var(--panel-3);color:#fff;}
.act-amber{background:var(--amber);color:#3a2a05;}
.act-red{background:var(--red);color:#fff;}
.act-line{background:transparent;border:1px solid var(--line);color:var(--text-2);}
.act-line:hover{background:var(--panel);color:var(--text);}
.act-row{display:flex;gap:7px;}
.act-row .act{flex:1;}
.readout{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);padding:10px 11px;display:flex;flex-direction:column;gap:7px;}
.readout .line{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;}
.readout .line span{color:var(--text-3);}
.readout .line b{font-family:'JetBrains Mono',monospace;font-weight:700;text-align:right;}
.pos{color:var(--accent);} .neg{color:var(--red);} .gold{color:var(--amber);} .gemc{color:var(--gem);}
.note{font-size:11.5px;color:var(--text-3);line-height:1.55;}
.note b{color:var(--text-2);}

.banner{position:absolute;left:50%;top:14px;transform:translate(-50%,-12px);background:#0b1620;border:1px solid var(--line);border-radius:var(--r);padding:9px 16px;font-size:13px;font-weight:600;white-space:nowrap;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:30;}
.banner.show{opacity:1;transform:translate(-50%,0);}
.banner.win{border-color:var(--accent-dim);color:var(--accent);}
.banner.lose{border-color:#7a2126;color:#ff9b9e;}
.banner.push{border-color:var(--line);color:var(--text-2);}
.strip{position:absolute;top:12px;right:12px;display:flex;gap:5px;z-index:20;}
.strip .pill{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;background:var(--panel-2);color:var(--text-2);animation:pillIn .2s ease;}
.strip .pill.w{background:rgba(55,214,122,.14);color:var(--accent);}
.strip .pill.l{background:rgba(229,72,77,.13);color:#ff9b9e;}
@keyframes pillIn{from{opacity:0;transform:translateX(8px);}to{opacity:1;transform:none;}}
.auto-flag{position:absolute;left:12px;top:12px;z-index:20;display:flex;align-items:center;gap:7px;background:#0b1620;border:1px solid var(--accent-dim);border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:600;color:var(--accent);}
.auto-flag i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:blip 1.2s ease-in-out infinite;}
.auto-flag.paused{border-color:var(--amber);color:var(--amber);}
.auto-flag.paused i{background:var(--amber);animation:none;}
.next-bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--line-soft);z-index:20;}
.next-bar i{display:block;height:100%;width:0;background:var(--accent-dim);}

.auto-live{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 11px;display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;}
.auto-live div{display:flex;flex-direction:column;gap:2px;}
.auto-live small{font-size:9.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--text-3);}
.auto-live b{font-family:'JetBrains Mono',monospace;font-size:13px;}
.adv-toggle{display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--text-3);font-weight:600;padding:8px 0 0;border-top:1px solid var(--line-soft);}
.adv-toggle:hover{color:var(--text-2);}
.adv-body{display:flex;flex-direction:column;gap:12px;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;}

/* dock */
#dock{position:fixed;right:20px;left:auto;bottom:12px;z-index:120;display:flex;flex-direction:column;gap:7px;max-width:300px;}
.dock-card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.45);}
.dock-card .bar{width:3px;align-self:stretch;border-radius:2px;background:var(--accent);}
.dock-card.paused .bar{background:var(--amber);}
.dock-card .dc-main{flex:1;min-width:0;}
.dock-card .dc-main b{font-size:12.5px;display:block;}
.dock-card .dc-main small{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-3);}
.dock-card button{background:var(--panel-2);border:1px solid var(--line);color:var(--text-2);border-radius:var(--r-sm);font-size:11px;padding:5px 8px;font-weight:600;}
.dock-card button:hover{color:#fff;background:var(--panel-3);}

#toasts{position:fixed;bottom:14px;right:14px;display:flex;flex-direction:column;gap:7px;z-index:400;}
.toast{background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--panel-3);padding:10px 14px;font-size:12.5px;border-radius:var(--r);max-width:300px;opacity:0;transform:translateX(14px);transition:all .22s;}
.toast.show{opacity:1;transform:none;}
.toast.win{border-left-color:var(--accent);}
.toast.lose{border-left-color:var(--red);}
.toast.gold{border-left-color:var(--amber);}
.toast.gem{border-left-color:var(--gem);}
.hidden{display:none!important;}

/* ============ TABLES (manager / leaderboard) ============ */
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--bg);border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden;}
.tbl th{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--text-3);text-align:left;padding:11px 13px;background:var(--panel);border-bottom:1px solid var(--line-soft);font-weight:600;}
.tbl td{padding:11px 13px;border-bottom:1px solid var(--line-soft);font-size:13px;vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:var(--panel);}
.tbl td.num{font-family:'JetBrains Mono',monospace;}
.tbl .who{display:flex;align-items:center;gap:10px;}
.tbl .who .thumb{width:30px;height:30px;border-radius:var(--r-sm);overflow:hidden;background:#0d1c26;flex:none;}
.tbl tr.lb-you td{background:rgba(124,196,245,.08);}
.tbl tr.lb-you:hover td{background:rgba(124,196,245,.12);}
.lb-rank{display:flex;align-items:center;gap:8px;}
.lb-rank i{width:8px;height:8px;border-radius:50%;background:var(--text-3);display:block;}
.lb-rank i.top{background:var(--amber);}
.lb-rank i.you{background:var(--gem);}
.pill-status{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.8px;padding:4px 9px;border-radius:999px;text-transform:uppercase;}
.pill-status.run{background:rgba(55,214,122,.13);color:var(--accent);}
.pill-status.pause{background:rgba(240,180,41,.13);color:var(--amber);}
.row-acts{display:flex;gap:5px;flex-wrap:wrap;}
.split2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:760px){.split2{grid-template-columns:1fr;}}
.row-acts button{background:var(--panel-2);border:1px solid var(--line);color:var(--text-2);border-radius:var(--r-sm);font-size:11px;padding:5px 9px;font-weight:600;}
.row-acts button:hover{background:var(--panel-3);color:#fff;}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--text-3);font-size:13px;}

/* ============ UPGRADES ============ */
.up-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:11px;}
.up-card{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);padding:15px;display:flex;flex-direction:column;gap:10px;}
.up-card h3{font-size:15px;letter-spacing:.6px;color:#fff;}
.up-card p{margin:0;font-size:12px;color:var(--text-3);line-height:1.5;}
.up-lv{display:flex;gap:4px;}
.up-lv i{flex:1;height:5px;border-radius:3px;background:#0b1620;}
.up-lv i.on{background:var(--gem);}
.up-buy{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;}
.up-buy .cost{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--gem);display:flex;align-items:center;gap:6px;}
.up-buy button{background:var(--gem);color:#08222f;border:none;border-radius:var(--r);padding:9px 14px;font-size:12.5px;font-weight:700;}
.up-buy button:disabled{background:var(--panel-3);color:var(--text-3);cursor:not-allowed;}

/* ============ STATS ============ */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:9px;}
.stat{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);padding:14px;}
.stat b{font-family:'JetBrains Mono',monospace;font-size:21px;display:block;}
.stat small{font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--text-3);display:block;margin-top:5px;}
.meter{height:5px;background:#0b1620;margin-top:9px;border-radius:3px;overflow:hidden;}
.meter i{display:block;height:100%;background:var(--accent);}

/* ============ SLOTS ============ */
.machine{display:flex;flex-direction:column;align-items:center;gap:0;max-width:min(100%,520px);width:100%;}
.mach-top{width:100%;background:#8f2226;border:2px solid #5f1519;border-bottom:none;border-radius:12px 12px 0 0;padding:10px 16px;text-align:center;
  font-family:'Barlow Condensed',sans-serif;font-size:20px;letter-spacing:3px;color:#ffd98a;text-transform:uppercase;font-weight:700;}
.mach-lights{display:flex;justify-content:center;gap:8px;padding:6px 0 0;}
.mach-lights i{width:8px;height:8px;border-radius:50%;background:#5f1519;}
.mach-lights i.on{background:#ffd98a;}
.slot-box{background:#132b38;border:2px solid #0a1720;border-top:none;border-radius:0 0 12px 12px;padding:16px;display:flex;gap:10px;width:100%;justify-content:center;position:relative;}
.reel{width:clamp(70px,9vw,120px);height:clamp(198px,39vh,330px);background:#060f16;border:1px solid var(--line-soft);border-radius:var(--r-sm);overflow:hidden;position:relative;}
.reel .strip{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;will-change:transform;}
.reel .cell{display:flex;align-items:center;justify-content:center;padding:9%;}
.reel .cell svg{width:100%;height:100%;}
.reel::before,.reel::after{content:"";position:absolute;left:0;right:0;height:33.34%;z-index:3;pointer-events:none;}
.reel::before{top:0;background:linear-gradient(#060f16,rgba(6,15,22,0));}
.reel::after{bottom:0;background:linear-gradient(rgba(6,15,22,0),#060f16);}
.payline{position:absolute;left:8px;right:8px;top:50%;height:2px;background:rgba(240,180,41,.5);z-index:4;pointer-events:none;}
.mach-base{width:100%;height:14px;background:#0a1720;border-radius:0 0 14px 14px;}
.paytable{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;}
.paytable div{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text-2);}
.paytable svg{width:18px;height:18px;}
.paytable b{font-family:'JetBrains Mono',monospace;color:var(--text);}

/* ============ CARDS ============ */
.felt{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;}
.hand{display:flex;gap:8px;min-height:104px;align-items:center;justify-content:center;flex-wrap:wrap;}
.pcard{width:clamp(58px,6.4vw,86px);height:clamp(82px,9vw,120px);border-radius:var(--r-sm);background:#eef2f5;color:#16232c;display:flex;flex-direction:column;justify-content:space-between;padding:6px 8px;font-weight:700;font-size:15px;box-shadow:0 4px 10px rgba(0,0,0,.4);animation:deal .22s ease;font-family:'Barlow Condensed',sans-serif;}
.pcard.red{color:#c33;}
.pcard .bl{align-self:flex-end;transform:rotate(180deg);}
.pcard.back{background:#1b3342;border:1px solid var(--line);}
@keyframes deal{from{opacity:0;transform:translateY(-14px);}to{opacity:1;transform:none;}}
.seat-lbl{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-3);font-weight:600;}
.seat-val{font-family:'JetBrains Mono',monospace;font-size:14px;background:var(--panel);padding:3px 10px;border-radius:var(--r-sm);border:1px solid var(--line-soft);}
.felt-line{width:60%;height:1px;background:var(--line-soft);margin:8px 0;}

/* ============ ROULETTE ============ */
.rt-wrap{display:flex;flex-direction:column;align-items:center;gap:15px;width:100%;height:100%;justify-content:center;}
.wheel-frame{position:relative;width:clamp(170px,30vh,280px);height:clamp(170px,30vh,280px);flex:none;}
.wheel{width:100%;height:100%;border-radius:50%;border:5px solid #16303f;transition:transform 3.4s cubic-bezier(.17,.67,.2,1);}
.pointer{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:15px solid var(--amber);z-index:5;}
.hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:#0d1c26;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:19px;}
.rt-board{display:grid;grid-template-columns:34px repeat(12,1fr);gap:3px;width:100%;max-width:720px;}
.cell{padding:8px 0;text-align:center;font-size:12px;font-weight:600;cursor:pointer;position:relative;user-select:none;color:#fff;border-radius:var(--r-sm);font-family:'JetBrains Mono',monospace;}
.cell:hover{outline:1px solid var(--amber);}
.c-red{background:#8f2226;}
.c-black{background:#1a2b36;}
.c-green{background:#15653c;grid-row:1/span 3;display:flex;align-items:center;justify-content:center;}
.c-out{background:var(--panel);border:1px solid var(--line);color:var(--text-2);font-size:11px;font-family:'Inter';}
.chip{position:absolute;bottom:-4px;right:-4px;width:20px;height:20px;border-radius:50%;background:var(--amber);color:#2c1f04;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;border:2px solid #8a6510;}
.rt-out-row{display:flex;gap:4px;width:100%;max-width:720px;flex-wrap:wrap;}
.rt-out-row .c-out{flex:1;min-width:74px;padding:8px 3px;}

/* ============ MINES / TOWER ============ */
.mine-grid{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:7px;width:min(100%,62vh,460px);aspect-ratio:1;}
.mtile{background:var(--panel-2);border:1px solid var(--line);border-bottom:2px solid #16303f;border-radius:var(--r);
  display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;
  min-width:0;min-height:0;overflow:hidden;transition:background .1s;}
.mtile .face{position:absolute;inset:14%;display:flex;align-items:center;justify-content:center;}
.mtile .face svg{width:100%;height:100%;}
.mtile.pick{border-color:var(--blue);background:var(--panel-3);}
.mtile.flip .face{animation:flipIn .2s ease;}
@keyframes flipIn{0%{transform:scale(.35) rotate(-14deg);opacity:0;}60%{transform:scale(1.14) rotate(4deg);opacity:1;}100%{transform:scale(1) rotate(0);}}
.mtile.shake{animation:tileShake .2s ease;}
@keyframes tileShake{0%,100%{transform:translate(0,0);}25%{transform:translate(-3px,2px);}50%{transform:translate(3px,-2px);}75%{transform:translate(-2px,-1px);}}
.mtile:hover:not(.done){background:var(--panel-3);}
.mtile.done{cursor:default;}
.mtile.gem{background:rgba(74,159,216,.14);border-color:rgba(55,214,122,.55);}
.mtile.boom{background:rgba(229,72,77,.14);border-color:#7a2126;}
.mtile.ghost{background:transparent;border-style:dashed;opacity:.45;}
.mtile.dim{opacity:.34;}
@keyframes pop{from{transform:scale(.82);}to{transform:scale(1);}}
.tower{display:flex;flex-direction:column-reverse;gap:5px;width:min(100%,420px);}
.floor{display:flex;gap:5px;align-items:center;opacity:.34;}
.floor.on{opacity:1;} .floor.past{opacity:.75;} .floor.ghost{opacity:.6;}
.floor .fno{width:22px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-3);text-align:center;}
.ftile{flex:1;height:clamp(28px,5.4vh,52px);background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;font-family:'JetBrains Mono',monospace;}
.floor.on .ftile:hover{background:var(--panel-3);}
.ftile.ok{background:rgba(55,214,122,.13);border-color:var(--accent-dim);color:var(--accent);}
.ftile.bad{background:rgba(229,72,77,.14);border-color:#7a2126;color:#ff9b9e;}
.ftile.wouldok{background:transparent;border-style:dashed;border-color:var(--accent-dim);color:var(--accent-dim);}
.ftile.wouldbad{background:transparent;border-style:dashed;border-color:#7a2126;color:#7a2126;}
.floor .fmul{width:50px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-3);text-align:right;}

/* ============ CHICKEN ============ */
.cx{width:100%;height:100%;display:flex;flex-direction:column;}
.cx-road{flex:1;min-height:0;display:flex;position:relative;border-radius:var(--r);overflow:hidden;background:#131829;border:1px solid #1e2440;}
.cx-curb{width:74px;min-width:74px;position:relative;background:#1a2a20;border-right:3px solid #2c3d2c;display:flex;align-items:center;justify-content:center;}
.cx-lane{flex:1;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;border-right:2px dashed rgba(226,214,141,.2);}
.cx-lane:last-child{border-right:none;}
.cx-lane.done{background:rgba(55,214,122,.05);}
.cx-lane.next{background:rgba(255,255,255,.04);cursor:pointer;}
.cx-lane.next:hover{background:rgba(255,255,255,.08);}
.cx-lane.dead{background:rgba(229,72,77,.09);}
.cx-lane.would{background:rgba(240,180,41,.05);}
.cx-mult{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;background:#1d2340;border:1px solid #2b3358;color:var(--text-2);padding:7px 0;width:76%;text-align:center;border-radius:var(--r-sm);}
.cx-lane.done .cx-mult{background:#1a3a2b;border-color:var(--accent-dim);color:var(--accent);}
.cx-lane.next .cx-mult{background:#2a3160;border-color:#3d4785;color:#fff;}
.cx-lane.dead .cx-mult{background:#3a1a1d;border-color:#7a2126;color:#ff9b9e;}
.cx-lane.would .cx-mult{border-style:dashed;border-color:#6b5a24;color:var(--amber);}
.cx-chicken{position:absolute;width:44px;height:44px;z-index:8;pointer-events:none;transition:left .26s cubic-bezier(.3,1.5,.6,1);}
.cx-chicken svg{width:100%;height:100%;}
.cx-chicken.hop{animation:hop .26s ease;}
@keyframes hop{0%{transform:translate(-50%,-50%) scale(1);}45%{transform:translate(-50%,-118%) scale(1.1);}100%{transform:translate(-50%,-50%) scale(1);}}
.cx-car{position:absolute;width:58px;height:92px;z-index:6;pointer-events:none;}
.cx-car svg{width:100%;height:100%;}
.cx-topbar{display:flex;align-items:center;justify-content:space-between;padding:0 2px 9px;gap:12px;}
.cx-big{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;color:var(--amber);}
.cx-hint{font-size:11.5px;color:var(--text-3);}

/* ============ FLOATING P/L WIDGET ============ */
.pl-widget{
  position:fixed;top:96px;left:26px;right:auto;width:300px;height:210px;z-index:9000;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:0 14px 34px rgba(0,0,0,.45);display:flex;flex-direction:column;overflow:hidden;
  min-width:180px;min-height:96px;
}
.pl-widget.dragging,.pl-widget.resizing{user-select:none;}
.pl-widget.min{height:auto!important;}
.pl-head{
  display:flex;align-items:center;gap:8px;padding:8px 9px;background:var(--panel-2);
  border-bottom:1px solid var(--line-soft);flex:none;cursor:grab;touch-action:none;
}
.pl-head:active{cursor:grabbing;}
.pl-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;}
.pl-dot.neg{background:var(--red);}
.pl-title{font-family:'Barlow Condensed',sans-serif;font-size:11.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--text-3);font-weight:600;white-space:nowrap;}
.pl-value{margin-left:auto;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;white-space:nowrap;}
.pl-value.pos{color:var(--accent);}
.pl-value.neg{color:var(--red);}
.pl-btn{
  width:20px;height:20px;flex:none;border-radius:5px;background:var(--panel-3);border:1px solid var(--line);
  color:var(--text-2);font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.pl-btn:hover{color:#fff;border-color:var(--accent-dim);}
.pl-body{flex:1;min-height:0;position:relative;}
.pl-body canvas{position:absolute;inset:0;width:100%;height:100%;}
.pl-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:11.5px;text-align:center;padding:0 20px;}
.pl-widget.min .pl-body,.pl-widget.min .pl-resize{display:none;}
.pl-resize{
  position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;z-index:2;
  background:linear-gradient(135deg,transparent 0 45%,var(--text-3) 45% 55%,transparent 55% 65%,var(--text-3) 65% 75%,transparent 75%);
  opacity:.55;
}
.pl-resize:hover{opacity:1;}
@media (max-width:720px){ .pl-widget{left:10px;right:auto;top:70px;width:min(78vw,280px);} }

/* ============ CRASH ============ */
.cr-wrap{width:100%;height:100%;display:flex;flex-direction:column;gap:8px;}
.cr-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
.cr-mult{font-family:'JetBrains Mono',monospace;font-size:clamp(34px,7vh,62px);font-weight:700;line-height:1;transition:color .15s;}
.cr-canvas-wrap{
  flex:1 1 auto;min-height:0;width:100%;margin:0 auto;
  position:relative;border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden;
  background:
    radial-gradient(circle at 18% 22%,rgba(124,196,245,.2),transparent 18%),
    radial-gradient(circle at 76% 34%,rgba(192,132,252,.16),transparent 22%),
    radial-gradient(circle at 52% 88%,rgba(55,214,122,.12),transparent 24%),
    linear-gradient(180deg,#070d1d 0%,#0b1728 54%,#102431 100%);
  box-shadow:inset 0 0 52px rgba(0,0,0,.44);
}
.cr-canvas-wrap::before{
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.82;
  background-image:
    radial-gradient(circle,#fff 0 1px,transparent 1.6px),
    radial-gradient(circle,rgba(124,196,245,.9) 0 1px,transparent 1.7px),
    radial-gradient(circle,rgba(240,180,41,.72) 0 1px,transparent 1.8px);
  background-size:74px 62px,112px 88px,154px 126px;
  background-position:8px 14px,38px 28px,19px 64px;
}
.cr-canvas-wrap canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1;}
.cr-rocket{position:absolute;width:34px;height:34px;transform:translate(-50%,-50%);z-index:3;pointer-events:none;}
.cr-rocket svg{width:100%;height:100%;}
.cr-rocket.boom{animation:boom .5s ease forwards;}
@keyframes boom{0%{transform:translate(-50%,-50%) scale(1);opacity:1;}100%{transform:translate(-50%,-50%) scale(1.9);opacity:0;}}
.cr-hist{display:flex;gap:5px;flex-wrap:wrap;}
.cr-hist span{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;padding:4px 8px;border-radius:var(--r-sm);background:var(--panel);color:var(--text-3);}
.cr-hist span.hi{color:var(--accent);} .cr-hist span.lo{color:#ff9b9e;}

/* ============ LIMBO / DICE / LUCKY ============ */
.bignum{font-family:'JetBrains Mono',monospace;font-size:min(11vw,78px);font-weight:700;line-height:1;transition:color .18s;}
.lucky-num{font-size:min(22vw,168px);}
.dice-wrap{width:min(100%,620px);}
.dice-track{position:relative;height:13px;border-radius:7px;margin:36px 0 9px;cursor:pointer;touch-action:none;}
.dice-handle{position:absolute;top:50%;width:22px;height:32px;transform:translate(-50%,-50%);background:var(--panel-3);border:1px solid var(--line);border-radius:var(--r-sm);cursor:grab;display:flex;align-items:center;justify-content:center;gap:3px;z-index:4;}
.dice-handle:active{cursor:grabbing;}
.dice-handle::before,.dice-handle::after{content:"";width:1px;height:12px;background:var(--text-3);}
.dice-handle.locked{opacity:.6;cursor:not-allowed;}
.dice-marker.b{color:var(--text);}
.dice-marker{position:absolute;top:-28px;transform:translateX(-50%);font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;background:var(--panel);border:1px solid var(--line);padding:3px 7px;border-radius:var(--r-sm);transition:left .35s ease;z-index:3;}
.dice-scale{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-3);}

/* ============ COIN ============ */
.coin-stage{perspective:900px;width:clamp(190px,34vh,310px);height:clamp(190px,34vh,310px);}
.coin{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 1.5s cubic-bezier(.3,.02,.2,1);}
.coin-face{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;overflow:hidden;}
.coin-face svg{width:100%;height:100%;}
.coin-face.t{transform:rotateY(180deg);}
.coin-shadow{width:110px;height:12px;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(6px);margin-top:22px;}

/* ============ KENO ============ */
.keno-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;width:min(100%,780px);}
.kcell{aspect-ratio:1;background:var(--panel-2);border:1px solid var(--line);border-bottom:2px solid #16303f;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:clamp(11px,1.7vh,16px);font-weight:600;color:var(--text-2);cursor:pointer;}
.kcell:hover{background:var(--panel-3);color:#fff;}
.kcell.pick{background:var(--panel-3);color:#fff;border-color:var(--blue);}
.kcell.draw{background:#0d1c26;color:var(--text-3);}
.kcell.hit{background:rgba(55,214,122,.16);border-color:var(--accent);color:var(--accent);animation:pop .2s ease;}
.pay-table{display:flex;flex-direction:column;gap:3px;max-height:250px;overflow-y:auto;}
.pay-row{display:flex;justify-content:space-between;font-size:11.5px;padding:5px 8px;background:var(--panel);border-radius:var(--r-sm);}
.pay-row b{font-family:'JetBrains Mono',monospace;}
.pay-row.zero{opacity:.45;}

/* ============ RPS ============ */
.rps-arena{display:flex;align-items:center;justify-content:center;gap:min(9vw,86px);width:100%;}
.rps-side{display:flex;flex-direction:column;align-items:center;gap:12px;}
.rps-hand{width:min(28vw,220px);height:min(28vw,220px);font-size:clamp(92px,22vw,220px);line-height:1;display:flex;align-items:center;justify-content:center;}
.rps-hand svg{width:100%;height:100%;}
.rps-hand.me{transform:scaleX(-1);}
.rps-hand.shake{animation:rpsShake .34s ease-in-out 3;}
.rps-hand.me.shake{animation:rpsShakeMe .34s ease-in-out 3;}
@keyframes rpsShake{0%,100%{transform:rotate(-14deg) translateY(0);}50%{transform:rotate(5deg) translateY(-16px);}}
@keyframes rpsShakeMe{0%,100%{transform:scaleX(-1) rotate(-14deg) translateY(0);}50%{transform:scaleX(-1) rotate(5deg) translateY(-16px);}}
.rps-tag{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-3);font-weight:600;}
.rps-vs{font-family:'Barlow Condensed',sans-serif;font-size:34px;color:var(--text-3);letter-spacing:2px;}
.rps-flash{position:absolute;inset:0;background:radial-gradient(circle at center,rgba(255,255,255,.14),transparent 62%);opacity:0;pointer-events:none;}
.rps-flash.go{animation:flashOnce .4s ease;}
@keyframes flashOnce{0%{opacity:0;}30%{opacity:1;}100%{opacity:0;}}
.rps-pick{display:flex;gap:6px;}
.rps-pick button{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px;display:flex;align-items:center;justify-content:center;}
.rps-pick button svg{width:34px;height:34px;}
.rps-pick button.on{background:var(--panel-3);border-color:var(--accent-dim);}

.hl-stage .hand{min-height:clamp(138px,22vh,200px);}
.hl-stage .pcard{width:clamp(82px,10vw,126px);height:clamp(116px,14vw,176px);font-size:20px;padding:9px 11px;}

/* ============ PLINKO ============ */
.pk-wrap{display:flex;flex-direction:column;align-items:center;width:100%;height:100%;justify-content:center;gap:7px;}
.pk-canvas{display:block;}
.pk-bins{display:flex;gap:3px;}
.pk-bin{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:#12202a;padding:6px 0;text-align:center;border-radius:var(--r-sm);}
.pk-bin.flash{animation:binHit .4s ease;}
@keyframes binHit{0%{transform:translateY(0);}35%{transform:translateY(5px);}100%{transform:translateY(0);}}

.mine-multi{width:100%;height:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px;align-items:center;overflow:auto;padding:2px;}
.mine-mini{background:rgba(11,22,32,.72);border:1px solid var(--line-soft);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0;}
.mine-mini-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-3);}
.mine-mini-head b{color:var(--text);}
.mine-mini .mine-grid{width:100%;gap:4px;}
.mine-mini .mtile{border-radius:var(--r-sm);}

/* ============ WHEEL ============ */
.dw-wrap{position:relative;width:min(52vh,300px);height:min(52vh,300px);}
.dw{width:100%;height:100%;border-radius:50%;border:5px solid #16303f;transition:transform 4.2s cubic-bezier(.13,.71,.22,1);position:relative;}
.dw-lbl{position:absolute;left:50%;top:50%;transform-origin:0 0;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:#fff;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.8);pointer-events:none;}
.dw-lbl.jack{color:#2c1f04;}

/* ============ DEV ============ */
#dev{position:fixed;top:64px;right:14px;width:242px;background:var(--bg);border:1px solid var(--accent-dim);border-radius:var(--r);padding:12px;z-index:500;display:none;}
#dev.open{display:block;}
#dev h4{font-size:12px;color:var(--accent);margin-bottom:9px;letter-spacing:1.2px;}
#dev button{width:100%;text-align:left;margin-bottom:5px;padding:8px 10px;background:var(--panel);border:1px solid var(--line);color:var(--text-2);border-radius:var(--r-sm);font-size:12px;font-weight:500;}
#dev button:hover{background:var(--panel-2);color:#fff;}

@media (max-width:1120px){ .game-body{grid-template-columns:288px 1fr;} }
@media (max-width:900px){
  #sidebar{position:fixed;left:-282px;top:0;bottom:0;z-index:300;transition:left .2s;}
  #sidebar.open{left:0;}
  #menu-toggle{display:flex;align-items:center;justify-content:center;}
  #dock{right:10px;left:auto;}
  #content.fixed{overflow-y:auto;}
  .game-wrap{height:auto;min-height:100%;}
  .game-body{grid-template-columns:1fr;grid-template-rows:auto auto;min-height:640px;}
  .panel{order:2;}
  .stage{order:1;min-height:54vh;}
  .rt-board{grid-template-columns:26px repeat(12,1fr);}
  .cell{font-size:10px;padding:6px 0;}
  .tbl th:nth-child(4),.tbl td:nth-child(4){display:none;}
}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important;transition-duration:.05s!important;} }

/* ============ HORSE RACE (fills the stage, fixed-height lanes) ============ */
.hr-wrap{width:100%;height:100%;display:flex;flex-direction:column;gap:8px;min-height:0;}
.hr-track{flex:1 1 auto;min-height:380px;background:#16321f;border:1px solid #21472c;border-radius:var(--r);position:relative;overflow:hidden;display:flex;flex-direction:column;}
.hr-lane{flex:1 1 0;min-height:0;position:relative;border-bottom:1px dashed rgba(255,255,255,.09);display:flex;align-items:center;}
.hr-lane:last-child{border-bottom:none;}
.hr-lane.mine{background:rgba(240,180,41,.07);}
.hr-lane.won{background:rgba(55,214,122,.1);}
.hr-no{position:absolute;left:8px;width:22px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(255,255,255,.4);z-index:2;}
.hr-horse{position:absolute;left:34px;top:50%;height:min(60%,54px);aspect-ratio:1.5;transform:translate(0,-50%);will-change:transform;z-index:3;}
.hr-horse svg{width:100%;height:100%;display:block;}
.hr-finish{position:absolute;top:0;bottom:0;right:14px;width:8px;z-index:1;
  background:repeating-conic-gradient(#fff 0 25%,#16232c 0 50%) 0 0/8px 8px;opacity:.85;}
.hr-odds{display:flex;gap:6px;flex-wrap:wrap;}
.hr-pick{flex:1;min-width:88px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px;cursor:pointer;text-align:left;}
.hr-pick.on{border-color:var(--accent-dim);background:var(--panel-3);}
.hr-pick b{display:block;font-size:12.5px;color:var(--text);}
.hr-pick small{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--amber);}
.hr-photo{position:absolute;inset:0;background:rgba(11,22,32,.72);display:flex;align-items:center;justify-content:center;
  font-family:'Barlow Condensed',sans-serif;font-size:30px;letter-spacing:3px;color:#fff;z-index:9;}

/* ============ CASES ============ */
.cs-wrap{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;gap:14px;}
.cs-reels{display:grid;grid-template-columns:1fr;gap:8px;min-height:0;}
.cs-reels.two{grid-template-columns:1fr 1fr;}
.cs-reels.five{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));overflow:auto;padding:1px;}
.cs-reel{position:relative;height:118px;border:1px solid var(--line);border-radius:var(--r);background:#0c1a23;overflow:hidden;}
.cs-reels.two .cs-reel,.cs-reels.five .cs-reel{height:92px;}
.cs-track{position:absolute;top:0;bottom:0;left:0;display:flex;align-items:center;gap:8px;padding:0 8px;will-change:transform;}
.cs-item{width:104px;height:96px;flex:none;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:1px solid rgba(255,255,255,.1);}
.cs-reels.two .cs-item,.cs-reels.five .cs-item{height:74px;}
.cs-item b{font-family:'JetBrains Mono',monospace;font-size:15px;color:#fff;}
.cs-item small{font-size:10px;letter-spacing:1px;text-transform:uppercase;opacity:.75;color:#fff;}
.cs-needle{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--amber);z-index:5;transform:translateX(-50%);box-shadow:0 0 10px rgba(240,180,41,.6);}
.cs-needle::before,.cs-needle::after{content:"";position:absolute;left:50%;transform:translateX(-50%);border-left:6px solid transparent;border-right:6px solid transparent;}
.cs-needle::before{top:0;border-top:8px solid var(--amber);}
.cs-needle::after{bottom:0;border-bottom:8px solid var(--amber);}
.cs-choose{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:7px;}
.cs-card{border:1px solid var(--line);border-radius:var(--r);padding:11px;cursor:pointer;background:var(--panel);text-align:left;}
.cs-card.on{border-color:var(--accent-dim);}
.cs-card b{display:block;font-size:13px;color:#fff;}
.cs-card small{font-size:10.5px;color:var(--text-3);}
.cs-card .swatch{height:5px;border-radius:3px;margin-bottom:8px;}
.cs-odds{display:flex;flex-direction:column;gap:3px;max-height:230px;overflow-y:auto;}
.cs-odd{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;background:var(--panel);border-radius:var(--r-sm);padding:5px 8px;}
.cs-odd i{width:7px;height:7px;border-radius:2px;display:inline-block;margin-right:7px;}
.cs-odd b{font-family:'JetBrains Mono',monospace;}

/* ============ WHEEL GAME ============ */
.wg-wrap{position:relative;width:min(58vh,320px);height:min(58vh,320px);}
.wg-wheel{width:100%;height:100%;border-radius:50%;border:6px solid #16303f;transition:transform 4.6s cubic-bezier(.11,.7,.2,1);position:relative;box-shadow:0 0 0 3px #0b1620,0 10px 30px rgba(0,0,0,.4);}
.wg-lbl{position:absolute;left:50%;top:50%;transform-origin:0 0;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:#fff;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.8);pointer-events:none;}
.wg-pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:18px solid var(--amber);z-index:5;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));}
.wg-hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:#0d1c26;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:16px;text-align:center;}

/* ============ DARTS ============ */
.dt-wrap{position:relative;width:min(58vh,320px);height:min(58vh,320px);}
.dt-board{width:100%;height:100%;border-radius:50%;position:relative;background:radial-gradient(circle,#f0b429 0 8%,#e5484d 8% 12%,#eef2f5 12% 16%,#16303f 16% 34%,#eef2f5 34% 38%,#e5484d 38% 56%,#16303f 56% 100%);box-shadow:0 0 0 6px #241019,0 10px 30px rgba(0,0,0,.4);}
.dt-dart{position:absolute;width:32px;height:32px;transform:translate(-50%,-50%) scale(0) rotate(-40deg);transition:transform .45s cubic-bezier(.2,.8,.3,1.3);pointer-events:none;}
.dt-dart.show{transform:translate(-50%,-50%) scale(1) rotate(0deg);}
.dt-dart svg{width:100%;height:100%;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));}
.dt-result{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap;}
.dt-chip{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;}

/* ============ PUMP ============ */
.pm-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;height:100%;justify-content:center;}
.pm-stage{position:relative;width:200px;height:230px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;}
.pm-balloon{position:relative;border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;transition:width .2s cubic-bezier(.3,1.4,.6,1),height .2s cubic-bezier(.3,1.4,.6,1),background .3s ease;box-shadow:inset -10px -12px 20px rgba(0,0,0,.25),0 8px 20px rgba(0,0,0,.35);}
.pm-balloon::after{content:"";position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:14px solid inherit;}
.pm-knot{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);width:9px;height:9px;border-radius:50%;}
.pm-pop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:46px;opacity:0;pointer-events:none;}
.pm-pop.show{animation:pmPop .5s ease forwards;}
@keyframes pmPop{0%{opacity:1;transform:scale(.4);}60%{opacity:1;transform:scale(1.35);}100%{opacity:0;transform:scale(1.7);}}
.pm-gauge{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;color:var(--amber);}

/* ============ SNAKES ============ */
.sn-wrap{width:min(100%,420px);display:flex;flex-direction:column-reverse;gap:5px;}
.sn-step{display:flex;align-items:center;gap:8px;opacity:.34;transition:opacity .15s;}
.sn-step.on{opacity:1;}
.sn-step.past{opacity:.75;}
.sn-tile{flex:1;height:clamp(28px,5.4vh,48px);border-radius:var(--r-sm);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;background:linear-gradient(180deg,#1c3a24,#173021);border:1px solid #23482d;}
.sn-tile.safe{background:rgba(55,214,122,.18);border-color:var(--accent-dim);}
.sn-tile.bad{background:rgba(229,72,77,.18);border-color:#7a2126;}
.sn-tile .token{font-size:19px;transition:transform .22s ease;}
.sn-mul{width:58px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--text-3);flex:none;}
.sn-snake{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;animation:snStrike .35s ease;}
@keyframes snStrike{0%{transform:scale(.2) rotate(-30deg);opacity:0;}70%{transform:scale(1.35) rotate(8deg);opacity:1;}100%{transform:scale(1) rotate(0);opacity:1;}}

/* ============ MOLES ============ */
.ml-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:clamp(10px,1vw,16px);width:min(100%,78vh,70vw,900px);aspect-ratio:1;}
.ml-mound{background:linear-gradient(180deg,#4a3520,#3a2a16);border:1px solid #5c4326;border-bottom:3px solid #2a1d10;border-radius:var(--r);position:relative;cursor:pointer;overflow:hidden;}
.ml-mound:hover:not(.done){filter:brightness(1.15);}
.ml-mound .pop{position:absolute;left:50%;bottom:-100%;transform:translateX(-50%);width:76%;transition:bottom .3s cubic-bezier(.2,.8,.3,1.2);}
.ml-mound.done .pop{bottom:4%;}
.ml-mound.done{cursor:default;}
.ml-mound.bad{background:linear-gradient(180deg,#5c1d20,#3a1417);}
.ml-mound.good{background:linear-gradient(180deg,#1f4a2c,#173a21);}
.ml-mound.shake{animation:tileShake .2s ease;}

/* ============ RIDE THE BUS (table + flip cards) ============ */
.rb{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
.rb-stages{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.rb-stage{padding:6px 12px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.6px;background:var(--panel);color:var(--text-3);border:1px solid var(--line-soft);}
.rb-stage.on{background:var(--panel-3);color:#fff;border-color:var(--accent-dim);}
.rb-stage.done{color:var(--accent);border-color:var(--accent-dim);}
.rb-stage.fail{color:#ff9b9e;border-color:#7a2126;}
.rb-mult{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;color:var(--amber);}
.rb-table{width:100%;max-width:640px;background:radial-gradient(ellipse at 50% 30%,#193f2b 0%,#0e2318 75%);
  border:1px solid #21472c;border-radius:var(--r);padding:22px 18px;box-shadow:inset 0 0 30px rgba(0,0,0,.35);}
.rb-row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:clamp(82px,9vw,120px);}
.rb-flip{width:clamp(58px,6.4vw,86px);height:clamp(82px,9vw,120px);perspective:700px;flex:none;}
.rb-flip.placeholder{opacity:.28;}
.rb-flip-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.3,1);}
.rb-flip.flipped .rb-flip-inner{transform:rotateY(180deg);}
.rb-flip-inner .pcard{position:absolute;inset:0;backface-visibility:hidden;margin:0;animation:none;}
.rb-flip-inner .pcard.front{transform:rotateY(180deg);}
.rb-slot-empty{width:clamp(58px,6.4vw,86px);height:clamp(82px,9vw,120px);border:1px dashed var(--line);border-radius:var(--r-sm);flex:none;opacity:.4;}
.rb-q{font-size:14px;color:var(--text-2);font-weight:600;text-align:center;}

<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark" id="brand-mark"></div>
      <div class="brand-name">Jarvis<em>Bet</em></div>
    </div>
    <div class="scroll">
      <div class="nav-block" id="nav-main"></div>
      <div class="nav-block">
        <div class="nav-head">Classic Jarvsino</div>
        <div id="nav-classic"></div>
      </div>
      <div class="nav-block">
        <div class="nav-head">JarvisBet Originals</div>
        <div id="nav-originals"></div>
      </div>
    </div>
    <div class="sb-foot">Play money only. Jarvis Dollars and Jewels have no cash value.</div>
  </aside>

  <div id="main">
    <header id="topbar">
      <div class="tb-left">
        <button id="menu-toggle">≡</button>
        <div class="wallet">
          <div class="amt"><b id="wallet-amt">$1,000</b><small>Jarvis Dollars</small></div>
          <div class="tag" id="wallet-tag">JD</div>
        </div>
        <div class="jw-pill" data-nav="upgrades" title="Jarvis Jewels — spend them on upgrades">
          <span id="jw-icon"></span>
          <div><b id="jw-amt">0</b><small>Jarvis Jewels</small></div>
        </div>
      </div>
      <div class="tb-right">
        <button class="tb-btn alert hidden" id="emergency-btn">Claim $50 lifeline</button>
        <button class="tb-btn" id="sound-btn">🔊</button>
      </div>
    </header>
    <main id="content"></main>
  </div>
</div>

<div id="dock"></div>
<div id="toasts"></div>

<div id="dev">
  <h4>Developer menu — shift + H</h4>
  <button data-dev="add100">Add $100</button>
  <button data-dev="add1000">Add $1,000</button>
  <button data-dev="add10000">Add $10,000</button>
  <button data-dev="addjewels">Add 25 jewels</button>
  <button data-dev="setbal">Set ghost balance…</button>
  <button data-dev="resetbal">Reset balance to $1,000</button>
  <button data-dev="resetwheel">Reset daily wheel</button>
  <button data-dev="resetemerg">Reset lifeline cooldown</button>
  <button data-dev="jackpot">Force wheel jackpot</button>
  <button data-dev="stopauto">Stop every autobet</button>
  <button data-dev="close">Close</button>
</div>

/* ==========================================================
   STATE
========================================================== */
const LS_KEY='jarvisbet_save_v3';
function defaultState(){
  return {
    balance:1000, ghostBalance:0, jewels:0,
    upgrades:{speed:0,slots:0,lifeline:0,wheel:0,wheelspeed:0,caseburst:0},
    stats:{played:0,wins:0,losses:0,wagered:0,returned:0,biggestWin:0,streak:0,jewelsEarned:0,vsWins:0},
    wheel:{last:0}, lifeline:{last:0}, muted:false, autoCfg:{}, player:'', board:[]
  };
}
function loadState(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){
      const p=JSON.parse(raw), d=defaultState();
      return {
        balance:typeof p.balance==='number'?p.balance:d.balance,
        ghostBalance:typeof p.ghostBalance==='number'?p.ghostBalance:0,
        jewels:typeof p.jewels==='number'?p.jewels:0,
        upgrades:Object.assign(d.upgrades,p.upgrades||{}),
        stats:Object.assign(d.stats,p.stats||{}),
        wheel:Object.assign(d.wheel,p.wheel||{}),
        lifeline:Object.assign(d.lifeline,p.lifeline||{}),
        muted:!!p.muted, autoCfg:p.autoCfg||{}, player:p.player||'', board:p.board||[]
      };
    }
  }catch(e){}
  return defaultState();
}
let state=loadState();
let forceJackpot=false, saveTimer=null;
function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>{ try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){} },140); }

/* ==========================================================
   PORTAL ACCOUNT SYNC

   localStorage stays the working save — the game never waits on
   the network. When you're signed in to the Jarvis Portal, the
   same save is mirrored to users/{uid}/games/jarvisbet, so opening
   JarvisBet in another browser picks up where you left off.

   Conflicts resolve on stats.wagered, never on balance. A balance
   can fall; total wagered only ever climbs, so the bigger number is
   always the save that has been played further. Comparing clocks
   would corrupt progress the moment a device had the wrong time.
========================================================== */
const Cloud = {
  ready:false, uid:null, name:'', pic:'', dirty:false, timer:null, status:'off',

  on(){ return this.ready && this.uid; },

  setStatus(v){
    this.status = v;
    document.querySelectorAll('[data-cloud-status]').forEach(n => n.textContent = Cloud.label());
  },

  label(){
    return this.status === 'synced'  ? 'Synced to ' + (this.name || 'your account')
         : this.status === 'saving'  ? 'Saving…'
         : this.status === 'signedout' ? 'Not signed in — this browser only'
         : this.status === 'failed'  ? 'Sync unavailable'
         : 'Local save only';
  },

  init(){
    if (typeof firebaseConfig === 'undefined' || firebaseConfig.apiKey === 'PASTE_YOURS'){
      this.setStatus('off'); return;
    }
    try{ firebase.initializeApp(firebaseConfig); }catch(e){}

    firebase.auth().onAuthStateChanged(async user => {
      if (!user){
        this.ready = false; this.uid = null; this.pic = ''; this.name = '';
        this.setStatus('signedout'); paintAvatar();
        if (currentView === 'leaderboard' || currentView === 'profile') navigate(currentView);
        return;
      }
      this.uid = user.uid;
      this.setStatus('saving');

      // display name comes from the portal account
      try{
        const doc = await firebase.firestore().collection('users').doc(user.uid).get();
        const d = doc.exists ? doc.data() : {};
        this.name = d.username || (user.email||'').split('@')[0];
        this.pic  = safePic(d.profilePic);
      }catch(e){ this.name = (user.email||'').split('@')[0]; this.pic=''; }
      paintAvatar();
      if (!state.player) { state.player = this.name; save(); }

      await this.pull();
      this.ready = true;
      this.setStatus('synced');
      this.push();

      clearInterval(this.timer);
      this.timer = setInterval(() => { if (Cloud.dirty) Cloud.push(); }, 30000);

      if (currentView === 'leaderboard' || currentView === 'profile') navigate(currentView);
    });
  },

  async pull(){
    try{
      const doc = await firebase.firestore()
        .collection('users').doc(this.uid).collection('games').doc('jarvisbet').get();
      if (!doc.exists) return;
      const remote = JSON.parse(doc.data().save || 'null');
      if (!remote || !remote.stats) return;

      const here = (state.stats && state.stats.wagered) || 0;
      const there = remote.stats.wagered || 0;
      if (there > here){
        const d = defaultState();
        state = {
          balance: typeof remote.balance === 'number' ? remote.balance : d.balance,
          ghostBalance: typeof remote.ghostBalance === 'number' ? remote.ghostBalance : 0,
          jewels: typeof remote.jewels === 'number' ? remote.jewels : 0,
          upgrades: Object.assign(d.upgrades, remote.upgrades||{}),
          stats: Object.assign(d.stats, remote.stats||{}),
          wheel: Object.assign(d.wheel, remote.wheel||{}),
          lifeline: Object.assign(d.lifeline, remote.lifeline||{}),
          muted: !!remote.muted, autoCfg: remote.autoCfg||{},
          player: remote.player || this.name, board: remote.board||[]
        };
        try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
        renderWallet(false); renderJewels();
        toast('Loaded your account save', 'win');
      }
    }catch(err){ console.warn('Cloud pull failed:', err); this.setStatus('failed'); }
  },

  async push(){
    if (!this.on()) return;
    this.dirty = false;
    try{
      await firebase.firestore()
        .collection('users').doc(this.uid).collection('games').doc('jarvisbet')
        .set({ save: JSON.stringify(state), at: Date.now() });
      this.setStatus('synced');
      Leaderboard.autoPost();
    }catch(err){
      this.dirty = true; this.setStatus('failed');
      console.warn('Cloud push failed:', err);
    }
  }
};

/* A profile picture is a value from the database like any other, so it is
   checked before it ever reaches an src attribute. */
function safePic(u){
  return (typeof u==='string' && /^(data:image\/(png|jpe?g|gif|webp);base64,[A-Za-z0-9+/=]+$|https:\/\/[^"'<>\s]+$)/i.test(u)) ? u : '';
}

function avatarHTML(size){
  const px=size||40;
  const initial=(Cloud.name||'?').slice(0,1).toUpperCase();
  return Cloud.pic
    ? `<img src="${Cloud.pic}" alt="" style="width:${px}px;height:${px}px;border-radius:50%;object-fit:cover;display:block">`
    : `<div style="width:${px}px;height:${px}px;border-radius:50%;display:grid;place-items:center;
         background:linear-gradient(150deg,#4a9fd8,#1f5f80);color:#08121a;font-weight:800;
         font-size:${Math.round(px*0.42)}px">${initial}</div>`;
}

function paintAvatar(){
  document.querySelectorAll('[data-avatar]').forEach(n=>{
    n.innerHTML=avatarHTML(parseInt(n.dataset.avatar)||40);
  });
  document.querySelectorAll('[data-cloud-name]').forEach(n=>{

function fmt(n){
  n=Math.round((n||0)*100)/100;
  const neg=n<0; n=Math.abs(n);
  return (neg?'-':'')+'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
const fmtSigned=n=>(n>=0?'+':'')+fmt(n).replace('-','');
const round2=n=>Math.round(n*100)/100;
const clampBet=n=>Math.max(0.01,round2(n));
const totalBalance=()=>round2((state.balance||0)+(state.ghostBalance||0));
const canBet=a=>typeof a==='number'&&a>0&&a<=totalBalance()+0.0001;

/* which game the current stake belongs to, with cheat credit split out */
let betCtx={game:null,stake:0,realStake:0,ghostStake:0};
function currentGameId(){ return currentView&&currentView.startsWith('game:')?currentView.slice(5):null; }
function debitStake(amt){
  const useGhost=Math.min(state.ghostBalance||0,amt);
  const useReal=round2(amt-useGhost);
  state.ghostBalance=round2((state.ghostBalance||0)-useGhost);
  state.balance=round2(Math.max(0,(state.balance||0)-useReal));
  return {real:useReal,ghost:round2(useGhost)};
}

function placeBet(amt){
  if(!canBet(amt)) return false;
  const split=debitStake(amt);
  betCtx={game:betCtx.forced||currentGameId(),stake:amt,realStake:split.real,ghostStake:split.ghost,forced:betCtx.forced};
  if(split.real>0){ state.stats.wagered+=split.real; state.stats.played++; }
  save(); renderWallet(false);
  return true;
}
function addWager(amt){
  if(!canBet(amt)) return false;
  const split=debitStake(amt);
  betCtx.stake=round2((betCtx.stake||0)+amt);
  betCtx.realStake=round2((betCtx.realStake||0)+split.real);
  betCtx.ghostStake=round2((betCtx.ghostStake||0)+split.ghost);
  if(split.real>0) state.stats.wagered+=split.real;
  save(); renderWallet(false);
  return true;
}
function resolveRound(payout,win){
  payout=Math.max(0,payout||0);
  const stake=betCtx.stake||0, realStake=betCtx.realStake||0;
  const realPayout=stake>0?round2(payout*(realStake/stake)):0;
  const ghostPayout=round2(payout-realPayout);
  if(realPayout>0){ state.balance=round2(state.balance+realPayout); state.stats.returned+=realPayout; }
  if(ghostPayout>0) state.ghostBalance=round2((state.ghostBalance||0)+ghostPayout);
  if(realStake>0){
    if(win===true){
      state.stats.wins++;
      state.stats.biggestWin=Math.max(state.stats.biggestWin,realPayout);
      state.stats.streak=state.stats.streak>=0?state.stats.streak+1:1;
    } else if(win===false){
      state.stats.losses++;
      state.stats.streak=state.stats.streak<=0?state.stats.streak-1:-1;
    }
  }
  if(realPayout>0&&realStake>0) awardJewels(betCtx.game,realPayout/realStake);
  save(); renderWallet(win===true);
}
function refundPush(amt){
  const stake=betCtx.stake||amt, realStake=betCtx.realStake||amt;
  const realRefund=stake>0?round2(amt*(realStake/stake)):amt;
  const ghostRefund=round2(amt-realRefund);
  state.balance=round2(state.balance+realRefund);
  state.ghostBalance=round2((state.ghostBalance||0)+ghostRefund);
  if(realRefund>0) state.stats.returned+=realRefund;
  save(); renderWallet(false);
}

/* ---------- Jarvis Jewels ---------- */
function jewelThreshold(gameId){
  const m=MODULES[gameId];
  return (m&&m.jewelAt)||0;                      /* 0 = this game never pays jewels */
}
function awardJewels(gameId,mult){
  const t=jewelThreshold(gameId);
  if(!t||!isFinite(mult)||mult<t) return;
  const jw=1+Math.floor(Math.log2(mult/t));
  state.jewels+=jw; state.stats.jewelsEarned+=jw;
  renderJewels();
  toast(`${jw} Jarvis Jewel${jw>1?'s':''} from a ${mult>=100?Math.round(mult):mult.toFixed(1)}× hit`,'gem');
}

function tone(f,d,t,v){
  if(state.muted) return;

    const o=c.createOscillator(),g=c.createGain();

/* ==========================================================
   AUTOBET ENGINE — multiple named sessions, pause/resume
========================================================== */
let sidSeq=1;
const Auto={
  sessions:{},
  list(){ return Object.values(this.sessions); },
  forGame(id){ return this.list().filter(s=>s.game===id); },
  running(id){ return this.forGame(id).length>0; },
  any(){ return this.list().length>0; },

  start(game,cfg){
    if(this.forGame(game).length>=maxSessionsPerGame()){
      toast(`That game already has ${maxSessionsPerGame()} autobet session${maxSessionsPerGame()>1?'s':''}. Buy an extra slot with Jewels to run more.`,'lose');
      return null;
    }
    const mod=MODULES[game];
    if(!mod||!mod.sim) return null;
    const s={
      sid:'s'+(sidSeq++), game, cfg:Object.assign({},cfg),
      bet:cfg.bet, base:cfg.bet, done:0, profit:0, wins:0, losses:0,
      lossStreak:0, worstStreak:0, best:0, status:'running',
      startedAt:Date.now(), lastAt:Date.now(), nextAt:Date.now()+cfg.interval, timer:null
    };
    this.sessions[s.sid]=s;
    state.autoCfg[game]=Object.assign({},cfg);
    save(); paintAuto();
    toast(`Autobet started on ${gameById(game).name} — one bet every ${(cfg.interval/1000).toFixed(cfg.interval<1000?1:0)}s`,'win');
    this._schedule(s,0);            /* first bet fires immediately */
    return s;
  },
  pause(sid){
    const s=this.sessions[sid]; if(!s||s.status==='paused') return;
    clearTimeout(s.timer); s.status='paused'; s.remaining=Math.max(0,s.nextAt-Date.now());
    paintAuto(); document.dispatchEvent(new CustomEvent('auto:state',{detail:{sid,game:s.game}}));
  },
  resume(sid){
    const s=this.sessions[sid]; if(!s||s.status!=='paused') return;
    s.status='running'; this._schedule(s,s.remaining||s.cfg.interval);
    paintAuto(); document.dispatchEvent(new CustomEvent('auto:state',{detail:{sid,game:s.game}}));
  },
  stop(sid,reason){
    const s=this.sessions[sid]; if(!s) return;
    clearTimeout(s.timer); delete this.sessions[sid];
    paintAuto();
    document.dispatchEvent(new CustomEvent('auto:end',{detail:{sid,id:s.game,session:s,reason}}));
    toast(`${gameById(s.game).name} autobet stopped — ${reason||'manual stop'} · ${fmtSigned(s.profit)}`, s.profit>=0?'win':'lose');
  },
  stopGame(game,reason){ this.forGame(game).forEach(s=>this.stop(s.sid,reason)); },
  stopAll(reason){ this.list().forEach(s=>this.stop(s.sid,reason)); },

  _schedule(s,delay){
    clearTimeout(s.timer);
    s.lastAt=Date.now(); s.nextAt=Date.now()+delay;
    s.timer=setTimeout(()=>this._tick(s),delay);
  },
  progress(s){
    if(s.status==='paused') return 0;
    const span=s.nextAt-s.lastAt;
    return span<=0?1:Math.min(1,(Date.now()-s.lastAt)/span);
  },
  _tick(s){
    if(s.status!=='running') return;
    const c=s.cfg, bet=Math.max(0.01,round2(s.bet));
    if(c.maxBet>0&&bet>c.maxBet) return this.stop(s.sid,'max bet reached');
    if(!canBet(bet)) return this.stop(s.sid,'balance too low');

    const mod=MODULES[s.game];
    betCtx.forced=s.game;
    placeBet(bet);
    let res;
    try{ res=mod.sim(bet,c.opts)||{payout:0}; }
    catch(err){ console.error(err); betCtx.forced=null; return this.stop(s.sid,'game error'); }
    const payout=Math.max(0,res.payout||0);
    const delta=round2(payout-bet);
    const isPush=Math.abs(payout-bet)<0.0001&&payout>0;
    const isWin=payout>bet;
    resolveRound(payout,isPush?null:isWin);
    betCtx.forced=null;

    s.done++; s.profit=round2(s.profit+delta);
    if(isWin){ s.wins++; s.lossStreak=0; s.best=Math.max(s.best,delta); }
    else if(!isPush){ s.losses++; s.lossStreak++; s.worstStreak=Math.max(s.worstStreak,s.lossStreak); }

    document.dispatchEvent(new CustomEvent('auto:round',{detail:{
      sid:s.sid, id:s.game, bet, payout, delta, win:isWin, push:isPush,
      mult:res.mult, tag:res.tag, detail:res.detail, session:s
    }}));
    paintAuto();

    if(isWin) s.bet = c.winAction==='reset'?s.base:round2(s.bet*(1+(c.winPct||0)/100));
    else if(!isPush) s.bet = c.lossAction==='reset'?s.base:round2(s.bet*(1+(c.lossPct||0)/100));
    if(s.bet<0.01) s.bet=0.01;

    if(c.rounds>0&&s.done>=c.rounds) return this.stop(s.sid,'round limit');
    if(c.stopProfit>0&&s.profit>=c.stopProfit) return this.stop(s.sid,'profit target hit');
    if(c.stopLoss>0&&s.profit<=-c.stopLoss) return this.stop(s.sid,'loss limit hit');
    if(c.stopWin>0&&delta>=c.stopWin) return this.stop(s.sid,'single win target hit');
    if(totalBalance()<=0.0001) return this.stop(s.sid,'out of balance');
    this._schedule(s,c.interval);
  }
};

function betFieldHTML(){
  return `<div class="field">
    <label>Bet amount</label>
    <div class="inp-row">
      <span class="unit pre">$</span>
      <input type="number" id="bet-input" min="0.01" step="0.01" value="10.00">
      <button class="mini" data-bet="half">½</button>
      <button class="mini" data-bet="double">2×</button>
      <button class="mini" data-bet="max">MAX</button>
    </div>
  </div>`;
}
function speedButtonsHTML(sel){
  const unlocked=allowedSpeeds();
  return SPEEDS.slice().reverse().map(ms=>{
    const ok=unlocked.includes(ms);
    const lbl=(ms/1000)+'s';
    return `<button data-interval="${ms}" ${ok?'':'disabled'} class="${sel===ms&&ok?'on':''}">${lbl}${ok?'':' 🔒'}</button>`;
  }).join('');
}
function autoFormHTML(extra){
  return `
  <div class="field">
    <label>How many bets</label>
    <div class="inp-row"><input type="number" id="a-rounds" min="0" step="1" value="0"><span class="unit">0 = endless</span></div>
  </div>
  <div class="field">
    <label>Speed</label>
    <div class="seg" id="a-speed">${speedButtonsHTML(defaultSpeed())}</div>
    <div class="note" id="speed-note"></div>
  </div>
  <div class="two">
    <div class="field">
      <label>After a win</label>
      <div class="seg"><button data-win="reset" class="on">Same bet</button><button data-win="increase">Raise</button></div>
      <div class="inp-row"><input type="number" id="a-winpct" value="100" min="0" step="5" disabled><span class="unit">% up</span></div>
    </div>
    <div class="field">
      <label>After a loss</label>
      <div class="seg"><button data-loss="reset" class="on">Same bet</button><button data-loss="increase">Raise</button></div>
      <div class="inp-row"><input type="number" id="a-losspct" value="100" min="0" step="5" disabled><span class="unit">% up</span></div>
    </div>
  </div>
  <div class="two">
    <div class="field"><label>Stop at profit</label><div class="inp-row"><span class="unit pre">$</span><input type="number" id="a-stopprofit" min="0" step="10" value="0"></div></div>
    <div class="field"><label>Stop at loss</label><div class="inp-row"><span class="unit pre">$</span><input type="number" id="a-stoploss" min="0" step="10" value="0"></div></div>
  </div>
  <div class="adv-toggle" id="adv-toggle"><span>More rules</span><span id="adv-caret">+</span></div>
  <div class="adv-body hidden" id="adv-body">
    <div class="two">
      <div class="field"><label>Never bet above</label><div class="inp-row"><span class="unit pre">$</span><input type="number" id="a-maxbet" min="0" step="10" value="0"></div></div>
      <div class="field"><label>Stop after a win of</label><div class="inp-row"><span class="unit pre">$</span><input type="number" id="a-stopwin" min="0" step="10" value="0"></div></div>
    </div>
    <div class="note">Every box set to 0 is switched off. "Raise" multiplies the current bet — 100% doubles it, 50% adds half.</div>
  </div>
