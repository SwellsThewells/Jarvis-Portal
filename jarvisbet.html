          <button class="act" id="vs-create" style="margin-top:10px">Create lobby</button>
        </div>
        <div class="field">
          <label>Join with a code</label>
          <div class="inp-row">
            <input type="text" id="vs-code" placeholder="ABCD" maxlength="4"
                   style="text-transform:uppercase;font-family:var(--f-num);letter-spacing:3px">
            <button class="mini" id="vs-join">Join</button>
          </div>
          <div class="note" style="margin-top:10px">Your friend sends you their four-character code. Both of you need enough real balance for the stake.</div>
        </div>
      </div>`;

    root.querySelector('#vs-create').onclick=()=>{
      const g=root.querySelector('#vs-game').value;
      const st=round2(parseFloat(root.querySelector('#vs-stake').value)||0);
      if(st<=0) return toast('Set a stake first.','lose');
      MP.create(g,st);
    };
    root.querySelector('#vs-join').onclick=()=>
      MP.join(root.querySelector('#vs-code').value, 0);
    return;
  }

  /* ---- in a lobby ---- */
  const ids=Object.keys(l.players||{});
  const me=l.players[Cloud.uid]||{};
  const oppId=ids.find(i=>i!==Cloud.uid);
  const opp=oppId?l.players[oppId]:null;
  const g=MP.games[l.game]||{name:l.game};
  const res=MP.lastResult;

  if(l.game==='pool'&&(l.status==='live'||l.status==='done')&&l.pool){
    return paintPoolLobby(root,l,ids,me,oppId,opp);
  }

  const phase =
      l.status==='waiting' ? (ids.length<2?'Waiting for an opponent':'Both players must ready up')
    : l.status==='commit'  ? 'Locking in secret seeds…'
    : l.status==='rolling' ? 'Rolling…'
    : l.status==='void'    ? 'Match void'
    : 'Round complete';

  root.innerHTML=`
    <div class="row-head"><h2>${esc(g.name)}</h2><span>${esc(phase)}</span></div>

    <div class="masthead" style="margin-bottom:14px">
      <div>
        <h1 style="font-size:22px;letter-spacing:4px;font-family:var(--f-num)">${esc(MP.code)}</h1>
        <p>Share that code. Stake is <b>${fmt(l.stake)}</b> each — the winner takes <b>${fmt(l.stake*2)}</b>.</p>
      </div>
      <div class="mast-stats">
        <div><small>You</small><b>${esc(me.name||'You')}</b></div>
        <div><small>Opponent</small><b>${opp?esc(opp.name):'—'}</b></div>
      </div>
    </div>

    <div class="split2" style="margin-bottom:14px">
      <div class="stat">
        <small>${esc(me.name||'You')}${me.ready?' · ready':''}</small>
        <b style="font-size:20px">${res?esc(res.mine.label):(me.ready?'Ready':'Not ready')}</b>
      </div>
      <div class="stat">
        <small>${opp?esc(opp.name):'Empty seat'}${opp&&opp.ready?' · ready':''}</small>
        <b style="font-size:20px">${res?esc(res.other.label):(opp?(opp.ready?'Ready':'Not ready'):'—')}</b>
      </div>
    </div>

    ${res?`<div class="note" style="margin-bottom:12px">
      ${res.mine.score>res.other.score?'<b class="pos">You won the pot.</b>'
       :res.mine.score<res.other.score?'<b class="neg">'+esc(res.otherName)+' took it.</b>'
       :'<b>Draw — stakes returned.</b>'}
    </div>`:''}

    <div class="row-acts">
      ${l.status==='waiting'&&ids.length===2
        ? `<button class="act ${me.ready?'act-amber':''}" id="vs-ready">${me.ready?'Cancel ready':'Ready up'}</button>` : ''}
      ${l.status==='done'||res ? `<button class="act" id="vs-again">Rematch</button>` : ''}
      <button class="mini" id="vs-leave">Leave lobby</button>
    </div>

    <div class="note" style="margin-top:12px">
      Each side commits a hashed secret before either reveals, so the seed can't be steered by
      either player — and each client checks the other's reveal against the commitment it already sent.
      Balances still live in each browser, so play with people you trust.
    </div>`;

  const rb=root.querySelector('#vs-ready');
  if(rb) rb.onclick=()=>MP.setReady(!me.ready);
  const ab=root.querySelector('#vs-again');
  if(ab) ab.onclick=()=>MP.rematch();
  root.querySelector('#vs-leave').onclick=()=>MP.leave();
}

/* ==========================================================
   8-BALL DUEL — live 1v1 canvas UI (Versus)
   The whole #vs-root is rebuilt on every lobby snapshot (same
   pattern the rest of Versus uses), so all state that must
   survive a rebuild lives on this module-level object instead
   of inside the mount closure.
========================================================== */
const POOL_MAX_SHOT_SPEED=900;
const PoolUI={
  syncedSeq:-1, workingBalls:null, animating:false, aimAngle:-Math.PI*0.85, aimPower:0,
  leaveRegistered:false, cancelAnim:null
};
function poolResetUI(){
  if(PoolUI.cancelAnim){ try{PoolUI.cancelAnim();}catch(e){} }
  PoolUI.syncedSeq=-1; PoolUI.workingBalls=null; PoolUI.animating=false;
  PoolUI.aimPower=0; PoolUI.cancelAnim=null;
}
function paintPoolLobby(root,l,ids,me,oppId,opp){
  const myId=Cloud.uid, p=l.pool;
  const esc=t=>String(t==null?'':t).replace(/</g,'&lt;');
  const myGroup=p.groupOf[myId], oppGroup=oppId?p.groupOf[oppId]:null;
  const myTurn=l.status==='live'&&p.turn===myId&&!p.winner;

  if(!PoolUI.leaveRegistered){ PoolUI.leaveRegistered=true; onLeave(()=>{ poolResetUI(); PoolUI.leaveRegistered=false; }); }

  root.innerHTML=`
    <div class="row-head"><h2>8-Ball Duel</h2>
      <span>${l.status==='done'?'Match complete':(myTurn?'Your shot':(esc(opp?opp.name:'Opponent')+"'s shot"))}</span></div>
    <div class="masthead" style="margin-bottom:12px"><div>
      <h1 style="font-size:19px">${esc(me.name||'You')}${myGroup?' · '+myGroup+'s':''}
        <span style="opacity:.5;font-weight:400"> vs </span>
        ${esc(opp?opp.name:'Opponent')}${oppGroup?' · '+oppGroup+'s':''}</h1>
      <p>Stake ${fmt(l.stake)} each — winner takes ${fmt(l.stake*2)}.</p>
    </div></div>
    <div class="pv-table-box">
      <div class="pv-canvas-box"><canvas class="pv-canvas" id="pv-cv"></canvas></div>
      <div class="pv-turn"><b class="${/foul|scratch|early|loss/i.test(p.message||'')?'pv-foul':''}">${esc(p.message||'')}</b></div>
      ${l.status==='live'&&!p.winner&&myTurn?`<div class="pv-controls">
          <div class="pv-power" id="pv-power"><div class="pv-power-fill" id="pv-power-fill"></div>
            <div class="pv-power-label" id="pv-power-label">Power 0%</div></div>
          <button class="act pv-shoot" id="pv-shoot" disabled>Shoot</button>
        </div>
        <div class="note" style="text-align:center">${p.ballInHand?'Ball in hand — click the table to place the cue ball, aim with your mouse, drag the bar for power.':'Aim with your mouse, drag the bar for power, then shoot.'}</div>`
      :(l.status==='live'&&!p.winner?`<div class="note" style="text-align:center">Waiting for ${esc(opp?opp.name:'your opponent')} to shoot…</div>`:'')}
    </div>
    <div class="row-acts" style="margin-top:14px">
      ${l.status==='done'?`<button class="act" id="vs-again">Rematch</button>`:''}
      <button class="mini" id="vs-leave">Leave lobby</button>
    </div>
    <div class="note" style="margin-top:10px">Simplified bar rules: groups are assigned automatically off the first
      ball you legally pot, ball-in-hand can be placed anywhere after a foul, and no cushion/rail is required on the break beyond contact.</div>`;

  root.querySelector('#vs-leave').onclick=()=>{ poolResetUI(); MP.leave(); };
  const again=root.querySelector('#vs-again'); if(again) again.onclick=()=>{ poolResetUI(); MP.rematch(); };

  if(p.winner && !MP.poolSettled){
    MP.poolSettled=true;
    const iWon=p.winner===myId;
    resolveRound(iWon?l.stake*2:0, iWon);
    toast(iWon?('You won the pot — '+fmt(l.stake*2)):('Lost the duel — '+fmt(l.stake)), iWon?'win':'lose');
    iWon?sfx.win():sfx.lose();
  }

  const cv=root.querySelector('#pv-cv'); if(!cv) return;
  const g=cv.getContext('2d');
  function draw(){
    poolFitCanvasCSS(cv,g);
    poolDrawTable(g);
    if(PoolUI.workingBalls) poolDrawBalls(g,PoolUI.workingBalls);
    const cue=PoolUI.workingBalls&&PoolUI.workingBalls.cue;
    if(cue&&!cue.potted&&myTurn&&!PoolUI.animating&&!p.winner){
      g.save(); g.strokeStyle='rgba(255,255,255,.25)'; g.setLineDash([6,6]); g.lineWidth=1.5;
      g.beginPath(); g.moveTo(cue.x,cue.y);
      g.lineTo(cue.x+Math.cos(PoolUI.aimAngle)*900,cue.y+Math.sin(PoolUI.aimAngle)*900);
      g.stroke(); g.restore();
      poolDrawCue(g,cue,PoolUI.aimAngle,10+PoolUI.aimPower*55);
    }
  }

  const seq=p.shotSeq||0;
  if(seq!==PoolUI.syncedSeq){
    const isMyEcho=(MP.poolMySeq===seq);
    if(isMyEcho||!PoolUI.workingBalls){
      /* no genuine "before" state to replay from (either it's my own echo, or this
         is a cold start — first paint after a reload/join) — snap straight to truth */
      PoolUI.workingBalls=poolBallsFromFB(p.balls); PoolUI.syncedSeq=seq; draw();
    } else if(p.lastShot && seq>0){
      const before=PoolUI.workingBalls;
      const shot=p.lastShot, speed=shot.power*POOL_MAX_SHOT_SPEED;
      PoolUI.animating=true;
      PoolUI.cancelAnim=poolRunLive(before,{cue:{vx:Math.cos(shot.angle)*speed,vy:Math.sin(shot.angle)*speed}},{},
        ()=>draw(),
        ()=>{ PoolUI.workingBalls=poolBallsFromFB(p.balls); PoolUI.syncedSeq=seq; PoolUI.animating=false; PoolUI.cancelAnim=null; draw(); });
    } else {
      PoolUI.workingBalls=poolBallsFromFB(p.balls); PoolUI.syncedSeq=seq;
    }
  }
  draw();
  const ro=()=>draw(); window.addEventListener('resize',ro);

  if(!myTurn||PoolUI.animating||p.winner) return;

  cv.addEventListener('pointermove',e=>{
    if(PoolUI.animating) return;
    const rect=cv.getBoundingClientRect(), scale=rect.width/POOL_W;
    const mx=(e.clientX-rect.left)/scale, my=(e.clientY-rect.top)/scale;
    const cue=PoolUI.workingBalls.cue;
    if(cue&&!cue.potted) PoolUI.aimAngle=Math.atan2(my-cue.y,mx-cue.x);
    draw();
  });
  cv.addEventListener('click',e=>{
    if(PoolUI.animating||!p.ballInHand) return;
    const rect=cv.getBoundingClientRect(), scale=rect.width/POOL_W;
    const mx=(e.clientX-rect.left)/scale, my=(e.clientY-rect.top)/scale;
    let ok=mx>POOL_MINX&&mx<POOL_MAXX&&my>POOL_MINY&&my<POOL_MAXY;
    if(ok) Object.keys(PoolUI.workingBalls).forEach(id=>{
      if(id==='cue') return; const b=PoolUI.workingBalls[id];
      if(!b.potted&&Math.hypot(mx-b.x,my-b.y)<POOL_BALL_R*2.1) ok=false;
    });
    if(ok){ PoolUI.workingBalls.cue.x=mx; PoolUI.workingBalls.cue.y=my; draw(); sfx.chip(); }
  });
  const powerBar=root.querySelector('#pv-power'), fill=root.querySelector('#pv-power-fill'),
        label=root.querySelector('#pv-power-label'), shootBtn=root.querySelector('#pv-shoot');
  let dragging=false;
  function setPower(e){
    const r=powerBar.getBoundingClientRect();
    const pct=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
    PoolUI.aimPower=pct;
    fill.style.width=(pct*100)+'%'; label.textContent='Power '+Math.round(pct*100)+'%';
    shootBtn.disabled=pct<=0.03; draw();
  }
  powerBar.addEventListener('pointerdown',e=>{ dragging=true; powerBar.setPointerCapture(e.pointerId); setPower(e); });
  powerBar.addEventListener('pointermove',e=>{ if(dragging) setPower(e); });
  const stopDrag=()=>dragging=false;
  powerBar.addEventListener('pointerup',stopDrag); powerBar.addEventListener('pointercancel',stopDrag);

  shootBtn.addEventListener('click',()=>{
    if(PoolUI.animating||PoolUI.aimPower<=0.03) return;
    PoolUI.animating=true; shootBtn.disabled=true;
    const angle=PoolUI.aimAngle, power=PoolUI.aimPower, speed=power*POOL_MAX_SHOT_SPEED;
    const wasBreak=(p.shotSeq||0)===0;
    sfx.chip();
    poolRunLive(PoolUI.workingBalls,{cue:{vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed}},{},
      ()=>draw(),
      result=>{
        const outcome=poolApplyShot({balls:PoolUI.workingBalls, groupOf:p.groupOf, tableOpen:p.tableOpen,
          shooterId:myId, opponentId:oppId, physRes:result, wasBreak});
        const nextSeq=(p.shotSeq||0)+1;
        let upd={shotSeq:nextSeq, lastShot:{by:myId,angle,power}, message:outcome.message, turn:outcome.nextTurn};
        if(outcome.reRack){
          PoolUI.workingBalls=poolFreshBalls();
          upd.balls=poolBallsToFB(PoolUI.workingBalls); upd.tableOpen=true; upd.ballInHand=false;
        } else {
          upd.balls=poolBallsToFB(PoolUI.workingBalls);
          upd.tableOpen=outcome.tableOpen; upd.groupOf=outcome.groupOf; upd.ballInHand=outcome.ballInHand;
          if(outcome.winner) upd.winner=outcome.winner;
        }
        MP.poolMySeq=nextSeq;
        PoolUI.animating=false;
        if(MP.ref) MP.ref.child('pool').update(upd);
        draw();
      });
  });
}

    return `<div class="up-card">

      <div class="up-buy">

        <button data-buy="${key}" ${maxed||state.jewels<cost?'disabled':''}>${maxed?'Maxed':'Unlock'}</button>
      </div>

  }).join('');
  const sources=GAMES.filter(g=>MODULES[g.id]&&MODULES[g.id].jewelAt)
    .map(g=>`<div class="line"><span>${g.name}</span><b class="gemc">${MODULES[g.id].jewelAt}×+</b></div>`).join('');
  content.innerHTML=`
    <div class="row-head"><h2>Jarvis Upgrades</h2><span>${state.jewels} jewels · ${state.stats.jewelsEarned} earned all time</span></div>
    <div class="masthead" style="margin-bottom:14px">
      <div>
        <h1 style="font-size:24px">How Jewels work</h1>
        <p>Land a big enough multiplier and the round pays a Jarvis Jewel on top of the cash. The bar is set per game — a 40× on the reels is rare, a 10× on Plinko less so — and every doubling past the bar pays one more. Jewels only buy quality-of-life upgrades, never better odds.</p>
      </div>
    </div>
    <div class="up-grid">${cards}</div>
    <div class="row-head"><h2>Where jewels drop</h2><span>Multiplier needed</span></div>
    <div class="readout" style="max-width:460px">${sources}</div>`;
  content.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{
    const key=b.dataset.buy,u=UPGRADES[key],lv=upLevel(key);
    if(lv>=u.max) return;
    const cost=u.costs[lv];

    state.jewels-=cost; state.upgrades[key]=lv+1;
    save(); renderJewels(); sfx.win();
    toast(`${u.name} upgraded — ${u.detail(lv+1)}`,'gem');
    renderUpgrades(content);
  });
}

/* ==========================================================
   DAILY WHEEL
========================================================== */
const WHEEL=[{v:100,w:22},{v:200,w:18},{v:300,w:16},{v:500,w:12},{v:750,w:9},{v:1000,w:7},{v:2500,w:4},{v:5000,w:2},{v:10000,w:1}];
function pickWheel(){
  const t=WHEEL.reduce((a,r)=>a+r.w,0); let r=Math.random()*t;
  for(let i=0;i<WHEEL.length;i++){ if(r<WHEEL[i].w) return i; r-=WHEEL[i].w; }
  return 0;
}
function countdown(ms){
  if(ms<=0) return '00:00:00';
  const h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000),s=Math.floor(ms%60000/1000);
  return [h,m,s].map(x=>String(x).padStart(2,'0')).join(':');
}
let wheelIv=null;
function renderWheel(content){
  content.classList.add('fixed');
  clearInterval(wheelIv);
  const bonus=[0,0.15,0.30][upLevel('wheel')];
  const hours=WHEEL_HOURS[upLevel('wheelspeed')];
  const total=WHEEL.reduce((a,r)=>a+r.w,0);
  /* slice size matches the real chance — the jackpot wedge is thin because it is rare */
  let deg=0;
  const slices=WHEEL.map((r,idx)=>{
    const span=360*r.w/total, from=deg; deg+=span;
    return {v:r.v, w:r.w, from, span, mid:from+span/2, idx};
  });
  const stops=slices.map(sl=>`${sl.v>=10000?'#d9a531':(sl.idx%2?'#15213f':'#b81d28')} ${sl.from.toFixed(2)}deg ${(sl.from+sl.span).toFixed(2)}deg`);
  const labels=slices.map(sl=>{
    const short=sl.v>=1000?('$'+(sl.v/1000)+'k'):('$'+sl.v);
    /* push the text out along the middle of its own wedge */
    const flip=sl.mid>180;
    return `<div class="dw-lbl${sl.v>=10000?' jack':''}" style="transform:rotate(${sl.mid-90}deg) translate(${flip?128:52}px,${flip?7:-7}px)${flip?' rotate(180deg)':''}">${short}</div>`;
  }).join('');
  content.innerHTML=`<div class="game-wrap">
    <div class="game-bar"><h2>Daily Wheel <span class="sub">One free spin every ${hours} hours</span></h2>
      <button class="ghost-btn" data-nav="home">Lobby</button></div>
    <div class="game-body">
      <div class="panel"><div class="panel-scroll">
        <div class="readout">${WHEEL.map(r=>`<div class="line"><span>${(r.w/total*100).toFixed(r.w/total<0.02?2:1)}% chance</span><b class="${r.v>=10000?'gold':''}">$${r.v.toLocaleString()}</b></div>`).join('')}</div>
        ${bonus?`<div class="note">Wheel boost active: <b>+${Math.round(bonus*100)}%</b> on every prize.</div>`:''}
        <button class="act" id="dw-spin">Spin the wheel</button>
        <div class="note" id="dw-cool"></div>
        ${upLevel('wheelspeed')<3?'<div class="note">Shorten the wait with <b>Daily wheel cooldown</b> in Jarvis Upgrades — down to every 2 hours.</div>':''}
      </div></div>
      <div class="stage">
        <div class="banner" id="banner"></div>
        <div class="dw-wrap"><div class="pointer"></div>
          <div class="dw" id="dw" style="background:conic-gradient(${stops.join(',')})">${labels}</div>
          <div class="hub" id="dw-hub" style="font-size:13px">SPIN</div></div>
      </div>
    </div></div>`;
  const btn=content.querySelector('#dw-spin'),cool=content.querySelector('#dw-cool');
  const wheel=content.querySelector('#dw'),banner=content.querySelector('#banner');
  const WAIT=hours*3600*1000;
  function tick(){
    const left=WAIT-(Date.now()-state.wheel.last);
    if(state.wheel.last===0||left<=0){ btn.disabled=false; cool.textContent='Your free spin is ready.'; }
    else{ btn.disabled=true; cool.textContent='Next free spin in '+countdown(left); }
  }
  tick(); wheelIv=setInterval(tick,1000);
  onLeave(()=>clearInterval(wheelIv));
  btn.addEventListener('click',()=>{
    if(btn.disabled) return;
    btn.disabled=true;
    const idx=forceJackpot?WHEEL.length-1:pickWheel();
    forceJackpot=false;
    const sl=slices[idx];
    const prize=Math.round(WHEEL[idx].v*(1+bonus));
    /* stop anywhere inside the wedge so the pointer never sits on a seam */
    const inside=sl.from+sl.span*(0.2+Math.random()*0.6);
    const rot=(6+Math.floor(Math.random()*3))*360+(360-inside);
    sfx.spin(); wheel.style.transform=`rotate(${rot}deg)`;
    setTimeout(()=>{
      content.querySelector('#dw-hub').textContent='$'+prize.toLocaleString();
      state.wheel.last=Date.now();
      state.balance=round2(state.balance+prize); save(); renderWallet(true);
      banner.textContent=WHEEL[idx].v>=10000?`Jackpot — $${prize.toLocaleString()} added`:`$${prize.toLocaleString()} added to your balance`;
      banner.className='banner show win';
      if(WHEEL[idx].v>=10000){ sfx.jackpot(); toast('Jackpot on the Daily Wheel.','gold'); } else sfx.win();
      tick();
    },4300);
  });
}

/* ==========================================================
   FLOATING P/L WIDGET — live session profit/loss chart.
   Draggable by its header, resizable from the corner handle,
   minimizable, and remembers position/size/state per browser.
========================================================== */
(function(){
  const MAX_POINTS=400;
  const baseline=totalBalance();
  let hist=[{t:Date.now(),v:0}];

  document.body.insertAdjacentHTML('beforeend',`
    <div class="pl-widget" id="pl-widget">
      <div class="pl-head" id="pl-head">
        <span class="pl-dot" id="pl-dot"></span>
        <span class="pl-title">Session P/L</span>
        <span class="pl-value" id="pl-value">+$0.00</span>
        <button class="pl-btn" id="pl-min" title="Minimize">–</button>
      </div>
      <div class="pl-body" id="pl-body">
        <canvas id="pl-cv"></canvas>
        <div class="pl-empty" id="pl-empty">Play a round to start the chart</div>
      </div>
      <div class="pl-resize" id="pl-resize" title="Drag to resize"></div>
    </div>`);

  const widget=document.getElementById('pl-widget');
  const head=document.getElementById('pl-head');
  const body=document.getElementById('pl-body');
  const cv=document.getElementById('pl-cv'), g=cv.getContext('2d');
  const valueEl=document.getElementById('pl-value'), dotEl=document.getElementById('pl-dot');
  const minBtn=document.getElementById('pl-min');
  const resizeHandle=document.getElementById('pl-resize');
  const emptyEl=document.getElementById('pl-empty');

  function loadNum(key,def){ const v=parseFloat(localStorage.getItem(key)); return isFinite(v)?v:def; }
  let minimized=localStorage.getItem('jarvisbet_pl_min')!=='0';
  const savedLeft=localStorage.getItem('jarvisbet_pl_left');
  const savedTop=localStorage.getItem('jarvisbet_pl_top');
  if(savedLeft!==null&&savedTop!==null){
    widget.style.left=Math.max(0,parseFloat(savedLeft))+'px';
    widget.style.top=Math.max(0,parseFloat(savedTop))+'px';
    widget.style.right='auto'; widget.style.bottom='auto';
  }
  widget.style.width=loadNum('jarvisbet_pl_w',248)+'px';
  widget.style.height=loadNum('jarvisbet_pl_h',150)+'px';

  function setMinimized(v){
    minimized=v;
    widget.classList.toggle('min',minimized);
    minBtn.textContent=minimized?'+':'–';
    try{localStorage.setItem('jarvisbet_pl_min',minimized?'1':'0');}catch(e){}
    if(!minimized){ sizeCanvas(); paint(); }
  }

  /* ---- drag to move, by the header ---- */
  (function(){
    let dragging=false,sx=0,sy=0,ox=0,oy=0;
    function onMove(e){
      if(!dragging) return;
      const x=e.touches?e.touches[0].clientX:e.clientX;
      const y=e.touches?e.touches[0].clientY:e.clientY;
      let nx=ox+(x-sx), ny=oy+(y-sy);
      nx=Math.max(4,Math.min(window.innerWidth-40,nx));
      ny=Math.max(4,Math.min(window.innerHeight-30,ny));
      widget.style.left=nx+'px'; widget.style.top=ny+'px'; widget.style.right='auto'; widget.style.bottom='auto';
    }
    function onUp(){
      if(!dragging) return;
      dragging=false; widget.classList.remove('dragging');
      try{
        localStorage.setItem('jarvisbet_pl_left',parseFloat(widget.style.left));
        localStorage.setItem('jarvisbet_pl_top',parseFloat(widget.style.top));
      }catch(e){}
      window.removeEventListener('pointermove',onMove);
      window.removeEventListener('pointerup',onUp);
    }
    head.addEventListener('pointerdown',e=>{
      if(e.target.closest('.pl-btn')) return;
      e.preventDefault(); dragging=true; widget.classList.add('dragging');
      const r=widget.getBoundingClientRect();
      sx=e.touches?e.touches[0].clientX:e.clientX; sy=e.touches?e.touches[0].clientY:e.clientY;
      ox=r.left; oy=r.top;
      window.addEventListener('pointermove',onMove);
      window.addEventListener('pointerup',onUp);
    });
  })();

  /* ---- drag the corner handle to resize ---- */
  (function(){
    let resizing=false,sx=0,sy=0,sw=0,sh=0;
    function onMove(e){
      if(!resizing) return;
      const x=e.touches?e.touches[0].clientX:e.clientX;
      const y=e.touches?e.touches[0].clientY:e.clientY;
      const w=Math.max(180,Math.min(window.innerWidth-40,sw+(x-sx)));
      const h=Math.max(96,Math.min(window.innerHeight-40,sh+(y-sy)));
      widget.style.width=w+'px'; widget.style.height=h+'px';
      sizeCanvas(); paint();
    }
    function onUp(){
      if(!resizing) return;
      resizing=false; widget.classList.remove('resizing');
      try{
        localStorage.setItem('jarvisbet_pl_w',parseFloat(widget.style.width));
        localStorage.setItem('jarvisbet_pl_h',parseFloat(widget.style.height));
      }catch(e){}
      window.removeEventListener('pointermove',onMove);
      window.removeEventListener('pointerup',onUp);
    }
    resizeHandle.addEventListener('pointerdown',e=>{
      e.preventDefault(); e.stopPropagation(); resizing=true; widget.classList.add('resizing');
      sx=e.touches?e.touches[0].clientX:e.clientX; sy=e.touches?e.touches[0].clientY:e.clientY;
      const r=widget.getBoundingClientRect(); sw=r.width; sh=r.height;
      window.addEventListener('pointermove',onMove);
      window.addEventListener('pointerup',onUp);
    });
  })();

  minBtn.addEventListener('click',e=>{ e.stopPropagation(); setMinimized(!minimized); });

  /* ---- chart ---- */
  let W=0,H=0;
  function sizeCanvas(){
    const r=body.getBoundingClientRect();
    const dpr=window.devicePixelRatio||1;
    W=r.width; H=r.height;
    if(W<=0||H<=0) return;
    cv.width=W*dpr; cv.height=H*dpr; g.setTransform(dpr,0,0,dpr,0,0);
  }
  function paint(){
    if(minimized||W<=0||H<=0||hist.length<2) return;
    g.clearRect(0,0,W,H);
    const pad=10;
    const vals=hist.map(p=>p.v);
    let maxV=Math.max(...vals,0.01), minV=Math.min(...vals,-0.01);
    if(maxV-minV<0.02){ maxV+=0.5; minV-=0.5; }
    const range=maxV-minV;
    const x=i=>pad+(W-pad*2)*(i/(hist.length-1));
    const y=v=>pad+(H-pad*2)*(1-(v-minV)/range);
    const zeroY=y(0);
    g.strokeStyle='rgba(21,33,63,.35)'; g.setLineDash([4,4]); g.lineWidth=1;
    g.beginPath(); g.moveTo(pad,zeroY); g.lineTo(W-pad,zeroY); g.stroke();
    g.setLineDash([]);
    function seg(xa,ya,xb,yb,pos){
      const col=pos?'#137a44':'#b81d28';
      g.beginPath(); g.moveTo(xa,ya); g.lineTo(xb,yb); g.lineTo(xb,zeroY); g.lineTo(xa,zeroY); g.closePath();
      g.fillStyle=pos?'rgba(19,122,68,.14)':'rgba(184,29,40,.13)'; g.fill();
      g.beginPath(); g.moveTo(xa,ya); g.lineTo(xb,yb);
      g.strokeStyle=col; g.lineWidth=2; g.lineJoin='round'; g.stroke();
    }
    for(let i=0;i<hist.length-1;i++){
      const v0=hist[i].v, v1=hist[i+1].v;
      const x0=x(i), x1=x(i+1), y0=y(v0), y1=y(v1);
      if((v0>=0)===(v1>=0)){
        seg(x0,y0,x1,y1,v0>=0);
      } else {
        const t=v0/(v0-v1);
        const xm=x0+(x1-x0)*t;
        seg(x0,y0,xm,zeroY,v0>=0);
        seg(xm,zeroY,x1,y1,v1>=0);
      }
    }
  }
  function updateHeader(){
    const cur=hist[hist.length-1].v;
    valueEl.textContent=(cur>=0?'+':'-')+'$'+Math.abs(cur).toFixed(2);
    valueEl.classList.toggle('pos',cur>=0);
    valueEl.classList.toggle('neg',cur<0);
    dotEl.classList.toggle('neg',cur<0);
  }

  window.plTrack=function(){
    const v=round2(totalBalance()-baseline);
    const last=hist[hist.length-1];
    if(!last||last.v!==v){
      hist.push({t:Date.now(),v});
      if(hist.length>MAX_POINTS) hist.shift();
    }
    if(hist.length>=2) emptyEl.style.display='none';
    updateHeader();
    if(!minimized) paint();
  };

  window.addEventListener('resize',()=>{ sizeCanvas(); paint(); });
  setMinimized(minimized);
  sizeCanvas();
  updateHeader();
})();

/* ==========================================================

   Originals stop feeling like a solo machine. House regulars sit

  {name:'Midnight Mae',c:'#7d0f17',style:'regular'},

];
const STAKES={grinder:[1,2,2,5,5,10],regular:[10,20,25,25,50,100],whale:[100,250,250,500,1000],degen:[5,25,100,250,500,777]};
const pickOf=a=>a[Math.floor(Math.random()*a.length)];
const firstName=n=>n.replace(/^The /,'').split(' ')[0];
const originalIds=()=>GAMES.filter(g=>g.cat==='originals'&&MODULES[g.id]&&MODULES[g.id].sim).map(g=>g.id);
function npcOpts(g){
  const r=Math.random;
  switch(g){
    case 'crash': case 'limbo': return {target:pickOf([1.3,1.5,1.5,2,2,2,3,5,10,25,100])};
    case 'horse': return {pick:r()<.5?1:(r()<.55?2:1+Math.ceil(r()*6))};
    case 'cases': return {caseId:pickOf(['starter','starter','field','vault','blackbox'])};
    case 'mines': { const size=25,n=pickOf([1,2,3,4,6]),pool=[...Array(size).keys()],ch=[];
      while(ch.length<n) ch.push(pool.splice(Math.floor(r()*pool.length),1)[0]);
      return {board:5,size,mines:pickOf([1,3,3,5,10]),pickMode:'mine',chosen:ch}; }
    case 'plinko': return {rows:pickOf([8,12,12,16]),risk:pickOf(['low','medium','medium','high'])};
    case 'tower': return {mode:pickOf(['easy','medium','hard']),target:pickOf([2,3,3,4,6,8])};
    case 'chicken': return {diff:pickOf(['easy','medium','medium','hard','daredevil']),target:pickOf([2,3,5,5,8])};
    case 'dice': return {mode:'under',lo:pickOf([25,49.5,50,66,90]),hi:75};
    case 'coinflip': return {side:pickOf(['heads','tails'])};
    case 'higherlower': return {target:pickOf([1.5,2,2,3,5])};
    case 'keno': { const n=pickOf([2,3,4,5,6,8,10]),pool=[...Array(40)].map((_,i)=>i+1),p=[];
      while(p.length<n) p.push(pool.splice(Math.floor(r()*pool.length),1)[0]); return {picks:p}; }
    case 'rps': return {throw:pickOf(['rock','paper','scissors'])};
    case 'darts': return {risk:pickOf(['low','medium','high'])};
    case 'pump': return {risk:pickOf(['low','medium','high']),target:pickOf([2,3,5,5,8])};
    case 'colordraw': return {color:pickOf(['red','blue','gold'])};
    case 'numberdraw': return {pick:1+Math.floor(r()*12)};
  }
  return {};
}

/* ---------- the Jarvis Pot: a must-drop progressive ---------- */
const POT_KEY='jarvisbet_pot', POT_SEED=2500, POT_CAP=10000, POT_FULL_SHARE_BET=100;
const Pot={
  v:POT_SEED, shown:POT_SEED, last:null,
  load(){ try{ const d=JSON.parse(localStorage.getItem(POT_KEY)||'null'); if(d&&isFinite(d.v)){ this.v=Math.max(POT_SEED,d.v); this.last=d.last||null; } }catch(e){} this.shown=this.v; },
  save(){ try{ localStorage.setItem(POT_KEY,JSON.stringify({v:round2(this.v),last:this.last})); }catch(e){} },
  add(x){ this.v=Math.min(POT_CAP*1.25,this.v+x); },
  mustDrop(){ return this.v>=POT_CAP; },
  /* your odds never change with the pot's size, so an idle tab filling it
     overnight can't be farmed; past the cap it must drop, and it usually
     goes to a regular within a minute. Adds roughly 0.25% back per bet. */
  userChance(){ return 1/20000; },
  npcChance(){ return this.mustDrop()?1/45:1/90000; },
  take(share){
    const amt=round2(this.v*Math.min(1,share));
    this.v=Math.max(POT_SEED,round2(this.v-amt));
    this.save(); return amt;
  }
};

/* ---------- casino floor ambience ---------- */
const Ambience={
  on:(()=>{ try{ return localStorage.getItem('jarvisbet_ambience')!=='0'; }catch(e){ return true; } })(),
  nodes:null, chimeT:null,
  start(){
    if(this.nodes||!this.on||state.muted) return;
    const c=audioCtx(); if(!c) return;
    try{
      const len=c.sampleRate*3, buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
      let last=0; for(let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+0.02*w)/1.02; d[i]=last*3.2; }
      const src=c.createBufferSource(), lp=c.createBiquadFilter(), g=c.createGain();
      src.buffer=buf; src.loop=true; lp.type='lowpass'; lp.frequency.value=520; g.gain.value=0;
      g.gain.linearRampToValueAtTime(0.05,c.currentTime+2);
      src.connect(lp); lp.connect(g); g.connect(c.destination); src.start();
      this.nodes={src,g};
      const chime=()=>{
        if(!this.nodes) return;
        this.chimeT=setTimeout(chime,2500+Math.random()*6000);

const Floor={

<script>
/* ==========================================================
   Q + S KEYBIND — SINGLE PLAYER ONLY
   Hold Q and S together to guarantee the next single-player
   bet wins. Cannot arm while viewing Versus, is cleared the
   moment Versus is opened, and is voided on any Versus stake
   — it can never affect a real head-to-head match.
========================================================== */
window.__lucky=false;
window.__luckyRound=false;
// Q+S indicator: small teal pixel in the bottom corner.
// Flashes green when Lucky Charm arms.
(function(){
  const dot=document.createElement('div');
  dot.id='qs-indicator';
  dot.setAttribute('aria-label','Lucky Charm status');
  dot.style.cssText='position:fixed;right:7px;bottom:7px;width:4px;height:4px;border-radius:50%;background:#18c7c0;opacity:.72;z-index:2147483647;pointer-events:none;box-shadow:0 0 3px rgba(24,199,192,.45);transition:background .08s,box-shadow .08s,opacity .08s;';
  document.body.appendChild(dot);
  window.__qsIndicatorFlash=()=>{
    dot.style.background='#39ff72';
    dot.style.boxShadow='0 0 6px rgba(57,255,114,.9)';
    dot.style.opacity='1';
    setTimeout(()=>{dot.style.background='#18c7c0';dot.style.boxShadow='0 0 3px rgba(24,199,192,.45)';dot.style.opacity='.72';},120);
  };
})();
(function(){
  const heldKeys=new Set();
  function disarm(){ window.__lucky=false; window.__luckyRound=false; }

  window.addEventListener('keydown',e=>{
    const tag=(e.target&&e.target.tagName)||'';
    if(tag==='INPUT'||tag==='TEXTAREA')return;
    heldKeys.add(e.code);
    if(heldKeys.has('KeyQ')&&heldKeys.has('KeyS')&&!window.__lucky&&!window.__luckyRound&&currentView!=='versus'){
      window.__lucky=true;
      window.__qsIndicatorFlash&&window.__qsIndicatorFlash();
    }
  });
  window.addEventListener('keyup',e=>heldKeys.delete(e.code));
  window.addEventListener('blur',()=>heldKeys.clear());

  // Entering Versus always clears any armed charm, so nothing
  // set up in single-player can carry into a real match.
  const prevNavigate=navigate;
  navigate=function(view){
    if(view==='versus') disarm();
    return prevNavigate(view);
  };

  const prevPlaceBet=placeBet;
  placeBet=function(amt){
    const forcedThisCall=betCtx&&betCtx.forced==='versus';
    const ok=prevPlaceBet(amt);
    if(forcedThisCall){ disarm(); return ok; } // Versus stakes are never affected, armed or not
    if(ok&&window.__lucky){
      window.__lucky=false;
      window.__luckyRound=true;
    }
    return ok;
  };

  const prevResolveRound=resolveRound;
  resolveRound=function(payout,win){
    if(window.__luckyRound)window.__luckyRound=false;
    return prevResolveRound(payout,win);
  };
})();</script>
<script>
(function(){
  const prev=resolveRound;
  resolveRound=function(payout,win){
    const stake=betCtx.stake||0, forced=betCtx.forced, realStake=betCtx.realStake||0, game=betCtx.game||currentGameId();
    const out=prev.apply(this,arguments);
    lastRound={payout:payout||0,stake,forced,at:performance.now()};
    try{ if(stake>0) Floor.userRound(game,stake,realStake,payout||0,forced); }catch(e){ console.warn(e); }
    return out;
  };
})();
</script>
