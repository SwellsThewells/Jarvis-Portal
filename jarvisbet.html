      const c=rtColor(n)==='red'?'#8f2226':(rtColor(n)==='green'?'#15653c':'#1a2b36');
      return `${c} ${(i*seg).toFixed(2)}deg ${((i+1)*seg).toFixed(2)}deg`;
    });
    let board='<div class="cell c-green" data-type="straight" data-val="0">0</div>';
    for(let row=0;row<3;row++) for(let col=0;col<12;col++){
      const n=col*3+(3-row);
      board+=`<div class="cell ${rtColor(n)==='red'?'c-red':'c-black'}" data-type="straight" data-val="${n}">${n}</div>`;
    }
    ctx.stage.innerHTML=`<div class="rt-wrap">
      <div class="wheel-frame"><div class="pointer"></div>
        <div class="wheel" id="wheel" style="background:conic-gradient(${stops.join(',')})"></div>
        <div class="hub" id="hub">–</div></div>
      <div class="rt-board">${board}</div>
      <div class="rt-out-row">
        <div class="cell c-out" data-type="dozen" data-val="1">1st 12</div>
        <div class="cell c-out" data-type="dozen" data-val="2">2nd 12</div>
        <div class="cell c-out" data-type="dozen" data-val="3">3rd 12</div>
        <div class="cell c-out" data-type="column" data-val="1">Col 1</div>
        <div class="cell c-out" data-type="column" data-val="2">Col 2</div>
        <div class="cell c-out" data-type="column" data-val="3">Col 3</div>
      </div>
      <div class="rt-out-row">
        <div class="cell c-out" data-type="low" data-val="0">1–18</div>
        <div class="cell c-out" data-type="even" data-val="0">Even</div>
        <div class="cell c-out" data-type="color" data-val="red">Red</div>
        <div class="cell c-out" data-type="color" data-val="black">Black</div>
        <div class="cell c-out" data-type="odd" data-val="0">Odd</div>
        <div class="cell c-out" data-type="high" data-val="0">19–36</div>
      </div></div>`;
    ctx.manual.innerHTML='<button class="act" id="rt-spin">Spin</button>';
    function repaint(){
      ctx.qa('.chip').forEach(c=>c.remove());
      let total=0;
      Object.values(bets).forEach(b=>{
        total+=b.amount;
        const cell=ctx.q(`[data-type="${b.type}"][data-val="${b.value}"]`);
        if(cell){ const chip=document.createElement('div'); chip.className='chip';
          chip.textContent=b.amount>=1000?Math.round(b.amount/1000)+'k':Math.round(b.amount); cell.appendChild(chip); }
      });
      const t=ctx.q('#rt-total'); if(t) t.textContent=fmt(total);
    }
    ctx.qa('.cell').forEach(cell=>cell.addEventListener('click',()=>{
      if(spinning||ctx.autoRunning()) return;
      const k=cell.dataset.type+':'+cell.dataset.val;
      if(!bets[k]) bets[k]={type:cell.dataset.type,value:cell.dataset.val,amount:0};
      bets[k].amount+=ctx.bet(); sfx.chip(); repaint();
    }));
    ctx.q('#rt-clear').addEventListener('click',()=>{
      if(spinning||ctx.autoRunning()) return;
      Object.keys(bets).forEach(k=>delete bets[k]); repaint();
    });
    ctx.q('#rt-spin').addEventListener('click',()=>{
      if(spinning||ctx.autoRunning()) return;
      const list=Object.values(bets), total=list.reduce((a,b)=>a+b.amount,0);
      if(total<=0) return toast('Put at least one chip down first.','lose');
      if(!placeBet(total)) return toast('Not enough balance for those chips.','lose');
      spinning=true; ctx.q('#rt-spin').disabled=true; ctx.banner(null);
      const idx=Math.floor(Math.random()*37), num=WHEEL_ORDER[idx];
      const wheel=ctx.q('#wheel');
      const deg=(6+Math.floor(Math.random()*3))*360+(360-(idx*seg+seg/2));
      sfx.spin(); wheel.style.transform=`rotate(${deg}deg)`;
      setTimeout(()=>{
        ctx.q('#hub').textContent=num;
        const payout=list.reduce((a,b)=>a+evalRt(b,num),0);
        resolveRound(payout,payout>total?true:(payout>0?null:false));
        ctx.banner(`${num} ${rtColor(num)} — ${payout>0?'paid '+fmt(payout):'no win'}`,payout>total?'win':(payout>0?'push':'lose'));
        ctx.strip(String(num),payout>total?'w':(payout>0?'':'l'));
        payout>0?sfx.win():sfx.lose();
        spinning=false; ctx.q('#rt-spin').disabled=false;
        wheel.style.transition='none'; wheel.style.transform=`rotate(${deg%360}deg)`;
        void wheel.offsetWidth; wheel.style.transition='';
      },3500);
    });
    repaint();
  },
  onAutoRound(ctx,d){ const h=ctx.q('#hub'); if(h&&d.detail!==undefined) h.textContent=d.detail; },
  sim(bet,opts){
    const layout=(opts&&opts.layout)||[];
    if(!layout.length) return {payout:0,mult:0,tag:'—'};
    const num=WHEEL_ORDER[Math.floor(Math.random()*37)];
    const payout=layout.reduce((a,b)=>a+evalRt({type:b.type,value:b.value,amount:b.weight*bet},num),0);
    return {payout,mult:payout/bet,tag:String(num),detail:num};
  }
};

/* ==========================================================
   CRASH
========================================================== */
/* fair crash curve: P(crash >= x) = EDGE/x  */
function crashPoint(){
  const r=Math.random();
  if(r<1-EDGE) return 1.00;
  return Math.max(1,Math.floor(100*EDGE/(1-r))/100);
}
MODULES.crash={
  blurb:'Cash out before the rocket blows',
  edge:'1% edge',
  jewelAt:25,
  optsHTML(o){
    return `<div class="field">
      <label>Auto cash out at <span>manual play still lets you tap out early</span></label>
      <div class="inp-row"><input type="number" id="cr-target" min="1.01" step="0.05" value="${o.target||'2.00'}"><span class="unit">×</span></div>
    </div>
    ${segField('Preset','crpreset',[{v:'1.5',t:'1.5×'},{v:'2',t:'2×'},{v:'5',t:'5×'},{v:'10',t:'10×'}],'',
      'quick fill')}
    <div class="note">The rocket climbs until it blows. Cash out first and you keep bet × multiplier — every round has a real chance of blowing at 1.00×.</div>`;
  },
  readOpts(w){ return {target:Math.max(1.01,parseFloat(w.querySelector('#cr-target').value)||2)}; },
  onChange(ctx){
    const p=ctx.wrap.querySelector('[data-seg="crpreset"] button.on');
    if(p){ ctx.wrap.querySelector('#cr-target').value=parseFloat(p.dataset.val).toFixed(2); p.classList.remove('on'); }
    const t=ctx.opts().target;
    ctx.preview(ctx.bet()*t-ctx.bet(),'Chance of reaching it',(EDGE*100/t).toFixed(2)+'%');
  },
  mount(ctx){
    let raf=null, live=false, bet=0, cashed=false, startT=0, crashAt=0, hist=[];
    ctx.stage.innerHTML=`<div class="cr-wrap">
      <div class="cr-head">
        <div class="cr-mult" id="cr-mult">1.00×</div>
        <div class="cr-hist" id="cr-hist"></div>
      </div>
      <div class="cr-canvas-wrap"><canvas id="cr-cv"></canvas>
        <div class="cr-rocket hidden" id="cr-rocket">${ART.rocket}</div></div>
      <div class="cx-hint" id="cr-hint">Set an auto cash out, then launch.</div>
    </div>`;
    ctx.manual.innerHTML=`<button class="act" id="cr-go">Launch rocket</button>
      <button class="act act-amber hidden" id="cr-cash">Cash out</button>`;
    const cv=ctx.q('#cr-cv'), g=cv.getContext('2d');
    const multEl=ctx.q('#cr-mult'), rocket=ctx.q('#cr-rocket'), hint=ctx.q('#cr-hint');
    const goBtn=ctx.q('#cr-go'), cashBtn=ctx.q('#cr-cash');
    let W=0,H=0;
    function size(){
      const r=cv.parentElement.getBoundingClientRect();
      const dpr=window.devicePixelRatio||1;
      W=r.width; H=r.height;
      cv.width=W*dpr; cv.height=H*dpr; g.setTransform(dpr,0,0,dpr,0,0);
    }
    const curMult=t=>Math.max(1,Math.pow(Math.E,0.00016*t*1.65));
    function draw(mult,dead){
      g.clearRect(0,0,W,H);
      const pad=26;
      const maxM=Math.max(2,mult*1.15), maxT=Math.max(2200,(Math.log(maxM)/(0.00016*1.65)));
      g.strokeStyle='#1a3040'; g.lineWidth=1;
      for(let i=1;i<4;i++){ const y=pad+(H-pad*2)*i/4; g.beginPath(); g.moveTo(pad,y); g.lineTo(W-pad,y); g.stroke(); }
      const pts=[];
      const steps=70;
      for(let i=0;i<=steps;i++){
        const t=maxT*i/steps;
        const m=curMult(t);
        if(m>mult) break;
        pts.push([pad+(W-pad*2)*(t/maxT), H-pad-(H-pad*2)*((m-1)/(maxM-1))]);
      }
      if(!pts.length) pts.push([pad,H-pad]);
      const col=dead?'#e5484d':'#37d67a';
      g.beginPath(); g.moveTo(pts[0][0],pts[0][1]);
      pts.forEach(p=>g.lineTo(p[0],p[1]));
      g.strokeStyle=col; g.lineWidth=3; g.lineJoin='round'; g.stroke();
      g.lineTo(pts[pts.length-1][0],H-pad); g.lineTo(pad,H-pad); g.closePath();
      g.fillStyle=dead?'rgba(229,72,77,.12)':'rgba(55,214,122,.12)'; g.fill();
      const tip=pts[pts.length-1];
      rocket.style.left=tip[0]+'px'; rocket.style.top=tip[1]+'px';
      rocket.classList.remove('hidden');
    }
    function pushHist(v,cashedOut){
      hist.unshift({v,cashedOut}); hist=hist.slice(0,8);
      ctx.q('#cr-hist').innerHTML=hist.map(h=>`<span class="${h.v>=2?'hi':'lo'}">${h.v.toFixed(2)}×</span>`).join('');
    }
    function end(){
      live=false; goBtn.classList.remove('hidden'); cashBtn.classList.add('hidden'); ctx.lockBet(false);
    }
    function finishCrash(){
      multEl.textContent=crashAt.toFixed(2)+'×'; multEl.style.color='var(--red)';
      draw(crashAt,true);
      rocket.classList.add('boom');
      setTimeout(()=>{ rocket.innerHTML=ART.boom; },60);
      pushHist(crashAt,cashed);
      if(!cashed){
        resolveRound(0,false);
        ctx.banner(`Blew up at ${crashAt.toFixed(2)}× — ${fmt(bet)} lost`,'lose');
        ctx.strip(crashAt.toFixed(2)+'×','l'); sfx.lose();
        hint.textContent='Gone. Launch again when ready.';
      } else {
        hint.textContent=`It would have run to ${crashAt.toFixed(2)}× — you cashed out in time.`;
      }
      end();
    }
    function loop(){
      const t=performance.now()-startT;
      const m=curMult(t);
      if(m>=crashAt) return finishCrash();
      multEl.textContent=m.toFixed(2)+'×';
      draw(m,false);
      const target=ctx.opts().target;
      if(!cashed&&target&&m>=target) doCash(true);
      raf=requestAnimationFrame(loop);
    }
    function doCash(auto){
      if(!live||cashed) return;
      cashed=true;
      const m=Math.min(curMult(performance.now()-startT),crashAt);
      const payout=bet*m;
      resolveRound(payout,true);
      multEl.style.color='var(--accent)';
      ctx.banner(`Cashed out at ${m.toFixed(2)}×${auto?' (auto)':''} — ${fmt(payout)}`,'win');
      ctx.strip(m.toFixed(2)+'×','w'); sfx.win();
      cashBtn.classList.add('hidden');
    }
    goBtn.addEventListener('click',()=>{
      if(live||ctx.autoRunning()) return;
      bet=ctx.bet();
      if(!placeBet(bet)) return toast('Not enough balance for that bet.','lose');
      size(); live=true; cashed=false; crashAt=crashPoint(); startT=performance.now();
      multEl.style.color='var(--text)'; ctx.banner(null); ctx.lockBet(true);
      rocket.innerHTML=ART.rocket; rocket.classList.remove('boom','hidden');
      hint.textContent='Tap cash out before it blows.';
      goBtn.classList.add('hidden'); cashBtn.classList.remove('hidden');
      sfx.spin(); loop();
    });
    cashBtn.addEventListener('click',()=>doCash(false));
    ctx.play=d=>{
      if(live||!d.detail) return;
      size();
      const at=d.detail.crash, target=d.detail.target, t0=performance.now();
      rocket.innerHTML=ART.rocket; rocket.classList.remove('boom','hidden');
      multEl.style.color='var(--text)';
      let flagged=false;
      (function frame(){
        const m=curMult(performance.now()-t0);
        if(m>=at){
          multEl.textContent=at.toFixed(2)+'\u00d7';
          multEl.style.color=d.win?'var(--accent)':'var(--red)';
          draw(at,true); rocket.classList.add('boom');
          setTimeout(()=>{ rocket.innerHTML=ART.boom; },60);
          pushHist(at,d.win);
          hint.textContent=d.win?`Bot took ${target.toFixed(2)}\u00d7 \u2014 it ran to ${at.toFixed(2)}\u00d7.`
                                :`Blew at ${at.toFixed(2)}\u00d7, short of ${target.toFixed(2)}\u00d7.`;
          return;
        }
        if(!flagged&&d.win&&m>=target){ flagged=true; multEl.style.color='var(--accent)'; sfx.win(); }
        multEl.textContent=m.toFixed(2)+'\u00d7'; draw(m,false);
        requestAnimationFrame(frame);
      })();
    };
    const ro=()=>{ size(); };
    window.addEventListener('resize',ro);
    size(); draw(1,false); rocket.classList.add('hidden');
    onLeave(()=>{ cancelAnimationFrame(raf); window.removeEventListener('resize',ro); });
  },
  onAutoRound(ctx,d){
    const m=ctx.q('#cr-mult'); if(!m||!d.detail) return;
    m.textContent=d.detail.crash.toFixed(2)+'×';
    m.style.color=d.win?'var(--accent)':'var(--red)';
    const h=ctx.q('#cr-hint');
    if(h) h.textContent=d.win?`Auto cashed at ${d.detail.target.toFixed(2)}× — it ran to ${d.detail.crash.toFixed(2)}×.`
                            :`Blew at ${d.detail.crash.toFixed(2)}×, before your ${d.detail.target.toFixed(2)}× target.`;
  },
  sim(bet,o){
    const target=o.target||2, crash=crashPoint();
    const win=crash>=target;
    return {payout:win?bet*target:0,mult:win?target:0,tag:crash.toFixed(2)+'×',detail:{crash,target}};
  }
};

   MINES
========================================================== */
function minesMult(picks,mines){
  let m=1; for(let i=0;i<picks;i++) m*=(25-i)/(25-mines-i);
  return m*EDGE;
}

        if(k>=picks.length||!document.body.contains(board)) return;
        const i=picks[k++], el=board.querySelector(`[data-i="${i}"]`);
        if(!el) return;
        const bad=mn.includes(i);
        el.classList.add('done','flip',bad?'boom':'gem');
        if(bad) el.classList.add('shake');
        face(el,bad?ART.bomb:ART.jewelTile);
        bad?sfx.lose():sfx.chip();
        if(!bad){
          const txt=minesMult(k,mn.length).toFixed(2)+'×';
          if(miniMult) miniMult.textContent=txt;
          else if(multEl) multEl.textContent=txt;
        }
        if(bad){
          mines=new Set(mn);
          setTimeout(()=>{ if(token===replayToken) revealRest(false,board,new Set(mn)); },200);
          return;
        }
        setTimeout(step,190);
      };
      if(multEl) multEl.textContent='1.00×';
      if(cashEl) cashEl.textContent=d.win?'Bot cashed out':'Bot busted';
      step();
    };
    build(); repaintChosen();
    onLeave(()=>{ MODULES.mines._repaint=null; MODULES.mines._restore=null; });
  },
  onAutoRound(ctx,d){ if(ctx.play) ctx.play(d); },
  onAutoEnd(ctx){
    if(Auto.forGame(ctx.id).length) return;
    if(MODULES.mines._restore) MODULES.mines._restore();
  },
  sim(bet,o){
    const count=o.mines||3, picks=Math.min(o.picks||4,25-count);
    const pool=Array.from({length:25},(_,i)=>i), mines=[];
    while(mines.length<count) mines.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
    let chosen;
    if(o.pickMode==='mine'&&o.chosen&&o.chosen.length>=picks){
      chosen=o.chosen.slice(0,picks);
    } else {
      const rest=Array.from({length:25},(_,i)=>i); chosen=[];
      while(chosen.length<picks) chosen.push(rest.splice(Math.floor(Math.random()*rest.length),1)[0]);
    }
    const hitAt=chosen.findIndex(i=>mines.includes(i));
    const shown=hitAt>=0?chosen.slice(0,hitAt+1):chosen;
    const m=hitAt>=0?0:minesMult(picks,count);
    return {payout:bet*m,mult:m,tag:m?m.toFixed(2)+'×':'BOOM',detail:{mines,picks:shown}};
  }
};
/* ==========================================================
   PLINKO
========================================================== */
const PK_RISK={low:0.32,medium:0.55,high:0.82};
function plinkoTable(rows,risk){
  const k=PK_RISK[risk]||0.55, p=[],u=[];
  for(let i=0;i<=rows;i++){ const pi=combi(rows,i)/Math.pow(2,rows); p.push(pi); u.push(Math.pow(1/pi,k)); }
  const den=p.reduce((a,pi,i)=>a+pi*u[i],0);
  return u.map(ui=>{ const raw=EDGE*ui/den; return raw>=10?Math.round(raw):(raw>=1?Math.round(raw*10)/10:Math.round(raw*100)/100); });
}
const binColor=m=>m>=10?'#e5484d':(m>=3?'#f07d29':(m>=1.2?'#f0b429':(m>=0.8?'#8fbf5a':'#4a9fd8')));
MODULES.plinko={
  blurb:'Real gravity, real bounces',
  edge:'1% edge',
  jewelAt:10,
  optsHTML(o){
    return segField('Risk','pkrisk',[{v:'low',t:'Low'},{v:'medium',t:'Medium'},{v:'high',t:'High'}],o.risk||'medium','edge payouts scale with it')
      +segField('Rows','pkrows',[{v:8,t:'8'},{v:10,t:'10'},{v:12,t:'12'},{v:14,t:'14'},{v:16,t:'16'}],o.rows||12);
  },
  readOpts(w){ return {risk:segVal(w,'pkrisk','medium'),rows:parseInt(segVal(w,'pkrows',12))}; },
  onChange(ctx){
    const o=ctx.opts(), t=plinkoTable(o.rows,o.risk);
    ctx.preview(ctx.bet()*Math.max(...t)-ctx.bet(),'Best bin',Math.max(...t)+'×');
    if(MODULES.plinko._layout) MODULES.plinko._layout();
  },
  mount(ctx){
    ctx.stage.innerHTML='<div class="pk-wrap"><canvas class="pk-canvas" id="pk"></canvas><div class="pk-bins" id="pkbins"></div></div>';
    ctx.manual.innerHTML='<button class="act" id="pk-drop">Drop ball</button>';
    const cv=ctx.q('#pk'), g=cv.getContext('2d'), binsEl=ctx.q('#pkbins');
    let pegs=[],balls=[],W=0,H=0,gap=0,table=[],rows=12,raf=null;
    const rowY=r=>gap*1.4+r*gap, x0=r=>W/2-(r+2)*gap/2;
    function layout(){
      const o=ctx.opts(); rows=o.rows; table=plinkoTable(rows,o.risk);
      const box=ctx.stage.getBoundingClientRect();
      const availH=Math.max(220,box.height-72), availW=Math.max(240,box.width-20);
      gap=Math.min(availW/(rows+3),availH/(rows+2.2));
      W=gap*(rows+3); H=gap*(rows+2);
      const dpr=window.devicePixelRatio||1;
      cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+'px'; cv.style.height=H+'px';
      g.setTransform(dpr,0,0,dpr,0,0);
      pegs=[];
      for(let r=0;r<rows;r++){ const n=r+3,y=rowY(r),sx=x0(r);
        for(let c=0;c<n;c++) pegs.push({x:sx+c*gap,y}); }
      binsEl.style.width=(table.length*gap)+'px';
      binsEl.innerHTML=table.map((m,i)=>`<div class="pk-bin" data-bin="${i}" style="background:${binColor(m)};width:${gap-3}px">${m}×</div>`).join('');
      draw();
    }
    MODULES.plinko._layout=layout;
    function draw(){
      g.clearRect(0,0,W,H);
      g.fillStyle='#31576f';
      pegs.forEach(p=>{ g.beginPath(); g.arc(p.x,p.y,gap*0.11,0,7); g.fill(); });
      balls.forEach(b=>{
        g.beginPath(); g.arc(b.x,b.y,b.r,0,7); g.fillStyle='#f0b429'; g.fill();
        g.beginPath(); g.arc(b.x-b.r*0.3,b.y-b.r*0.3,b.r*0.35,0,7); g.fillStyle='rgba(255,255,255,.6)'; g.fill();
      });
    }
    function loop(){
      const G=0.19*(gap/28);            /* gentler pull = a longer, believable fall */
      for(let i=balls.length-1;i>=0;i--){
        const b=balls[i];
        b.vy+=G; b.y+=b.vy; b.x+=b.vx;
        if(b.row<rows&&b.y+b.r>=rowY(b.row)+b.r*0.2){
          /* a forced path replays a predetermined bin; otherwise a true coin flip */
          const right = b.path ? b.path[b.row] : (Math.random()<0.5);
          if(right) b.k++;
          const last=b.row+1>=rows;
          const tx=last?(x0(b.row)-gap/2)+b.k*gap:x0(b.row+1)+b.k*gap;
          const nextY=last?H-b.r:rowY(b.row+1);
          b.vy=-b.vy*0.34;             /* a real little bounce off the peg */
          const dy=Math.max(1,nextY-b.y);
          const T=(-b.vy+Math.sqrt(Math.max(0.001,b.vy*b.vy+2*G*dy)))/G;
          b.vx=(tx-b.x)/Math.max(1,T);
          b.row++;
          if(b.snd===undefined||performance.now()-b.snd>45){ b.snd=performance.now(); sfx.tick(); }
        }
        if(b.y>=H-b.r){ balls.splice(i,1); land(b); }
      }
      draw();
      raf=balls.length?requestAnimationFrame(loop):null;
    }
    /* build a random left/right path that provably ends in bin `idx` */
    function pathTo(idx){
      const p=Array.from({length:rows},(_,i)=>i<idx);
      for(let i=p.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [p[i],p[j]]=[p[j],p[i]]; }
      return p;
    }
    function land(b){
      const idx=Math.max(0,Math.min(table.length-1,b.k-1));
      const m=table[idx], payout=b.bet*m;
      const el=binsEl.querySelector(`[data-bin="${idx}"]`);
      if(el){ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
      if(b.ghost){ sfx.step(); return; }        /* autobet replay: money already settled */
      resolveRound(payout,payout>b.bet?true:(payout>0?null:false));
      ctx.banner(`${m}× — ${fmt(payout)}`,payout>b.bet?'win':(payout>0?'push':'lose'));
      ctx.strip(m+'×',payout>b.bet?'w':(payout>0?'':'l'));
      payout>b.bet?sfx.win():sfx.step();
    }
    ctx.q('#pk-drop').addEventListener('click',()=>{
      if(ctx.autoRunning()) return;
      const bet=ctx.bet();
      if(!placeBet(bet)) return toast('Not enough balance for that bet.','lose');
      ctx.banner(null);
      balls.push({x:W/2,y:gap*0.35,vx:0,vy:0,r:gap*0.19,row:0,k:1,bet});
      if(!raf) raf=requestAnimationFrame(loop);
    });
    ctx.play=d=>{
      if(d.detail===undefined) return;
      balls.push({x:W/2,y:gap*0.35,vx:0,vy:0,r:gap*0.19,row:0,k:1,bet:d.bet,ghost:true,path:pathTo(d.detail)});
      if(!raf) raf=requestAnimationFrame(loop);
    };
    const ro=()=>layout();
    window.addEventListener('resize',ro);
    onLeave(()=>{ window.removeEventListener('resize',ro); cancelAnimationFrame(raf); MODULES.plinko._layout=null; });
    layout();
  },
  onAutoRound(ctx,d){
    const el=ctx.q(`[data-bin="${d.detail}"]`);
    if(el){ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
  },
  sim(bet,o){
    const rows=o.rows||12, table=plinkoTable(rows,o.risk||'medium');
    let idx=0; for(let i=0;i<rows;i++) if(Math.random()<0.5) idx++;
    const m=table[idx];
    return {payout:bet*m,mult:m,tag:m+'×',detail:idx};
  }
};

/* ==========================================================
   TOWER
========================================================== */
const TOWER_MODES={easy:{tiles:4,floors:8,label:'Easy · 4 doors'},medium:{tiles:3,floors:8,label:'Medium · 3 doors'},hard:{tiles:2,floors:8,label:'Hard · 2 doors'}};
const towerMult=(mode,floor)=>EDGE*Math.pow(TOWER_MODES[mode].tiles/(TOWER_MODES[mode].tiles-1),floor);
MODULES.tower={
  blurb:'One bad door per floor',
  edge:'1% edge',
  jewelAt:12,
  optsHTML(o){
    return segField('Difficulty','twmode',[{v:'easy',t:'Easy'},{v:'medium',t:'Medium'},{v:'hard',t:'Hard'}],o.mode||'medium','doors per floor')
      +`<div class="field">
        <label>Autobet climbs to</label>
        <div class="inp-row"><span class="unit pre">Floor</span><input type="number" id="tw-target" min="1" max="8" value="${o.target||3}"></div>
      </div>`;
  },
  readOpts(w){
    const mode=segVal(w,'twmode','medium');
    return {mode,target:Math.min(TOWER_MODES[mode].floors,Math.max(1,parseInt(w.querySelector('#tw-target').value)||3))};
  },
  onChange(ctx){
    const o=ctx.opts(), m=towerMult(o.mode,o.target);
    ctx.preview(ctx.bet()*m-ctx.bet(),`Autobet leaves on floor ${o.target}`,m.toFixed(2)+'×');
    if(MODULES.tower._rebuild) MODULES.tower._rebuild();
  },
  mount(ctx){
    let plan=[],floor=0,live=false,bet=0,mode='medium';
    ctx.stage.innerHTML=`<div class="cx-topbar" style="width:min(100%,420px)">
        <div class="cx-big" id="tw-mult">1.00×</div><div class="cx-hint" id="tw-cashlbl">Cash out —</div></div>
      <div class="tower" id="tower"></div>`;
    ctx.manual.innerHTML=`<button class="act" id="tw-start">Start climb</button>
      <button class="act act-amber hidden" id="tw-cash">Cash out</button>`;
    const tower=ctx.q('#tower'),multEl=ctx.q('#tw-mult'),cashLbl=ctx.q('#tw-cashlbl');
    const start=ctx.q('#tw-start'),cashBtn=ctx.q('#tw-cash');
    function build(){
      const o=ctx.opts(); const cfg=TOWER_MODES[o.mode];
      tower.innerHTML='';
      for(let i=0;i<cfg.floors;i++){
        const row=document.createElement('div');
        row.className='floor'; row.dataset.f=i;
        row.innerHTML=`<div class="fno">${i+1}</div>`
          +Array.from({length:cfg.tiles}).map((_,j)=>`<div class="ftile" data-t="${j}"></div>`).join('')
          +`<div class="fmul">${towerMult(o.mode,i+1).toFixed(2)}×</div>`;
        tower.appendChild(row);
      }
      mark();
    }
    MODULES.tower._rebuild=()=>{ if(!live) build(); };
    function mark(){
      tower.querySelectorAll('.floor').forEach(r=>{
        const f=parseInt(r.dataset.f);
        r.classList.toggle('on',live&&f===floor);
        r.classList.toggle('past',f<floor);
      });
    }
    function end(){ live=false; start.classList.remove('hidden'); cashBtn.classList.add('hidden'); ctx.lockBet(false); mark(); }
    /* dashed preview of the floors you walked away from */
    function showWhatIf(){
      const cfg=TOWER_MODES[mode];
      let died=null;
      for(let f=floor;f<cfg.floors;f++){
        const row=tower.querySelector(`.floor[data-f="${f}"]`);
        row.classList.add('ghost');
        row.querySelectorAll('.ftile').forEach((el,j)=>{
          if(died!==null){ el.textContent='·'; return; }
          const bad=j===plan[f];
          el.classList.add(bad?'wouldbad':'wouldok');
          el.textContent=bad?'✕':'✓';
        });
        if(died===null){
          /* the auto-path takes the first safe door on each floor */
          const safe=plan[f]===0?1:0;
          if(safe===plan[f]) died=f;
        }
      }
      const top=towerMult(mode,cfg.floors);
      return top;
    }
    tower.addEventListener('click',e=>{
      const tile=e.target.closest('.ftile'); if(!tile||!live||ctx.autoRunning()) return;
      const row=tile.closest('.floor'); if(parseInt(row.dataset.f)!==floor) return;
      const j=parseInt(tile.dataset.t);
      if(j===plan[floor]){
        tile.classList.add('bad'); tile.textContent='✕';
        row.querySelectorAll('.ftile').forEach((el,i)=>{ if(i!==j){ el.classList.add('wouldok'); el.textContent='✓'; } });
        resolveRound(0,false);
        ctx.banner(`Wrong door on floor ${floor+1} — ${fmt(bet)} lost`,'lose');
        ctx.strip('0×','l'); sfx.lose(); end();
      } else {
        tile.classList.add('ok'); tile.textContent='✓'; sfx.step();
        floor++;
        const m=towerMult(mode,floor);
        multEl.textContent=m.toFixed(2)+'×'; cashLbl.textContent='Cash out '+fmt(bet*m);
        if(floor>=TOWER_MODES[mode].floors){
          resolveRound(bet*m,true);
          ctx.banner(`Top floor — ${fmt(bet*m)}`,'win'); ctx.strip(m.toFixed(2)+'×','w'); sfx.win(); end();
        } else mark();
      }
    });
    start.addEventListener('click',()=>{
      if(ctx.autoRunning()) return;
      const o=ctx.opts(); mode=o.mode; bet=ctx.bet();
      if(!placeBet(bet)) return toast('Not enough balance for that bet.','lose');
      const cfg=TOWER_MODES[mode];
      plan=Array.from({length:cfg.floors},()=>Math.floor(Math.random()*cfg.tiles));
      floor=0; live=true; build(); ctx.banner(null); ctx.lockBet(true);
      multEl.textContent='1.00×'; cashLbl.textContent='Cash out —';
      start.classList.add('hidden'); cashBtn.classList.remove('hidden');
    });
    cashBtn.addEventListener('click',()=>{
      if(!live||floor===0) return toast('Clear at least one floor first.');
      const m=towerMult(mode,floor);
      resolveRound(bet*m,true);
      const stopped=floor;
      live=false;
      const top=showWhatIf();
      ctx.banner(`Cashed out on floor ${stopped} for ${fmt(bet*m)} — the top was worth ${fmt(bet*top)}`,'win');
      ctx.strip(m.toFixed(2)+'×','w'); sfx.win(); end();
    });
    ctx.play=d=>{
      if(d.detail===undefined) return;
      const o=ctx.opts(); mode=o.mode; build();
      const reached=d.detail;
      let f=0;
      const step=()=>{
        if(!document.body.contains(tower)) return;
        const row=tower.querySelector(`.floor[data-f="${f}"]`);
        if(!row) return;
        tower.querySelectorAll('.floor').forEach(r=>r.classList.toggle('on',r===row));
        const tiles=row.querySelectorAll('.ftile');
        if(f<reached){
          tiles[0].classList.add('ok'); tiles[0].textContent='\u2713'; sfx.step();
          multEl.textContent=towerMult(mode,f+1).toFixed(2)+'\u00d7';
          f++; setTimeout(step,240);
        } else {
          if(!d.win){ tiles[0].classList.add('bad'); tiles[0].textContent='\u2715'; sfx.lose(); }
          else sfx.win();
          tower.querySelectorAll('.floor').forEach(r=>r.classList.remove('on'));
        }
      };
      multEl.textContent='1.00\u00d7'; step();
    };
    build();
    onLeave(()=>{ MODULES.tower._rebuild=null; });
  },
  onAutoRound(ctx,d){
    const el=ctx.q('#tw-mult'); if(el) el.textContent=(d.mult||0).toFixed(2)+'×';
    ctx.qa('.floor').forEach((r,i)=>{
      r.classList.remove('ghost');
      r.querySelectorAll('.ftile').forEach(t=>{ t.className='ftile'; t.textContent=''; });
      const reached=d.detail||0;
      r.classList.toggle('past',i<reached);
      if(i<reached) r.querySelectorAll('.ftile')[0].classList.add('ok');
      if(i===reached&&!d.win) r.querySelectorAll('.ftile')[0].classList.add('bad');
    });
  },
  sim(bet,o){
    const mode=o.mode||'medium', target=Math.min(TOWER_MODES[mode].floors,o.target||3);
    const t=TOWER_MODES[mode].tiles;
    for(let f=0;f<target;f++) if(Math.random()<1/t) return {payout:0,mult:0,tag:'✕',detail:f};
    const m=towerMult(mode,target);
    return {payout:bet*m,mult:m,tag:m.toFixed(2)+'×',detail:target};
  }
};

      chicken.classList.remove('hop'); void chicken.offsetWidth; chicken.classList.add('hop');
    }
    const CAR_COLS=[['#e5484d','#8f2226'],['#4a9fd8','#276890'],['#f0b429','#a97d18'],['#8b7fd4','#5b4fa0']];
    function spawnCar(laneIdx,hit,cb){
      const car=document.createElement('div');
      const c=CAR_COLS[Math.floor(Math.random()*CAR_COLS.length)];
      car.className='cx-car'; car.innerHTML=ART.car(c[0],c[1]);
      car.style.left=((laneIdx-0.5)*LANE_W)+'px';
      car.style.transform='translate(-50%,0)'; car.style.top='-80px';
      track.appendChild(car);
      const dur=hit?400:900, endY=road.clientHeight+60;
      car.animate([{top:'-80px'},{top:endY+'px'}],{duration:dur,easing:'linear'});
      setTimeout(()=>{ car.remove(); if(cb) cb(); },dur);
    }
    function ambient(){
      if(!live) return;
      const far=lane+2+Math.floor(Math.random()*4);
      if(far<=lanes) spawnCar(far,false);
      carTimer=setTimeout(ambient,500+Math.random()*700);
    }
    function end(){
      live=false; busy=false; clearTimeout(carTimer);
      startBtn.classList.remove('hidden'); goBtn.classList.add('hidden'); cashBtn.classList.add('hidden');
      ctx.lockBet(false); paint();
    }
    /* after cashing out, roll the rest of the road so you see how far you'd have got */
    function showWhatIf(){
      let l=lane;
      while(l<lanes&&Math.random()<CX_DIFF[diff].p) l++;
      const reached=Math.min(l,lanes);
      for(let i=lane+1;i<=reached;i++){
        const el=track.querySelector(`[data-l="${i}"]`);
        if(el) el.classList.add('would');
      }
      if(reached<lanes){
        const el=track.querySelector(`[data-l="${reached+1}"]`);
        if(el) el.classList.add('dead');
        return {reached,died:reached+1};
      }
      return {reached,died:null};
    }
    function cashOut(){
      if(!live||lane===0) return toast('Cross at least one lane first.');
      const m=cxMult(diff,lane), stopped=lane;
      resolveRound(bet*m,true);
      live=false;
      const wi=showWhatIf();
      ctx.banner(`Cashed out on lane ${stopped} for ${fmt(bet*m)}${wi.died?` — a car was waiting on lane ${wi.died}`:' — the road was clear all the way'}`,'win');
      hintEl.textContent=wi.died
        ? `You'd have made it to lane ${wi.reached} (${cxMult(diff,wi.reached).toFixed(2)}×) before getting hit.`
        : `You'd have crossed the whole road for ${cxMult(diff,lanes).toFixed(2)}×.`;
      ctx.strip(m.toFixed(2)+'×','w'); sfx.win(); end();
    }
    function hop(){
      if(!live||busy||ctx.autoRunning()) return;
      busy=true; goBtn.disabled=true;
      const survives=Math.random()<CX_DIFF[diff].p, target=lane+1;
      if(survives){
        lane=target; moveChicken(); paint(); sfx.step();
        const m=cxMult(diff,lane);
        multEl.textContent=m.toFixed(2)+'×';
        hintEl.textContent=`Cash out for ${fmt(bet*m)} — or keep hopping.`;
        cashBtn.classList.remove('hidden');
        setTimeout(()=>{ busy=false; goBtn.disabled=false; },180);
        if(lane>=lanes){
          resolveRound(bet*m,true);
          ctx.banner(`Made it across — ${fmt(bet*m)}`,'win'); ctx.strip(m.toFixed(2)+'×','w'); sfx.win(); end();
        }
      } else {
        spawnCar(target,true);
        setTimeout(()=>{
          lane=target; moveChicken(); paint();
          const el=track.querySelector(`[data-l="${target}"]`);
          if(el){ el.classList.remove('next'); el.classList.add('dead'); }
          chicken.innerHTML=ART.boom;
          resolveRound(0,false);
          ctx.banner(`Flattened on lane ${target} — ${fmt(bet)} lost`,'lose');
          ctx.strip('0×','l'); sfx.lose();
          hintEl.textContent='Splat. Start another round when you are ready.';
          end();
          setTimeout(()=>{ chicken.innerHTML=ART.chicken; },1400);
        },320);
      }
    }
    track.addEventListener('click',e=>{
      const el=e.target.closest('.cx-lane');
      if(el&&live&&parseInt(el.dataset.l)===lane+1) hop();
    });
    goBtn.addEventListener('click',hop);
    cashBtn.addEventListener('click',cashOut);
    startBtn.addEventListener('click',()=>{
      if(ctx.autoRunning()) return;
      bet=ctx.bet();
      if(!placeBet(bet)) return toast('Not enough balance for that bet.','lose');
      build(); lane=0; live=true; busy=false;
      chicken.innerHTML=ART.chicken; moveChicken(); paint();
      multEl.textContent='1.00×'; hintEl.textContent='Tap the lit lane to hop.';
      ctx.banner(null); ctx.lockBet(true);
      startBtn.classList.add('hidden'); goBtn.classList.remove('hidden'); goBtn.disabled=false;
      cashBtn.classList.add('hidden');
      clearTimeout(carTimer); ambient();
    });
    ctx.play=d=>{
      if(!d.detail) return;
      build(); lane=0; moveChicken(); chicken.innerHTML=ART.chicken;
      const reached=d.detail;
      let i=0;
      const step=()=>{
        if(!document.body.contains(track)) return;
        if(i>=reached){
          if(!d.win){
            const el=track.querySelector(`[data-l="${reached}"]`);
            spawnCar(reached,true);
            setTimeout(()=>{ if(el) el.classList.add('dead'); chicken.innerHTML=ART.boom; sfx.lose();
              setTimeout(()=>{chicken.innerHTML=ART.chicken;},1200); },200);
          } else sfx.win();
          return;
        }
        i++; lane=i; moveChicken();
        track.querySelectorAll('.cx-lane').forEach(el=>{
          const l=parseInt(el.dataset.l); el.classList.toggle('done',l<=lane);
        });
        const cx=(lane-0.5)*LANE_W;
        track.style.transform=`translateX(${-Math.max(0,Math.min(lanes*LANE_W-view.clientWidth,cx-view.clientWidth*0.3))}px)`;
        multEl.textContent=cxMult(diff,lane).toFixed(2)+'\u00d7';
        sfx.step();
        setTimeout(step,260);
      };
      multEl.textContent='1.00\u00d7'; step();
    };
    build();
    const ro=()=>paint(); window.addEventListener('resize',ro);
    onLeave(()=>{ clearTimeout(carTimer); window.removeEventListener('resize',ro); MODULES.chicken._rebuild=null; });
  },
  onAutoRound(ctx,d){
    const m=ctx.q('#cx-mult'); if(m) m.textContent=(d.mult||0).toFixed(2)+'×';
    const h=ctx.q('#cx-hint');
    if(h) h.textContent=d.win?`Autobet cashed out on lane ${d.detail}.`:`Autobet got hit on lane ${d.detail}.`;
  },
  sim(bet,o){
    const diff=o.diff||'easy', target=Math.min(CX_DIFF[diff].lanes,o.target||5);
    for(let i=0;i<target;i++) if(Math.random()>=CX_DIFF[diff].p) return {payout:0,mult:0,tag:'HIT',detail:i+1};
    const m=cxMult(diff,target);
    return {payout:bet*m,mult:m,tag:m.toFixed(2)+'×',detail:target};
  }
};

MODULES.dice={
  blurb:'Drag the line — under, over, between or outside',
  edge:'1% edge',
  jewelAt:50,
  optsHTML(o){
    return segField('Direction','dcmode',[{v:'under',t:'Under'},{v:'over',t:'Over'},{v:'between',t:'Between'},{v:'outside',t:'Outside'}],o.mode||'under')
      +`<div class="two">
        <div class="field"><label>Low edge</label>
          <div class="inp-row"><input type="number" id="dc-lo" min="0.5" max="99.5" step="0.5" value="${o.lo!==undefined?o.lo:50}"></div></div>
        <div class="field" id="dc-hi-field"><label>High edge</label>
          <div class="inp-row"><input type="number" id="dc-hi" min="0.5" max="99.5" step="0.5" value="${o.hi!==undefined?o.hi:75}"></div></div>
      </div>

  },
  readOpts(w){
    const mode=segVal(w,'dcmode','under');
    const loI=w.querySelector('#dc-lo'), hiI=w.querySelector('#dc-hi');
    const two=(mode==='between'||mode==='outside');
    w.querySelector('#dc-hi-field').style.visibility=two?'visible':'hidden';
    let lo=Math.min(99.5,Math.max(0.5,parseFloat(loI.value)||50));
    let hi=Math.min(99.5,Math.max(0.5,parseFloat(hiI.value)||75));
    if(two&&hi<=lo){ hi=Math.min(99.5,lo+0.5); }
    if(two&&lo>=hi){ lo=Math.max(0.5,hi-0.5); }
    loI.value=lo; hiI.value=hi;
    return {mode,lo,hi,two};
  },
  onChange(ctx){
    const o=ctx.opts(), chance=diceChance(o), mult=chance>0?EDGE*100/chance:0;
    ctx.preview(chance>0?ctx.bet()*mult-ctx.bet():0,'Win chance',chance.toFixed(2)+'% · '+mult.toFixed(3)+'×');
    if(MODULES.dice._paint) MODULES.dice._paint(o);
  },
  mount(ctx){
    let rolling=false;
    ctx.stage.innerHTML=`<div class="bignum" id="dc-num">00.00</div>
      <div class="dice-wrap"><div class="dice-track" id="dc-track">
          <div class="dice-marker" id="dc-mark-lo" style="left:50%">50.00</div>
          <div class="dice-marker b hidden" id="dc-mark-hi" style="left:75%">75.00</div>
          <div class="dice-handle" id="dc-h-lo" style="left:50%"></div>
          <div class="dice-handle hidden" id="dc-h-hi" style="left:75%"></div></div>
        <div class="dice-scale"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div></div>`;
    ctx.manual.innerHTML='<button class="act" id="dc-roll">Roll dice</button>';
    const track=ctx.q('#dc-track'),num=ctx.q('#dc-num');
    const hLo=ctx.q('#dc-h-lo'),hHi=ctx.q('#dc-h-hi'),mLo=ctx.q('#dc-mark-lo'),mHi=ctx.q('#dc-mark-hi');
    const iLo=ctx.q('#dc-lo'),iHi=ctx.q('#dc-hi');
    function paint(o){
      const g='var(--accent)', r='var(--red)';
      hLo.style.left=o.lo+'%'; mLo.style.left=o.lo+'%'; mLo.textContent=o.lo.toFixed(2);
      hHi.classList.toggle('hidden',!o.two); mHi.classList.toggle('hidden',!o.two);
      if(o.two){ hHi.style.left=o.hi+'%'; mHi.style.left=o.hi+'%'; mHi.textContent=o.hi.toFixed(2); }
      let bg;
      if(o.mode==='under') bg=`linear-gradient(90deg,${g} 0 ${o.lo}%,${r} ${o.lo}% 100%)`;
      else if(o.mode==='over') bg=`linear-gradient(90deg,${r} 0 ${o.lo}%,${g} ${o.lo}% 100%)`;
      else if(o.mode==='between') bg=`linear-gradient(90deg,${r} 0 ${o.lo}%,${g} ${o.lo}% ${o.hi}%,${r} ${o.hi}% 100%)`;
      else bg=`linear-gradient(90deg,${g} 0 ${o.lo}%,${r} ${o.lo}% ${o.hi}%,${g} ${o.hi}% 100%)`;
      track.style.background=bg;
      hLo.classList.toggle('locked',rolling); hHi.classList.toggle('locked',rolling);
    }
    MODULES.dice._paint=paint;
    let drag=null;
    function pct(x){
      const r=track.getBoundingClientRect();
      return Math.min(99.5,Math.max(0.5,Math.round(((x-r.left)/r.width)*200)/2));
    }
    track.addEventListener('pointerdown',e=>{
      if(rolling||ctx.autoRunning()) return;
      const o=ctx.opts(), p=pct(e.clientX);
      drag=(o.two&&Math.abs(p-o.hi)<Math.abs(p-o.lo))?'hi':'lo';
      track.setPointerCapture(e.pointerId);
      (drag==='hi'?iHi:iLo).value=p; ctx.refresh(); sfx.tick();
    });
    track.addEventListener('pointermove',e=>{
      if(!drag||rolling) return;
      (drag==='hi'?iHi:iLo).value=pct(e.clientX); ctx.refresh();
    });
    const stop=()=>{drag=null;};
    track.addEventListener('pointerup',stop); track.addEventListener('pointercancel',stop);
    function animate(roll,o,cb){
      rolling=true; paint(o); sfx.spin();
      let t=0;
      const iv=setInterval(()=>{
        num.textContent=(Math.random()*100).toFixed(2);
        if(++t>13){
          clearInterval(iv);
          num.textContent=roll.toFixed(2);
          const win=diceWin(roll,o);
          num.style.color=win?'var(--accent)':'var(--red)';
          rolling=false; paint(o); if(cb) cb(win);
        }
      },50);
    }
    ctx.q('#dc-roll').addEventListener('click',()=>{
      if(rolling||ctx.autoRunning()) return;
      const bet=ctx.bet(),o=ctx.opts();
      if(diceChance(o)<=0) return toast('That range can never win — widen it.','lose');
      if(!placeBet(bet)) return toast('Not enough balance for that bet.','lose');
      ctx.q('#dc-roll').disabled=true; ctx.banner(null);
      const roll=Math.round(Math.random()*10000)/100;
      animate(roll,o,win=>{
        const mult=EDGE*100/diceChance(o);
        resolveRound(win?bet*mult:0,win);
        ctx.banner(`Rolled ${roll.toFixed(2)} — ${win?'won '+fmt(bet*mult):'lost '+fmt(bet)}`,win?'win':'lose');
        ctx.strip(roll.toFixed(2),win?'w':'l');
        win?sfx.win():sfx.lose();
        ctx.q('#dc-roll').disabled=false;
      });
    });
    ctx.play=d=>{ if(rolling||d.detail===undefined) return; animate(d.detail,ctx.opts()); };
    paint(ctx.opts());
    onLeave(()=>{ MODULES.dice._paint=null; });
  },
  onAutoRound(ctx,d){
    const n=ctx.q('#dc-num'); if(!n) return;
    n.textContent=(d.detail||0).toFixed(2);
    n.style.color=d.win?'var(--accent)':'var(--red)';
  },
  sim(bet,o){
    const roll=Math.round(Math.random()*10000)/100;
    const chance=diceChance(o);
    if(chance<=0) return {payout:0,mult:0,tag:roll.toFixed(2),detail:roll};
    const mult=EDGE*100/chance, win=diceWin(roll,o);
    return {payout:win?bet*mult:0,mult:win?mult:0,tag:roll.toFixed(2),detail:roll};
  }
};
function diceChance(o){
  if(o.mode==='under') return o.lo;
  if(o.mode==='over') return 100-o.lo;
  if(o.mode==='between') return Math.max(0,o.hi-o.lo);
  return Math.max(0,100-(o.hi-o.lo));
}
function diceWin(roll,o){
  if(o.mode==='under') return roll<o.lo;
  if(o.mode==='over') return roll>o.lo;
  if(o.mode==='between') return roll>o.lo&&roll<o.hi;
  return roll<o.lo||roll>o.hi;
}

    const cardsEl=ctx.q('#hl-cards'),multEl=ctx.q('#hl-mult'),hint=ctx.q('#hl-hint');
    const start=ctx.q('#hl-start'),acts=ctx.q('#hl-acts'),hi=ctx.q('#hl-hi'),lo=ctx.q('#hl-lo'),cash=ctx.q('#hl-cash');
    const paint=(prev,cur)=>cardsEl.innerHTML=(prev?cardHTML(prev):'')+cardHTML(cur);
    function buttons(){
      hi.disabled=rank>=13; lo.disabled=rank<=1;
      hi.textContent=`Higher · ${rank>=13?'—':(EDGE*mult*hlStep(rank,'higher')).toFixed(2)+'×'}`;
      lo.textContent=`Lower · ${rank<=1?'—':(EDGE*mult*hlStep(rank,'lower')).toFixed(2)+'×'}`;
    }
    function end(){ live=false; start.classList.remove('hidden'); acts.classList.add('hidden'); cash.classList.add('hidden'); ctx.lockBet(false); }
    start.addEventListener('click',()=>{
      if(ctx.autoRunning()) return;
      bet=ctx.bet();
      if(!placeBet(bet)) return toast('Not enough balance for that bet.','lose');
      rank=Math.ceil(Math.random()*13); card=hlCard(rank); mult=1; live=true;
      paint(null,card); multEl.textContent='1.00×'; ctx.banner(null); ctx.lockBet(true);
      hint.textContent='Call the next card.';
      start.classList.add('hidden'); acts.classList.remove('hidden'); cash.classList.add('hidden');
      buttons();
    });
    function call(dir){
      if(!live||ctx.autoRunning()) return;
      const next=Math.ceil(Math.random()*13),nc=hlCard(next);
      sfx.deal(); paint(card,nc);
      if(next===rank){ ctx.banner(`Tie on ${nc.r} — call again`,'push'); rank=next; card=nc; buttons(); return; }
      const ok=dir==='higher'?next>rank:next<rank;
      if(ok){
        mult*=hlStep(rank,dir); rank=next; card=nc;
        multEl.textContent=(mult*EDGE).toFixed(2)+'×';
        hint.textContent=`Cash out for ${fmt(bet*mult*EDGE)} — or call again.`;
        cash.classList.remove('hidden'); sfx.step(); buttons();
      } else {
        resolveRound(0,false);
        ctx.banner(`It was ${nc.r} — ${fmt(bet)} lost`,'lose'); ctx.strip('0×','l'); sfx.lose();
        hint.textContent='Round over.'; end();
      }
    }
    hi.addEventListener('click',()=>call('higher'));
    lo.addEventListener('click',()=>call('lower'));
    cash.addEventListener('click',()=>{
      if(!live||mult<=1) return toast('Make at least one correct call first.');
      const pay=mult*EDGE;
      resolveRound(bet*pay,true);
      const nextBest=Math.max(hlStep(rank,'higher')||0,hlStep(rank,'lower')||0);
      ctx.banner(`Cashed out at ${pay.toFixed(2)}× — ${fmt(bet*pay)}`,'win');
      hint.textContent=`One more correct call was worth up to ${(pay*nextBest).toFixed(2)}×.`;
      ctx.strip(pay.toFixed(2)+'×','w'); sfx.win(); end();
    });
    paint(null,card); buttons();
  },
  onAutoRound(ctx,d){
    const m=ctx.q('#hl-mult'); if(m) m.textContent=(d.mult||0).toFixed(2)+'×';
    const h=ctx.q('#hl-hint');
    if(h) h.textContent=d.win?`Autobet cashed out after ${d.detail} calls.`:`Autobet missed on call ${d.detail}.`;
  },
  sim(bet,o){
    const target=o.target||2;
    let rank=Math.ceil(Math.random()*13),mult=1;
    for(let i=0;i<target;i++){
      const dir=rank<=7?'higher':'lower', step=hlStep(rank,dir);
      if(step===null) return {payout:0,mult:0,tag:'✕',detail:i+1};
      let next=Math.ceil(Math.random()*13);
      while(next===rank) next=Math.ceil(Math.random()*13);
      if(!(dir==='higher'?next>rank:next<rank)) return {payout:0,mult:0,tag:'✕',detail:i+1};
      mult*=step; rank=next;
    }
    const pay=mult*EDGE;
    return {payout:bet*pay,mult:pay,tag:pay.toFixed(2)+'×',detail:target};
  }
};

/* ==========================================================
   HORSE RACE
   Seven runners. Odds are fixed; the sim rolls a winner on
   those odds first, then the race animation is choreographed
   to land on that horse — with real lead changes on the way.
========================================================== */
/* A seven-horse book only balances if the favourite is short: with a 1.68×
   favourite the other six share what is left. Chances are derived first, then
   each horse's odds come straight back out of its chance, so every runner
   returns the same 99%. */
const HORSES=[
  {n:1,name:'Bitwise',     base:1.68, c:'#37d67a'},
  {n:2,name:'Null Pointer',base:4,    c:'#4a9fd8'},
  {n:3,name:'Segfault',    base:10,   c:'#f0b429'},
  {n:4,name:'Rubber Duck', base:25,   c:'#e5484d'},
  {n:5,name:'Kernel Panic',base:60,   c:'#8b7fd4'},
  {n:6,name:'Stack Trace', base:150,  c:'#f07d29'},
  {n:7,name:'Heisenbug',   base:500,  c:'#7cc4f5'}
];
const HORSE_P=(()=>{
  const raw=HORSES.map(h=>EDGE/h.base);
  const s=raw.reduce((a,b)=>a+b,0);
  return raw.map(x=>x/s);
})();
HORSES.forEach((h,i)=>{ h.odds=Math.round(EDGE/HORSE_P[i]*100)/100; });
function rollHorse(){
  let r=Math.random();
  for(let i=0;i<HORSE_P.length;i++){ if(r<HORSE_P[i]) return i; r-=HORSE_P[i]; }
  return 0;
}

      const lanes=HORSES.map((h,i)=>({

        if(t>=1){

        if(t>0.86&&!photo){
          const sorted=lanes.map((L,i)=>({i,p:L.pos})).sort((a,b)=>b.p-a.p);

          if(Math.random()<0.08) sfx.tick();
          requestAnimationFrame(frame);
        } else {
          ctx.q(`.hr-lane[data-l="${HORSES[winner].n}"]`).classList.add('won');
          status.textContent=`${HORSES[winner].n}. ${HORSES[winner].name} takes it`;
          if(cb) cb();
        }
      })(t0);
    }

      reset(pick);
      note.textContent='And they are off.';
      const winner=rollHorse();
      race(winner,pick,()=>{
        const h=HORSES[winner], won=h.n===pick;
        const payout=won?bet*h.odds:0;
        resolveRound(payout,won);
        ctx.banner(won?`${h.name} at ${h.odds}× — ${fmt(payout)}`:`${h.name} wins — ${fmt(bet)} lost`,won?'win':'lose');
        ctx.strip(h.n+(won?'✓':''),won?'w':'l');
        won?sfx.win():sfx.lose();
        note.textContent=won?'Your runner held on.':`You backed ${HORSES[pick-1].name}.`;
        racing=false; ctx.q('#hr-go').disabled=false; ctx.lockBet(false);
      });
    });
    ctx.play=d=>{
      if(racing||d.detail===undefined) return;
      const pick=(d.session&&d.session.cfg.opts&&d.session.cfg.opts.pick)||1;
      racing=true; reset(pick);
      race(d.detail,pick,()=>{ racing=false; d.win?sfx.win():sfx.lose(); });
    };
    reset(ctx.opts().pick);
    const ro=()=>reset(ctx.opts().pick); window.addEventListener('resize',ro);
    onLeave(()=>window.removeEventListener('resize',ro));
  },
  onAutoRound(ctx,d){
    const st=ctx.q('#hr-status');
    if(st&&d.detail!==undefined) st.textContent=`${HORSES[d.detail].n}. ${HORSES[d.detail].name} takes it`;
  },
  sim(bet,o){
    const pick=o.pick||1, w=rollHorse(), h=HORSES[w];

   RIDE THE BUS
   Four calls, each one riding on the last. Miss one and the
   round is over — clear all four and you ride the bus for the
   big multiplier, or take the money and walk.
========================================================== */
const RB_STAGES=[
  {k:'color',  label:'Red or black', q:'Red or black?',            opts:[['red','Red'],['black','Black']],           odds:2},
  {k:'hilo',   label:'Higher/lower', q:'Higher or lower than that?',opts:[['higher','Higher'],['lower','Lower']],     odds:0},
  {k:'inout',  label:'Inside/outside',q:'Inside or outside the two?',opts:[['inside','Inside'],['outside','Outside']],odds:0},
  {k:'suit',   label:'Suit',         q:'Which suit?',              opts:[['♠','♠'],['♥','♥'],['♦','♦'],['♣','♣']],   odds:4}
];
const RB_BUS=6;                        /* cards on the bus ride */
function rbDraw(){
  const r=1+Math.floor(Math.random()*13), s=['♠','♥','♦','♣'][Math.floor(Math.random()*4)];
  return {r:HL_RANKS[r-1],s,v:r,red:(s==='♥'||s==='♦')};
}
/* fair odds for each call given the cards already on the table */
function rbOdds(stage,hand){
  if(stage===0) return 2;
  if(stage===1){ const v=hand[0].v; const fav=Math.max(v-1,13-v); return 12/fav; }
  if(stage===2){
    const lo=Math.min(hand[0].v,hand[1].v), hi=Math.max(hand[0].v,hand[1].v);
    const inside=Math.max(0,hi-lo-1), outside=12-inside;
    return 12/Math.max(inside,outside);
  }
  return 4;
}
function rbBestCall(stage,hand){
  if(stage===0) return Math.random()<0.5?'red':'black';
  if(stage===1) return hand[0].v<=7?'higher':'lower';
  if(stage===2){
    const lo=Math.min(hand[0].v,hand[1].v), hi=Math.max(hand[0].v,hand[1].v);
    return (hi-lo-1)>6?'inside':'outside';
  }
  return ['♠','♥','♦','♣'][Math.floor(Math.random()*4)];
}
function rbCheck(stage,call,hand,card){
  if(stage===0) return call==='red'?card.red:!card.red;
  if(stage===1){ if(card.v===hand[0].v) return null; return call==='higher'?card.v>hand[0].v:card.v<hand[0].v; }
  if(stage===2){
    const lo=Math.min(hand[0].v,hand[1].v), hi=Math.max(hand[0].v,hand[1].v);
    if(card.v===lo||card.v===hi) return null;
    const inside=card.v>lo&&card.v<hi;
    return call==='inside'?inside:!inside;
  }
  return card.s===call;
}

      const flipEl=ctx.q('#rb-pending'), frontEl=ctx.q('#rb-pending-front');
      frontEl.innerHTML = `${card.r}<br>${card.s}`;
      frontEl.className = 'pcard front'+(card.red?' red':'');
      requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ flipEl.classList.add('flipped'); sfx.deal(); }); });
      setTimeout(()=>{ busy=false; after(); }, 560);
    }
    function call(v){
      if(!live||busy||ctx.autoRunning()) return;
      const card=rbDraw();
      if(busSeat){
        drawAndFlip(card, ()=>{
          hand.push(card); paintRow(false);
          const ok=(v==='red')===card.red;
          if(!ok){
            resolveRound(0,false);
            ctx.banner(`Thrown off the bus on card ${busStep+1} — ${fmt(bet)} lost`,'lose');
            ctx.strip('BUS','l'); sfx.lose(); qEl.textContent='The bus goes on without you.'; end(); return;
          }
          busStep++; mult*=2; multEl.textContent=(mult*EDGE).toFixed(2)+'×';
          if(busStep>=RB_BUS){
            const pay=mult*EDGE;
            resolveRound(bet*pay,true);
            ctx.banner(`Rode the whole bus — ${fmt(bet*pay)}`,'win'); ctx.strip(pay.toFixed(2)+'×','w'); sfx.jackpot();
            qEl.textContent='Off at the last stop with the lot.'; end(); return;
          }
          qEl.textContent=`Bus card ${busStep+1} of ${RB_BUS} — red or black?`;
          cash.classList.remove('hidden'); paintCalls();
        });
        return;
      }
      const odds=rbOdds(stage,hand);
      drawAndFlip(card, ()=>{
        const res=rbCheck(stage,v,hand,card);
        if(res===null){ paintRow(false); qEl.textContent=`Dead heat on ${card.r} — that one is a push, call it again.`; paintCalls(); return; }
        hand.push(card); paintRow(false);
        if(!res){
          paintStages(stage);
          resolveRound(0,false);
          ctx.banner(`Wrong on ${RB_STAGES[stage].label} — ${fmt(bet)} lost`,'lose');
          ctx.strip('0×','l'); sfx.lose(); qEl.textContent='Round over.'; end(); return;
        }
        mult*=odds; stage++;
        multEl.textContent=(mult*EDGE).toFixed(2)+'×';
        sfx.step(); cash.classList.remove('hidden');
        if(stage>=4){
          busSeat=true; busStep=0; hand=[]; paintRow(false);
          qEl.textContent=`All four calls good. Ride the bus: ${RB_BUS} colour calls, each one nearly doubles — or take the money.`;
        } else {
          qEl.textContent=RB_STAGES[stage].q+` · ${rbOdds(stage,hand).toFixed(2)}× if you are right`;
        }
        paintStages(); paintCalls();
      });
    }
    start.addEventListener('click',()=>{
      if(ctx.autoRunning()) return;
      bet=ctx.bet();
      if(!placeBet(bet)) return toast('Not enough balance for that bet.','lose');
      hand=[]; stage=0; mult=1; live=true; busSeat=false; busStep=0; busy=false;
      paintRow(false); paintStages(); paintCalls();
      multEl.textContent='1.00×'; qEl.textContent=RB_STAGES[0].q+' · 2.00× if you are right';
      ctx.banner(null); ctx.lockBet(true);
      start.classList.add('hidden'); cash.classList.add('hidden');
    });
    cash.addEventListener('click',()=>{
      if(!live||mult<=1||busy) return toast('Make at least one correct call first.');
      const pay=mult*EDGE;
      resolveRound(bet*pay,true);
      ctx.banner(`Cashed out at ${pay.toFixed(2)}× — ${fmt(bet*pay)}`,'win');
      qEl.textContent=busSeat?`You left the bus after ${busStep} stop${busStep===1?'':'s'}.`:'Walked away clean.';
      ctx.strip(pay.toFixed(2)+'×','w'); sfx.win(); end();
    });
    ctx.play=d=>{
      if(live||!d.detail) return;
      const steps=d.detail.steps;
      hand=[]; stage=0; mult=1; busSeat=false; paintRow(false);
      let i=0;
      const step=()=>{
        if(!document.body.contains(handEl)) return;
        if(i>=steps.length){
          multEl.textContent=(d.mult||0).toFixed(2)+'×';
          qEl.textContent=d.win?'Bot cashed out.':'Bot missed a call.';
          paintStages(d.win?null:stage);
          d.win?sfx.win():sfx.lose();
          return;
        }
        const s=steps[i++];
        drawAndFlip(s.card, ()=>{
          hand.push(s.card); paintRow(false);
          if(s.ok){ stage=Math.min(4,s.stage+1); multEl.textContent=(s.mult*EDGE).toFixed(2)+'×'; paintStages(); setTimeout(step,300); }
          else { paintStages(s.stage); sfx.lose(); }
        });
      };
      paintStages(); step();
    };
    paintRow(false); paintStages();
  },
  onAutoRound(ctx,d){
    const m=ctx.q('#rb-mult'); if(m) m.textContent=(d.mult||0).toFixed(2)+'×';
  },
  sim(bet,o){
    const stop=o.stop||3;
    let hand=[],mult=1,steps=[];
    for(let stage=0;stage<4;stage++){
      const call=rbBestCall(stage,hand), odds=rbOdds(stage,hand);
      let card,res;
      do{ card=rbDraw(); res=rbCheck(stage,call,hand,card); } while(res===null);
      if(!res){ steps.push({stage,card,ok:false,mult}); return {payout:0,mult:0,tag:'✕',detail:{steps}}; }
      mult*=odds; hand.push(card);
      steps.push({stage,card,ok:true,mult});
      if(stage+1>=stop&&stop<=4){
        const pay=mult*EDGE;
        return {payout:bet*pay,mult:pay,tag:pay.toFixed(2)+'×',detail:{steps}};
      }
    }
    /* ride the bus */
    for(let b=0;b<RB_BUS;b++){
      const card=rbDraw(), call=Math.random()<0.5?'red':'black';
      const ok=(call==='red')===card.red;
      steps.push({stage:4,card,ok,mult});
      if(!ok) return {payout:0,mult:0,tag:'BUS',detail:{steps}};
      mult*=2;
    }
    const pay=mult*EDGE;
    return {payout:bet*pay,mult:pay,tag:pay.toFixed(2)+'×',detail:{steps}};
  }
};

/* ==========================================================
   LEADERBOARD
   Local for now; swap readBoard/writeBoard for a fetch to your
   backend when the site goes live and the rest keeps working.
========================================================== */
const Leaderboard={
  /* One row per portal account, keyed by uid, so the same person can't
     stack the board from two browsers — signing in anywhere updates the
     same row. Signed out, it falls back to the local board this browser
     already kept. */
  cache:[], loading:false,

  async read(){
    if(!Cloud.on()) return (state.board||[]).slice().sort((a,b)=>b.profit-a.profit).slice(0,25);
    const snap = await firebase.firestore().collection('leaderboard')
      .orderBy('profit','desc').limit(25).get();
    const rows=[];
    snap.forEach(d=>rows.push(Object.assign({uid:d.id}, d.data())));
    this.cache=rows;
    return rows;
  },

  entry(){
    const s=state.stats;
    return {
      name: (state.player || Cloud.name || 'Player').slice(0,24),
      profit: round2((s.returned||0)-(s.wagered||0)),
      played: s.played||0,
      biggest: round2(s.biggestWin||0),
      wagered: round2(s.wagered||0),
      jewels: state.jewels||0,
      at: Date.now()
    };
  },

  /* fires on every cloud push, so the board tracks play without
     anyone needing to remember to post */
  async autoPost(){
    if(!Cloud.on()) return;
    const e=this.entry();
    if(!e.played) return;               // nothing worth listing yet
    try{
      await firebase.firestore().collection('leaderboard').doc(Cloud.uid).set(e);
    }catch(err){ console.warn('Leaderboard write failed:', err); }
  },

  async submit(entry){
    if(Cloud.on()){
      try{
        await firebase.firestore().collection('leaderboard').doc(Cloud.uid).set(entry);
        return true;
      }catch(err){ console.warn('Leaderboard write failed:', err); return false; }
    }
    /* local fallback */
    state.board=state.board||[];
    const at=state.board.findIndex(e=>e.name.toLowerCase()===entry.name.toLowerCase());
    if(at>=0){ if(entry.profit>state.board[at].profit) state.board[at]=entry; }
    else state.board.push(entry);
    state.board=state.board.sort((a,b)=>b.profit-a.profit).slice(0,50);
    save();
    return true;
  }
};

/* ==========================================================
   DAILY WHEEL
========================================================== */
const WHEEL=[{v:100,w:22},{v:200,w:18},{v:300,w:16},{v:500,w:12},{v:750,w:9},{v:1000,w:7},{v:2500,w:4},{v:5000,w:2},{v:10000,w:1}];
function pickWheel(){
  const t=WHEEL.reduce((a,r)=>a+r.w,0); let r=Math.random()*t;
  for(let i=0;i<WHEEL.length;i++){ if(r<WHEEL[i].w) return i; r-=WHEEL[i].w; }
  return 0;
}
function countdown(ms){
  if(ms<=0) return '00:00:00';
  const h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000),s=Math.floor(ms%60000/1000);
  return [h,m,s].map(x=>String(x).padStart(2,'0')).join(':');
}
let wheelIv=null;
function renderWheel(content){
  content.classList.add('fixed');
  clearInterval(wheelIv);
  const bonus=[0,0.15,0.30][upLevel('wheel')];
  const hours=WHEEL_HOURS[upLevel('wheelspeed')];
  const total=WHEEL.reduce((a,r)=>a+r.w,0);
  /* slice size matches the real chance — the jackpot wedge is thin because it is rare */
  let deg=0;
  const slices=WHEEL.map((r,idx)=>{
    const span=360*r.w/total, from=deg; deg+=span;
    return {v:r.v, w:r.w, from, span, mid:from+span/2, idx};
  });
  const stops=slices.map(sl=>`${sl.v>=10000?'#f0b429':(sl.idx%2?'#1b3342':'#234055')} ${sl.from.toFixed(2)}deg ${(sl.from+sl.span).toFixed(2)}deg`);
  const labels=slices.map(sl=>{
    const short=sl.v>=1000?('$'+(sl.v/1000)+'k'):('$'+sl.v);
    /* push the text out along the middle of its own wedge */
    return `<div class="dw-lbl${sl.v>=10000?' jack':''}" style="transform:rotate(${sl.mid-90}deg) translate(46px,-6px)">${short}</div>`;
  }).join('');
  content.innerHTML=`<div class="game-wrap">
    <div class="game-bar"><h2>Daily Wheel <span class="sub">One free spin every ${hours} hours</span></h2>
      <button class="ghost-btn" data-nav="home">← Lobby</button></div>
    <div class="game-body">
      <div class="panel"><div class="panel-scroll">
        <div class="readout">${WHEEL.map(r=>`<div class="line"><span>${(r.w/total*100).toFixed(r.w/total<0.02?2:1)}% chance</span><b class="${r.v>=10000?'gold':''}">$${r.v.toLocaleString()}</b></div>`).join('')}</div>
        ${bonus?`<div class="note">Wheel boost active: <b>+${Math.round(bonus*100)}%</b> on every prize.</div>`:''}
        <button class="act" id="dw-spin">Spin the wheel</button>
        <div class="note" id="dw-cool"></div>
        ${upLevel('wheelspeed')<3?'<div class="note">Shorten the wait with <b>Daily wheel cooldown</b> in Jarvis Upgrades — down to every 2 hours.</div>':''}
      </div></div>
      <div class="stage">
        <div class="banner" id="banner"></div>
        <div class="dw-wrap"><div class="pointer"></div>
          <div class="dw" id="dw" style="background:conic-gradient(${stops.join(',')})">${labels}</div>
          <div class="hub" id="dw-hub" style="font-size:13px">SPIN</div></div>
      </div>
    </div></div>`;
  const btn=content.querySelector('#dw-spin'),cool=content.querySelector('#dw-cool');
  const wheel=content.querySelector('#dw'),banner=content.querySelector('#banner');
  const WAIT=hours*3600*1000;
  function tick(){
    const left=WAIT-(Date.now()-state.wheel.last);
    if(state.wheel.last===0||left<=0){ btn.disabled=false; cool.textContent='Your free spin is ready.'; }
    else{ btn.disabled=true; cool.textContent='Next free spin in '+countdown(left); }
  }
  tick(); wheelIv=setInterval(tick,1000);
  onLeave(()=>clearInterval(wheelIv));
  btn.addEventListener('click',()=>{
    if(btn.disabled) return;
    btn.disabled=true;
    const idx=forceJackpot?WHEEL.length-1:pickWheel();
    forceJackpot=false;
    const sl=slices[idx];
    const prize=Math.round(WHEEL[idx].v*(1+bonus));
    /* stop anywhere inside the wedge so the pointer never sits on a seam */
    const inside=sl.from+sl.span*(0.2+Math.random()*0.6);
    const rot=(6+Math.floor(Math.random()*3))*360+(360-inside);
    sfx.spin(); wheel.style.transform=`rotate(${rot}deg)`;
    setTimeout(()=>{
      content.querySelector('#dw-hub').textContent='$'+prize.toLocaleString();
      state.wheel.last=Date.now();
      state.balance=round2(state.balance+prize); save(); renderWallet(true);
      banner.textContent=WHEEL[idx].v>=10000?`Jackpot — $${prize.toLocaleString()} added`:`$${prize.toLocaleString()} added to your balance`;
      banner.className='banner show win';
      if(WHEEL[idx].v>=10000){ sfx.jackpot(); toast('Jackpot on the Daily Wheel.','gold'); } else sfx.win();
      tick();
    },4300);
  });
}

  const wait=days*24*3600*1000, since=Date.now()-state.lifeline.last;
  if(state.lifeline.last>0&&since<wait) return toast(`Lifeline recharges in ${countdown(wait-since)}.`,'lose');
  state.lifeline.last=Date.now();
  state.balance=round2(state.balance+50); save(); renderWallet(true);
  toast('$50 lifeline claimed. Make it count.','win'); sfx.win();
});

/* ==========================================================
   STATISTICS
========================================================== */
function renderStats(content){
  const s=state.stats, decided=s.wins+s.losses;
  const rate=decided?(s.wins/decided*100):0;
  const rtp=s.wagered?(s.returned/s.wagered*100):0;
  const net=s.returned-s.wagered;
  content.innerHTML=`
    <div class="row-head"><h2>Statistics</h2><span>Lifetime, stored in this browser</span></div>
    <div class="stat-grid">
      <div class="stat"><b>${fmt(totalBalance())}</b><small>Balance</small></div>
      <div class="stat"><b class="gemc">${fmt(state.ghostBalance||0)}</b><small>Ghost credit</small></div>
      <div class="stat"><b>${s.played.toLocaleString()}</b><small>Bets placed</small></div>
      <div class="stat"><b class="${net>=0?'pos':'neg'}">${fmtSigned(net)}</b><small>Net result</small></div>
      <div class="stat"><b>${rate.toFixed(1)}%</b><small>Win rate</small><div class="meter"><i style="width:${Math.min(100,rate)}%"></i></div></div>
      <div class="stat"><b>${rtp.toFixed(1)}%</b><small>Return to player</small><div class="meter"><i style="width:${Math.min(100,rtp)}%"></i></div></div>
      <div class="stat"><b>${fmt(s.wagered)}</b><small>Total wagered</small></div>
      <div class="stat"><b class="gold">${fmt(s.biggestWin)}</b><small>Biggest single payout</small></div>
      <div class="stat"><b class="${s.streak>=0?'pos':'neg'}">${s.streak>0?'+':''}${s.streak}</b><small>Current streak</small></div>
      <div class="stat"><b class="gemc">${s.jewelsEarned}</b><small>Jewels earned</small></div>
      <div class="stat"><b>${state.wheel.last?new Date(state.wheel.last).toLocaleDateString():'—'}</b><small>Last daily wheel</small></div>
    </div>`;
}

/* ==========================================================
   DEV MENU
========================================================== */
const dev=document.getElementById('dev');
document.addEventListener('keydown',e=>{
  if(e.shiftKey&&(e.key==='H'||e.key==='h')&&!/input|select|textarea/i.test(e.target.tagName||'')) dev.classList.toggle('open');
});
dev.addEventListener('click',e=>{
  const b=e.target.closest('[data-dev]'); if(!b) return;
  const a=b.dataset.dev;
  const add=v=>{ state.ghostBalance=round2((state.ghostBalance||0)+v); save(); renderWallet(true); toast(`${fmt(v)} ghost credit added.`,'gem'); };
  if(a==='add100') add(100);
  if(a==='add1000') add(1000);
  if(a==='add10000') add(10000);
  if(a==='addjewels'){ state.jewels+=25; save(); renderJewels(); toast('25 jewels added.','gem'); if(currentView==='upgrades') navigate('upgrades'); }
  if(a==='setbal'){ const v=prompt('Set ghost credit to:',state.ghostBalance||0); if(v!==null&&!isNaN(parseFloat(v))){ state.ghostBalance=Math.max(0,round2(parseFloat(v))); save(); renderWallet(true); } }
  if(a==='resetbal'){ state.balance=1000; state.ghostBalance=0; save(); renderWallet(true); toast('Balance reset to $1,000.'); }
  if(a==='resetwheel'){ state.wheel.last=0; save(); toast('Daily wheel reset.'); if(currentView==='dailywheel') navigate('dailywheel'); }
  if(a==='resetemerg'){ state.lifeline.last=0; save(); toast('Lifeline reset.'); }
  if(a==='jackpot'){ forceJackpot=true; toast('Next wheel spin is a jackpot.'); }
  if(a==='stopauto') Auto.stopAll('dev stop');
  if(a==='close') dev.classList.remove('open');
});

/* ==========================================================
   SOUND + INIT
========================================================== */
const soundBtn=document.getElementById('sound-btn');
const paintSound=()=>soundBtn.textContent=state.muted?'🔇':'🔊';
soundBtn.addEventListener('click',()=>{ state.muted=!state.muted; save(); paintSound(); });
paintSound();

window.addEventListener('beforeunload',e=>{ if(Auto.any()){ e.preventDefault(); e.returnValue=''; } });

buildSidebar();
renderWallet(false);
renderJewels();
navigate('home');

/* last, so the interface is already up before the network is touched */
Cloud.init();
</script>
</body>
</html>
