<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis Portal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:    #050505;
    --white: #FFFFFF;
    --dim:   #6E6E6E;
    --edge:  rgba(255,255,255,.16);
    --gap:   14px;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }

  body{
    min-height:100vh;
    background:var(--bg);
    color:var(--white);
    font-family:"JetBrains Mono", ui-monospace, monospace;
    -webkit-font-smoothing:antialiased;
  }

  /* ---- halftone dot field, dense up top, dissolving outward ---- */
  body::before{
    content:"";
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:radial-gradient(circle, #fff 1px, transparent 1px);
    background-size:13px 13px;
    -webkit-mask-image:radial-gradient(ellipse 85% 65% at 50% 4%, #000 0%, rgba(0,0,0,.55) 45%, transparent 78%);
            mask-image:radial-gradient(ellipse 85% 65% at 50% 4%, #000 0%, rgba(0,0,0,.55) 45%, transparent 78%);
    opacity:.22;
  }
  body::after{
    content:"";
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:linear-gradient(90deg, #fff 1px, transparent 1px);
    background-size:104px 100%;
    -webkit-mask-image:linear-gradient(#000, transparent 65%);
            mask-image:linear-gradient(#000, transparent 65%);
    opacity:.05;
  }

  .wrap{
    position:relative; z-index:1;
    max-width:880px;
    margin:0 auto;
    padding:84px 20px 90px;
  }

  header{ text-align:center; margin-bottom:56px; }
  h1{
    margin:0;
    font-size:clamp(19px, 4.4vw, 30px);
    font-weight:700;
    letter-spacing:.42em;
    text-indent:.42em;
    text-transform:uppercase;
  }
  .sub{
    margin:20px 0 0;
    font-size:11px; font-weight:400; letter-spacing:.3em;
    text-transform:uppercase; color:var(--dim);
  }

  .hidden{ display:none !important; }

  /* ---------- sign-in panel ---------- */
  .gate{
    max-width:340px; margin:0 auto;
    border:1px solid var(--edge);
    border-radius:2px;
    background:rgba(10,10,10,.72);
    padding:26px 24px 24px;
  }
  .gate h2{
    margin:0 0 22px;
    font-size:11px; font-weight:500; letter-spacing:.28em;
    text-transform:uppercase; color:var(--dim); text-align:center;
  }
  .field{ margin-bottom:12px; }
  .field label{
    display:block; margin-bottom:7px;
    font-size:9.5px; letter-spacing:.24em; text-transform:uppercase; color:var(--dim);
  }
  .field input{
    width:100%;
    padding:11px 12px;
    background:#0B0B0B;
    border:1px solid var(--edge);
    border-radius:2px;
    color:var(--white);
    font-family:inherit; font-size:13px; letter-spacing:.06em;
  }
  .field input:focus{ outline:none; border-color:var(--white); }

  .btn{
    width:100%; margin-top:10px; padding:12px;
    background:var(--white); color:#000;
    border:1px solid var(--white); border-radius:2px;
    font-family:inherit; font-size:10.5px; font-weight:700;
    letter-spacing:.24em; text-transform:uppercase;
    cursor:pointer;
    transition:opacity .15s ease;
  }
  .btn:hover{ opacity:.82; }
  .btn:disabled{ opacity:.4; cursor:default; }

  .swap{
    width:100%; margin-top:14px; padding:0;
    background:none; border:0; color:var(--dim);
    font-family:inherit; font-size:10px; letter-spacing:.16em;
    text-transform:uppercase; cursor:pointer;
  }
  .swap:hover{ color:var(--white); }

  .msg{
    margin:14px 0 0; min-height:14px;
    font-size:10.5px; line-height:1.6; letter-spacing:.05em;
    color:var(--dim); text-align:center;
  }
  .msg.bad{ color:var(--white); }

  /* ---------- grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:var(--gap);
  }
  @media (max-width:760px){ .grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:440px){ .grid{ grid-template-columns:1fr; } }

  .tile{
    position:relative;
    display:block;
    aspect-ratio:1 / 1;
    overflow:hidden;
    background:#0B0B0B;
    border:1px solid var(--edge);
    border-radius:2px;
    text-decoration:none;
    color:inherit;
    transition:border-color .2s ease, transform .2s ease;
    animation:in .4s ease backwards;
    animation-delay:calc(var(--i) * 55ms);
  }
  @keyframes in{ from{ opacity:0; } to{ opacity:1; } }

  .tile:hover, .tile:focus-visible{
    border-color:var(--white);
    transform:translateY(-2px);
    outline:none;
  }

  .shot{ position:absolute; inset:0; overflow:hidden; }
  .shot iframe{
    width:1280px; height:1600px; border:0;
    transform-origin:top left;
    pointer-events:none;
    opacity:0;
    filter:grayscale(1) contrast(.92) brightness(.78);
    transition:opacity .4s ease, filter .25s ease;
  }
  .tile.ready .shot iframe{ opacity:1; }

  /* Screenshot tiles use the same treatment as live previews.
     (Set in CSS, not inline, so :hover can actually override it.) */
  .shot img{
    width:100%; height:100%;
    object-fit:cover; object-position:top center;
    filter:grayscale(1) contrast(.92) brightness(.78);
    transition:filter .25s ease;
  }

  /* Colour only while the pointer is on the tile. Gated behind
     hover:hover so phones don't get stuck in the hovered state
     after a tap. */
  @media (hover: hover){
    .tile:hover .shot iframe,
    .tile:hover .shot img{ filter:none; }
  }
  .tile:focus-visible .shot iframe,
  .tile:focus-visible .shot img{ filter:none; }

  /* Touch screens can't hover, so nothing would ever go colour.
     Show them as they are. */
  @media (hover: none){
    .shot iframe, .shot img{ filter:none; }
  }

  .stub{
    position:absolute; inset:0;
    display:grid; place-items:center;
    font-size:26px; font-weight:700; letter-spacing:.16em;
    color:rgba(255,255,255,.14);
    background:
      repeating-linear-gradient(45deg, transparent 0 6px, rgba(255,255,255,.03) 6px 7px),
      #0B0B0B;
    transition:opacity .3s ease;
  }
  .tile.ready .stub{ opacity:0; }

  .meta{
    position:absolute; left:0; right:0; bottom:0;
    padding:30px 12px 11px;
    background:linear-gradient(transparent, rgba(0,0,0,.9) 55%);
    font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .meta span{ color:var(--dim); }
  .tile:hover .meta span{ color:var(--white); }

  .empty{
    grid-column:1 / -1;
    border:1px dashed var(--edge);
    padding:44px 20px; text-align:center;
    font-size:12px; letter-spacing:.1em; color:var(--dim);
  }

  /* ---------- account bar ---------- */
  .account{
    display:flex; justify-content:center; align-items:center; gap:14px;
    margin:0 0 30px;
    font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim);
  }
  .account b{ color:var(--white); font-weight:500; }
  .account button{
    background:none; border:0; padding:0;
    color:var(--dim); font-family:inherit; font-size:10px;
    letter-spacing:.2em; text-transform:uppercase;
    text-decoration:underline; text-underline-offset:3px; cursor:pointer;
  }
  .account button:hover{ color:var(--white); }

  /* ---------- sound toggle ---------- */
  .sound{
    position:fixed; right:18px; bottom:18px; z-index:3;
    display:flex; align-items:center; gap:9px;
    padding:9px 13px;
    background:rgba(5,5,5,.75);
    border:1px solid var(--edge);
    border-radius:2px;
    color:var(--dim);
    font:inherit; font-size:10px; letter-spacing:.24em; text-transform:uppercase;
    cursor:pointer;
    transition:color .2s ease, border-color .2s ease;
  }
  .sound:hover, .sound:focus-visible{ color:var(--white); border-color:var(--white); outline:none; }

  .bars{ display:flex; align-items:flex-end; gap:2px; height:11px; }
  .bars i{ width:2px; height:100%; background:currentColor; transform:scaleY(.18); transform-origin:bottom; }
  .sound.on .bars i{ animation:bounce .9s ease-in-out infinite; }
  .sound.on .bars i:nth-child(2){ animation-delay:.18s; }
  .sound.on .bars i:nth-child(3){ animation-delay:.36s; }
  @keyframes bounce{ 0%,100%{ transform:scaleY(.18); } 50%{ transform:scaleY(1); } }

  /* ---------- settings ---------- */
  .cog{
    position:fixed; left:18px; bottom:18px; z-index:4;
    display:flex; align-items:center; gap:8px;
    padding:9px 13px;
    background:rgba(5,5,5,.75);
    border:1px solid var(--edge);
    border-radius:2px;
    color:var(--dim);
    font:inherit; font-size:10px; letter-spacing:.24em; text-transform:uppercase;
    cursor:pointer;
    transition:color .2s ease, border-color .2s ease;
  }
  .cog:hover, .cog:focus-visible{ color:var(--white); border-color:var(--white); outline:none; }

  .panel{
    position:fixed; left:18px; bottom:62px; z-index:5;
    width:272px; padding:18px;
    background:rgba(6,6,6,.96);
    border:1px solid var(--edge);
    border-radius:2px;
    display:none;
  }
  .panel.open{ display:block; }
  .panel h3{
    margin:0 0 16px;
    font-size:10px; font-weight:500; letter-spacing:.28em;
    text-transform:uppercase; color:var(--dim);
  }
  .set{ margin-bottom:18px; }
  .set label{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:9px;
    font-size:9.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim);
  }
  .set label b{ color:var(--white); font-weight:500; letter-spacing:.1em; }

  input[type=range]{
    -webkit-appearance:none; appearance:none;
    width:100%; height:1px; background:var(--edge); outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:11px; height:11px; border-radius:0;
    background:var(--white); cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:11px; height:11px; border:0; border-radius:0;
    background:var(--white); cursor:pointer;
  }

  .keybtn{
    width:100%; padding:10px;
    background:#0B0B0B; border:1px solid var(--edge); border-radius:2px;
    color:var(--white); font-family:inherit; font-size:11px;
    letter-spacing:.18em; text-transform:uppercase; cursor:pointer;
  }
  .keybtn:hover{ border-color:var(--white); }
  .keybtn.listening{ border-color:var(--white); color:var(--dim); }

  .panel .note{
    margin:0; font-size:9.5px; line-height:1.7; letter-spacing:.04em; color:var(--dim);
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition-duration:.01ms !important; }
  }
</style>
</head>

<body>
<div class="wrap">

  <header>
    <h1>Jarvis Portal</h1>
    <p class="sub" id="sub">Checking your session</p>
  </header>

  <!-- ===== SIGN IN ===== -->
  <section class="gate hidden" id="gate">
    <h2 id="gateTitle">Sign in</h2>

    <div class="field">
      <label for="u">Username</label>
      <input id="u" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20">
    </div>

    <div class="field">
      <label for="p">Password</label>
      <input id="p" type="password" autocomplete="current-password">
    </div>

    <button class="btn" id="go" type="button">Sign in</button>
    <button class="swap" id="swap" type="button">No account? Create one</button>

    <p class="msg" id="msg"></p>
  </section>

  <!-- ===== PORTAL ===== -->
  <div id="portal" class="hidden">
    <div class="account">
      <span>Signed in as <b id="who"></b></span>
      <button id="out" type="button">Sign out</button>
    </div>
    <main class="grid" id="grid"></main>
  </div>

</div>

<audio id="track" src="bloom.mp3" loop preload="auto"></audio>

<button class="cog" id="cogBtn" type="button" aria-expanded="false">Settings</button>

<div class="panel" id="panel">
  <h3>Settings</h3>

  <div class="set">
    <label for="vol">Music volume <b id="volVal">10%</b></label>
    <input id="vol" type="range" min="0" max="100" step="1" value="10">
  </div>

  <div class="set">
    <label for="keyBtn">Panic key <b id="keyVal">Escape</b></label>
    <button class="keybtn" id="keyBtn" type="button">Click, then press a key</button>
  </div>

  <p class="note">The panic key hides the page behind a cover screen, and applies to every page on this site. Three fast taps of Shift always works too. Click the cover's logo three times to come back.</p>
</div>

<button class="sound" id="soundBtn" type="button" aria-pressed="false">
  <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
  <span id="soundLabel">Sound off</span>
</button>

<script>
/* =========================================================
   BACKGROUND MUSIC
   Deliberately its own <script>. If anything in the Firebase
   block below fails, the music keeps working — and vice versa.

   VOLUME is the only number you normally touch.
   ========================================================= */
(function(){
  const VOLUME  = 0.10;
  const FADE_MS = 1400;

  const track = document.getElementById('track');
  const btn   = document.getElementById('soundBtn');
  const label = document.getElementById('soundLabel');
  let fadeTimer, broken = false;

  track.volume = 0;

  // the file isn't there / wrong name / wrong folder
  track.addEventListener('error', () => {
    broken = true;
    label.textContent = 'No track';
    btn.title = 'bloom.mp3 was not found next to index.html';
    console.error('Audio failed to load:', track.currentSrc || track.src);
  });

  function fadeTo(target){
    clearInterval(fadeTimer);
    const steps = 28, from = track.volume, step = (target - from) / steps;
    let n = 0;
    fadeTimer = setInterval(() => {
      n++;
      track.volume = Math.min(1, Math.max(0, from + step * n));
      if(n >= steps){
        clearInterval(fadeTimer);
        track.volume = Math.min(1, Math.max(0, target));
        if(target === 0) track.pause();
      }
    }, FADE_MS / steps);
  }

  function setState(on){
    btn.classList.toggle('on', on);
    btn.setAttribute('aria-pressed', String(on));
    label.textContent = on ? 'Sound on' : 'Sound off';
  }

  function play(){
    if(broken) return Promise.reject();
    const attempt = track.play();
    // older browsers return undefined instead of a promise
    return (attempt || Promise.resolve()).then(() => { setState(true); fadeTo(VOLUME); });
  }

  btn.addEventListener('click', () => {
    if(track.paused) play().catch(() => {});
    else { setState(false); fadeTo(0); }
  });

  /* Browsers refuse to start audio on a page you haven't touched.
     Rather than a one-shot fallback, keep listening until it
     actually plays — the first click, tap or keypress wins,
     including the one on the sign-in form. */
  function arm(){
    const kick = () => {
      play().then(disarm).catch(() => {});
    };
    function disarm(){
      ['pointerdown','keydown','touchstart'].forEach(e =>
        document.removeEventListener(e, kick));
    }
    ['pointerdown','keydown','touchstart'].forEach(e =>
      document.addEventListener(e, kick));
  }

  play().catch(arm);

  // the settings panel drives volume through this
  window.portalAudio = {
    setVolume(v){
      const target = Math.min(1, Math.max(0, v));
      clearInterval(fadeTimer);
      track.volume = target;
      if (target === 0) { track.pause(); setState(false); }
      else if (track.paused) play().catch(() => {});
    },
    defaultVolume: VOLUME
  };
})();
</script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<!-- your Firebase keys — edit firebase-config.js, not this file -->
<script src="firebase-config.js"></script>

<script>
/* =========================================================
   1. YOUR PAGES
   file  — the .html file, sitting next to this one
   name  — the label on the square
   image — OPTIONAL screenshot path instead of a live preview
   ========================================================= */
const SITES = [
  { name: "Jarvia",   file: "Jarvia.html" },
  { name: "Siamese Clicker",   file: "siameseclicker.html" },
  { name: "iMessage", file: "imessage.html" },
];

/* =========================================================
   2. FIREBASE
   firebaseConfig and USER_DOMAIN both come from
   firebase-config.js, loaded just above. imessage.html reads
   the same file, so signing in here signs you in there too.
   ========================================================= */
if (typeof firebaseConfig === 'undefined' || firebaseConfig.apiKey === 'PASTE_YOURS') {
  document.getElementById('sub').textContent = 'firebase-config.js is not filled in yet';
  console.error('Fill in firebase-config.js before using the portal.');
} else {
  startPortal();
}

function startPortal(){

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const firestore = firebase.firestore();

const emailFor = name => name.trim().toLowerCase() + USER_DOMAIN;

const $ = id => document.getElementById(id);
const gate = $('gate'), portal = $('portal'), grid = $('grid');
const u = $('u'), p = $('p'), go = $('go'), swap = $('swap'), msg = $('msg');
const sub = $('sub'), who = $('who'), gateTitle = $('gateTitle');

let mode = 'in';   // 'in' = sign in, 'up' = create account

function say(text, bad){
  msg.textContent = text || '';
  msg.classList.toggle('bad', !!bad);
}

function setMode(next){
  mode = next;
  const up = mode === 'up';
  gateTitle.textContent = up ? 'Create account' : 'Sign in';
  go.textContent        = up ? 'Create account' : 'Sign in';
  swap.textContent      = up ? 'Already have an account? Sign in' : 'No account? Create one';
  p.autocomplete        = up ? 'new-password' : 'current-password';
  say('');
}
swap.onclick = () => setMode(mode === 'in' ? 'up' : 'in');

/* plain-language versions of Firebase's error codes */
function explain(code){
  switch(code){
    case 'auth/invalid-credential':
    case 'auth/wrong-password':
    case 'auth/user-not-found':      return 'That username and password don\'t match.';
    case 'auth/email-already-in-use':return 'That username is taken. Pick another.';
    case 'auth/weak-password':       return 'Password needs to be at least 6 characters.';
    case 'auth/invalid-email':       return 'Usernames can use letters, numbers, dots, dashes and underscores.';
    case 'auth/too-many-requests':   return 'Too many tries. Wait a minute and go again.';
    case 'auth/network-request-failed': return 'No connection to the server.';
    case 'auth/operation-not-allowed':  return 'Email/Password sign-in is switched off in the Firebase console.';
    default: return 'Something went wrong: ' + code;
  }
}

async function submit(){
  const name = u.value.trim();
  const pass = p.value;

  if(!/^[a-zA-Z0-9._-]{3,20}$/.test(name)){
    return say('Username: 3–20 characters, letters/numbers/. _ - only.', true);
  }
  if(pass.length < 6) return say('Password must be at least 6 characters.', true);

  go.disabled = true;
  say(mode === 'up' ? 'Creating account…' : 'Signing in…');

  try{
    if(mode === 'up'){
      const cred = await auth.createUserWithEmailAndPassword(emailFor(name), pass);
      // imessage.html reads this document for the display name
      await firestore.collection('users').doc(cred.user.uid).set({
        username: name,
        profilePic: '',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    } else {
      await auth.signInWithEmailAndPassword(emailFor(name), pass);
    }
    p.value = '';
  }catch(err){
    say(explain(err.code || err.message), true);
  }finally{
    go.disabled = false;
  }
}

go.onclick = submit;
[u,p].forEach(el => el.addEventListener('keydown', e => { if(e.key === 'Enter') submit(); }));
$('out').onclick = () => auth.signOut();

/* ---- the session decides which half of the page you see ---- */
auth.onAuthStateChanged(async user => {
  if(user){
    let name = (user.email || '').split('@')[0];
    try{
      const doc = await firestore.collection('users').doc(user.uid).get();
      if(doc.exists && doc.data().username) name = doc.data().username;
    }catch(e){ /* fall back to the username from the address */ }

    who.textContent = name;
    sub.textContent = 'Select a destination';
    loadSettings(user);
    gate.classList.add('hidden');
    portal.classList.remove('hidden');
    build();
    fitThumbnails();
  } else {
    sub.textContent = 'Sign in to continue';
    portal.classList.add('hidden');
    gate.classList.remove('hidden');
    grid.innerHTML = '';
    built = false;
    setMode('in');
    u.focus();
  }
});

/* =========================================================
   3. THE GRID
   ========================================================= */
const BASE_WIDTH = 1280;
const LOAD_TIMEOUT = 7000;
let built = false;

const initials = n => n.split(/\s+/).map(w => w[0] || '').join('').slice(0,2).toUpperCase() || '—';

function build(){
  if(built) return;
  built = true;

  if(!SITES.length){
    grid.innerHTML = '<div class="empty">No pages listed. Add one to the SITES list in this file.</div>';
    return;
  }

  SITES.forEach((site, i) => {
    const a = document.createElement('a');
    a.className = 'tile';
    a.href = site.file;
    a.style.setProperty('--i', i);
    a.setAttribute('aria-label', site.name);

    const shot = document.createElement('div');
    shot.className = 'shot';

    const stub = document.createElement('div');
    stub.className = 'stub';
    stub.textContent = initials(site.name);

    if(site.image){
      const img = document.createElement('img');
      img.src = site.image; img.alt = ''; img.loading = 'lazy';
      img.addEventListener('load', () => a.classList.add('ready'));
      shot.appendChild(img);
    } else {
      const frame = document.createElement('iframe');
      frame.src = site.file;
      frame.setAttribute('scrolling', 'no');
      frame.setAttribute('tabindex', '-1');
      frame.setAttribute('aria-hidden', 'true');
      frame.setAttribute('loading', 'lazy');
      frame.setAttribute('sandbox', 'allow-same-origin allow-scripts');
      frame.addEventListener('load', () => a.classList.add('ready'));
      setTimeout(() => a.classList.add('ready'), LOAD_TIMEOUT);
      shot.appendChild(frame);
    }

    const meta = document.createElement('div');
    meta.className = 'meta';
    const label = document.createElement('span');
    label.textContent = site.name;
    meta.appendChild(label);

    a.append(shot, stub, meta);
    grid.appendChild(a);
  });
}

function fitThumbnails(){
  document.querySelectorAll('.shot').forEach(shot => {
    const frame = shot.querySelector('iframe');
    if(frame) frame.style.transform = 'scale(' + (shot.clientWidth / BASE_WIDTH) + ')';
  });
}
addEventListener('resize', fitThumbnails);

/* =========================================================
   5. SETTINGS
   Saved on your account document, so they follow you to any
   device you sign in on. Nothing is kept in the browser.
   ========================================================= */
const cogBtn = $('cogBtn'), panel = $('panel');
const vol = $('vol'), volVal = $('volVal');
const keyBtn = $('keyBtn'), keyVal = $('keyVal');

let settings = { volume: 10, hotkey: 'Escape' };

cogBtn.onclick = (e) => {
  e.stopPropagation();
  const open = panel.classList.toggle('open');
  cogBtn.setAttribute('aria-expanded', String(open));
};
document.addEventListener('click', (e) => {
  if (!panel.contains(e.target) && e.target !== cogBtn) panel.classList.remove('open');
});

function applySettings(){
  vol.value = settings.volume;
  volVal.textContent = settings.volume + '%';
  keyVal.textContent = prettyKey(settings.hotkey);
  if (window.portalAudio) window.portalAudio.setVolume(settings.volume / 100);
  // setHotkey also mirrors the key so pages without Firebase pick it up
  if (window.privacyScreen) window.privacyScreen.setHotkey(settings.hotkey);
}

function prettyKey(k){
  if (!k) return 'None';
  return { ' ': 'Space', 'Escape': 'Escape', 'Control': 'Ctrl' }[k] ||
         (k.length === 1 ? k.toUpperCase() : k);
}

let saveTimer;
function saveSettings(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const user = auth.currentUser;
    if (!user) return;
    firestore.collection('users').doc(user.uid)
      .set({ settings }, { merge: true })
      .catch(err => console.warn('Could not save settings:', err));
  }, 400);   // slider drags would otherwise write on every pixel
}

vol.addEventListener('input', () => {
  settings.volume = parseInt(vol.value, 10);
  volVal.textContent = settings.volume + '%';
  if (window.portalAudio) window.portalAudio.setVolume(settings.volume / 100);
  saveSettings();
});

let listening = false;
keyBtn.onclick = () => {
  listening = true;
  keyBtn.classList.add('listening');
  keyBtn.textContent = 'Press any key…';
};

document.addEventListener('keydown', (e) => {
  if (!listening) return;
  e.preventDefault();
  // stopPropagation isn't enough: the privacy script listens on this same
  // node, so binding Escape would trigger the cover as you set it.
  e.stopImmediatePropagation();
  listening = false;
  keyBtn.classList.remove('listening');
  keyBtn.textContent = 'Click, then press a key';

  settings.hotkey = e.key === 'Unidentified' ? e.code : e.key;
  keyVal.textContent = prettyKey(settings.hotkey);
  if (window.privacyScreen) window.privacyScreen.setHotkey(settings.hotkey);
  saveSettings();
}, true);   // capture, so the panic key itself can be rebound

// the cover script is the last tag on the page, so it may not exist yet
addEventListener('load', () => {
  if (window.privacyScreen) window.privacyScreen.setHotkey(settings.hotkey);
});

async function loadSettings(user){
  try{
    const doc = await firestore.collection('users').doc(user.uid).get();
    const saved = doc.exists && doc.data().settings;
    if (saved) settings = { ...settings, ...saved };
  }catch(e){ /* defaults are fine */ }
  applySettings();
}

} /* end startPortal */

</script>

<!-- privacy cover: Esc to hide, three logo clicks to return -->
<script src="privacy-screen.js"></script>
