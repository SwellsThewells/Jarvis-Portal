}

function paintStats(){
  const mins = (Date.now() - S.started) / 60000;
  const totalLanded = landed.reduce((a,b) => a+b, 0);
  const rows = [
    ['Lifetime chips', fmt(S.earned)],
    ['Balls dropped', fmt(S.drops)],
    ['Best single slot', fmt(S.best)],
    ['Landed this board', fmt(totalLanded)],
    ['Prisms held', fmt(S.prisms)],
    ['Global multiplier', '×' + fmt(prismMult())],
    ['Alloy held', fmt(S.alloy || 0)],
    ['Lifetime alloy', fmt(S.alloyEarned || 0)],
    ['Balls merged', fmt(S.mergeCount || 0)],
    ['Best ball', 'T' + (S.bestOrb || 0) + (S.bestOrb ? ' · ' + orb(S.bestOrb).name : '')],
    ['Aether held', fmt(S.aether || 0)],
    ['Lifetime aether', fmt(S.aetherEarned || 0)],
    ['Shards', fmt(S.shards || 0)],
    ['Constellations equipped', (S.active||[]).length + ' / ' + conSlots()],
    ['Ball loaded', curBall().name],
    ['Quanta held', fmt(S.quanta || 0)],
    ['Lifetime quanta', fmt(S.quantaEarned || 0)],
    ['Tree nodes bought', Object.values(S.tree || {}).reduce((a,b) => a + b, 0)],
    ['Spectra held', fmt(S.spectra || 0)],
    ['Lifetime spectra', fmt(S.spectraEarned || 0)],
    ['Flux', fmt(Math.floor(S.flux || 0))],
    ['Golden balls caught', fmt(S.goldHits || 0)],
    ['Rim landings', fmt(S.rimHits || 0)],
    ['Rows', eff('rows')],
    ['Slots', slots.length],
    ['Rim slot pays', '×' + fmt(slots.length ? slotMult(slots[0]) : 0)],
    ['Centre slot pays', '×' + fmt(slots.length ? slotMult(slots[Math.floor(slots.length/2)]) : 0)],
    ['Session', mins < 60 ? Math.floor(mins) + ' min' : (mins/60).toFixed(1) + ' hr']
  ];
  $('statList').innerHTML =
    rows.map(([k,v]) =>
      '<div class="row"><span class="k">' + k + '</span><span class="dots"></span><span class="v">' + v + '</span></div>'
    ).join('') +
    '<div class="sect" style="padding-left:0;padding-right:0"><h4>Milestones · ' +
      msDone() + ' of ' + MILESTONES.length + ' · ×' + (Math.round(msMult()*100)/100) + '</h4></div>' +
    MILESTONES.map(m =>
      '<div class="ms' + (S.ms[m.id] ? ' done' : '') + '">' +
      '<span class="dot"></span><span class="lbl">' + m.label + '</span>' +
      '<span class="req">' + (S.ms[m.id] ? 'done' : '') + '</span></div>'
    ).join('');
}

/* ---------------- settings ---------------- */
function opt(k){ return S.opt[k]; }

function setOpt(k, v){
  S.opt[k] = v;
  if (k === 'theme') applyTheme(v);
  if (k === 'showDist') $('dist').style.display = v ? '' : 'none';
  save();
  buildSettings();
}

const TOGGLES = [
  ['showDist',   'Distribution strip', 'The live histogram under the board showing where balls actually land.'],
  ['showLabels', 'Slot multipliers',   'Print the × value inside each slot. Off is cleaner at high row counts.'],
  ['confirmReset','Confirm recalibrate','Ask before wiping chips and upgrades for prisms.'],
  ['offline',    'Offline earnings',   'Credit time away at a reduced rate when you come back.'],
  ['sci',        'Scientific notation', 'Show 1.23e15 instead of 1.23Qa. Useful once names run out.']
];

const BALL_CAPS = [150, 420, 900, 2000];

function buildSettings(){
  const box = $('setList');
  box.innerHTML = '';

  // dark mode first, then the full palette list
  const dm = document.createElement('div');
  dm.className = 'opt';
  dm.innerHTML = '<div class="t"><b>Dark mode</b>' +
    '<span>Switches the whole interface, the board and the browser chrome. ' +
    'Defaults to whatever your system prefers.</span></div>';
  const dmb = document.createElement('button');
  dmb.className = 'sw' + (isDark() ? ' on' : '');
  dmb.textContent = isDark() ? 'On' : 'Off';
  dmb.onclick = () => { toggleDark(); };
  dm.appendChild(dmb);
  box.appendChild(dm);

  const sect = document.createElement('div');
  sect.className = 'sect';
  sect.innerHTML = '<h4>Theme</h4>';
  box.appendChild(sect);

  const sw = document.createElement('div');
  sw.className = 'swatches';
  Object.keys(THEMES).forEach(key => {
    const t = THEMES[key];
    const b = document.createElement('button');
    b.className = 'sws' + (opt('theme') === key ? ' on' : '');
    b.dataset.theme = key;
    b.innerHTML =
      '<span class="bar">' +
        '<i style="background:' + t.vars.paper + '"></i>' +
        '<i style="background:' + t.vars.ink + '"></i>' +
        '<i style="background:' + t.vars.hot + '"></i>' +
        '<i style="background:' + t.vars.cool + '"></i>' +
      '</span><span class="nm">' + t.name + '</span>';
    b.onclick = () => setOpt('theme', key);
    sw.appendChild(b);
  });
  box.appendChild(sw);

  // toggles
  const s2 = document.createElement('div');
  s2.className = 'sect';
  s2.innerHTML = '<h4>Display</h4>';
  box.appendChild(s2);

  TOGGLES.forEach(([k, label, note]) => {
    const row = document.createElement('div');
    row.className = 'opt';
    row.innerHTML = '<div class="t"><b></b><span></span></div>';
    row.querySelector('b').textContent = label;
    row.querySelector('span').textContent = note;
    const btn = document.createElement('button');
    btn.className = 'sw' + (opt(k) ? ' on' : '');
    btn.textContent = opt(k) ? 'On' : 'Off';
    btn.onclick = () => setOpt(k, !opt(k));
    row.appendChild(btn);
    box.appendChild(row);
  });

  // performance
  const s3 = document.createElement('div');
  s3.className = 'sect';
  s3.innerHTML = '<h4>Performance</h4>';
  box.appendChild(s3);

  const hide = document.createElement('div');
  hide.className = 'opt';
  hide.innerHTML = '<div class="t"><b>Hide the balls</b>' +
    '<span>Stops drawing and simulating them. Drops resolve instantly ' +
    'against the board\'s real landing distribution, so you earn exactly ' +
    'the same — it is simply far cheaper to run.</span></div>';
  const hb = document.createElement('button');
  hb.className = 'sw' + (opt('hideBalls') ? ' on' : '');
  hb.textContent = opt('hideBalls') ? 'On' : 'Off';
  hb.onclick = () => { setOpt('hideBalls', !opt('hideBalls')); balls.length = 0; };
  hide.appendChild(hb);
  box.appendChild(hide);

  const perf = document.createElement('div');
  perf.className = 'opt';
  perf.innerHTML = '<div class="t"><b>Balls on screen</b>' +
    '<span>Anything above this is not spawned. Payouts are unaffected. ' +
    'Type any number from 10 to 5000.</span></div>';
  const inp = document.createElement('input');
  inp.type = 'number'; inp.min = '10'; inp.max = '5000'; inp.step = '10';
  inp.value = opt('maxBalls');
  inp.className = 'numin';
  inp.onchange = () => {
    const v = Math.max(10, Math.min(5000, Math.floor(Number(inp.value) || 420)));
    inp.value = v;
    setOpt('maxBalls', v);
  };
  perf.appendChild(inp);
  box.appendChild(perf);

  const quick = document.createElement('div');
  quick.className = 'opt';
  quick.innerHTML = '<div class="t"><span>Common values</span></div>';
  BALL_CAPS.forEach(v => {
    const b = document.createElement('button');
    b.className = 'sw' + (opt('maxBalls') === v ? ' on' : '');
    b.style.minWidth = '52px';
    b.textContent = v;
    b.onclick = () => setOpt('maxBalls', v);
    quick.appendChild(b);
  });
  box.appendChild(quick);

  // save data
  const s4 = document.createElement('div');
  s4.className = 'sect';
  s4.innerHTML = '<h4>Save data</h4>';
  box.appendChild(s4);

  const io = document.createElement('div');
  io.className = 'opt';
  io.innerHTML = '<div class="t"><b>Export or import</b>' +
    '<span>Your save lives in this browser only. Export before clearing site data, ' +
    'or to carry progress to another machine.</span></div>';
  const ex = document.createElement('button');
  ex.className = 'sw'; ex.textContent = 'Copy';
  ex.onclick = exportSave;
  const im = document.createElement('button');
  im.className = 'sw'; im.textContent = 'Load';
  im.onclick = importSave;
  io.append(ex, im);
  box.appendChild(io);
}

function exportSave(){
  const code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code)
      .then(() => toast('Save copied to clipboard'))
      .catch(() => window.prompt('Copy this:', code));
  } else {
    window.prompt('Copy this:', code);
  }
}

function importSave(){
  const code = window.prompt('Paste a save code. This replaces everything you have now.');
  if (!code) return;
  try{
    const d = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    if (typeof d !== 'object' || !d.lv) throw new Error('not a save');
    S = Object.assign(FRESH(), d);
    S.lv  = Object.assign(FRESH().lv, d.lv || {});
    S.opt = Object.assign({}, DEFAULT_OPT, d.opt || {});
    balls.length = 0;
    applyTheme(S.opt.theme);
    buildBoard(); buildSettings(); paintHud(); save();
    toast('Save loaded');
  }catch(e){
    toast('That save code is not valid');
  }
}

let currentTab = 'up';

$('dropBtn').onclick = dropSet;

/* hold space to keep dropping — saves your finger in the early game */
let holding = false, holdTimer = null;
function startHold(){
  if (holding) return;
  holding = true;
  dropSet();
  holdTimer = setInterval(dropSet, 110);
}
function stopHold(){ holding = false; clearInterval(holdTimer); }
$('dropBtn').addEventListener('pointerdown', startHold);
['pointerup','pointerleave','pointercancel'].forEach(e =>
  $('dropBtn').addEventListener(e, stopHold));
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && e.target === document.body){ e.preventDefault(); startHold(); }
});
document.addEventListener('keyup', e => { if (e.code === 'Space') stopHold(); });

$('pBtn').onclick = () => {
  const gain = prismsOnReset();
  if (gain < 1) return;
  if (S.opt.confirmReset &&
      !confirm('Recalibrate for ' + fmt(gain) + ' prisms?\n\nChips and every upgrade reset. Prisms and their multiplier are kept forever.')) return;
  S.prisms += gain; S.prismsEarned += gain;
  S.cash = 0; S.lv = FRESH().lv;
  // Float: begin the run with something already banked
  if (peff('seed') > 0) S.cash = 1000 * Math.pow(6, peff('seed')) * prismMult();
  const head = peff('head');
  if (head > 0){ S.lv.value = head; S.lv.auto = head; }   // Momentum
  balls.length = 0;
  buildBoard(); save();
  toast('Recalibrated — ×' + (Math.round(prismMult()*10)/10) + ' on everything');
};

$('cBtn').onclick = () => {
  const gain = spectraOnCollapse();
  if (gain < 1) return;
  if (S.opt.confirmReset &&
      !confirm('Collapse for ' + fmt(gain) + ' spectra?\n\nChips, upgrades, prisms AND the prism shop all reset. ' +
               'Spectra, the spectra shop, milestones and flux are kept.')) return;

  S.spectra += gain; S.spectraEarned += gain;
  S.cash = 0; S.prisms = 0; S.prismsEarned = 0;
  S.lv = FRESH().lv;
  S.pv = FRESH().pv;

  // Foundation hands back some of the prism shop immediately
  const found = seff('found') + nEff('core');
  if (found > 0) Object.keys(S.pv).forEach(k => S.pv[k] = found);

  balls.length = 0;
  buildBoard(); buildVault(); save(); paintHud();
  toast('Collapsed · ' + fmt(S.spectra) + ' spectra held');
};

$('aBtn').onclick = () => {
  const gain = quantaOnAscend();
  if (gain < 1) return;
  if (S.opt.confirmReset &&
      !confirm('Ascend for ' + fmt(gain) + ' quanta?\n\nEverything below this layer resets: chips, upgrades, prisms, ' +
               'the prism shop, spectra and the spectra shop. The tree, your milestones and flux are kept.')) return;

  S.quanta += gain; S.quantaEarned += gain;

  /* Echo keeps a share of the spectra shop through the reset */
  const keep = nEff('echo');
  const carried = {};
  Object.keys(S.sv).forEach(k => carried[k] = Math.floor(S.sv[k] * keep));

  S.cash = 0; S.prisms = 0; S.prismsEarned = 0;
  S.spectra = 0; S.spectraEarned = 0;
  S.lv = FRESH().lv;
  S.pv = FRESH().pv;
  S.sv = Object.assign(FRESH().sv, carried);

  balls.length = 0;
  buildBoard(); buildVault(); buildTree(); paintTree(); save(); paintHud();
  toast('Ascended · ' + fmt(S.quanta) + ' quanta held');
};

$('tBtn').onclick = () => {
  const gain = aetherOnTranscend();
  if (gain < 1) return;
  if (S.opt.confirmReset &&
      !confirm('Transcend for ' + fmt(gain) + ' aether?\n\nEverything below resets — chips, upgrades, prisms, ' +
               'spectra, quanta and the whole tree. Constellations, the bazaar, shards and milestones are kept.')) return;

  S.aether += gain; S.aetherEarned += gain;
  S.cash = 0;
  S.prisms = 0; S.prismsEarned = 0;
  S.spectra = 0; S.spectraEarned = 0;
  S.quanta = 0; S.quantaEarned = 0;
  S.lv = FRESH().lv; S.pv = FRESH().pv; S.sv = FRESH().sv;
  S.tree = {}; invalidateGen();

  balls.length = 0;
  buildBoard(); buildVault(); buildTree(); paintTree(); paintCosmos(); save(); paintHud();
  toast('Transcended · ' + fmt(S.aether) + ' aether held');
};

$('rBtn').onclick = () => {
  const gain = alloyOnReforge();
  if (gain < 1) return;
  if (S.opt.confirmReset &&
      !confirm('Reforge for ' + fmt(gain) + ' alloy?\n\nEverything below resets, aether and constellations included. ' +
               'The forge — your balls, bench and equipped set — is kept, along with shards and milestones.')) return;

  S.alloy += gain; S.alloyEarned += gain;
  S.cash = 0;
  S.prisms = 0; S.prismsEarned = 0;
  S.spectra = 0; S.spectraEarned = 0;
  S.quanta = 0; S.quantaEarned = 0;
  S.aether = 0; S.aetherEarned = 0;
  S.lv = FRESH().lv; S.pv = FRESH().pv; S.sv = FRESH().sv;
  S.tree = {}; invalidateGen(); S.cons = {}; S.active = [];

  balls.length = 0;
  treeRows = -1;
  buildBoard(); buildVault(); buildTree(); paintTree();
  paintCosmos(); paintForge(); save(); paintHud();
  toast('Reforged · ' + fmt(S.alloy) + ' alloy held');
};

/* ---------------- saving ---------------- */
const KEY = 'jarvis.plinko';
function save(){
  try{ S.lastSeen = Date.now(); localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  cloudDirty = true;
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    S = Object.assign(FRESH(), d);
    S.lv  = Object.assign(FRESH().lv, d.lv || {});
    S.opt = Object.assign({}, DEFAULT_OPT, d.opt || {});   // new options get defaults
    S.pv  = Object.assign(FRESH().pv, d.pv || {});
    S.sv  = Object.assign(FRESH().sv, d.sv || {});
    S.tree = d.tree || {}; invalidateGen();
    S.cons = d.cons || {};
    S.active = Array.isArray(d.active) ? d.active : [];
    S.bz  = d.bz || {};
    S.quests = Array.isArray(d.quests) ? d.quests : [];
    S.ball = d.ball || 'std';
    S.bench = Array.isArray(d.bench) ? d.bench : [];
    S.equipped = Array.isArray(d.equipped) ? d.equipped : [];
    S.fx = d.fx || {};
    S.selOrb = null;
    S.ms  = d.ms || {};
  }catch(e){ /* corrupt save: start clean rather than break */ }
}

$('saveBtn').onclick = () => { save(); toast('Saved'); };
$('wipeBtn').onclick = () => {
  if (!confirm('Wipe everything, prisms included? There is no undo.')) return;
  try{ localStorage.removeItem(KEY); }catch(e){}
  S = FRESH(); balls.length = 0; buildBoard(); toast('Wiped');
};
setInterval(save, 15000);
addEventListener('beforeunload', () => { save(); if (cloudReady) cloudSave(); });
// tab hidden is the reliable moment on mobile, where beforeunload often never fires
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ save(); if (cloudReady && cloudDirty) cloudSave(); }
});

/* ================================================================
   CLOUD SAVE

   Ties into the same Firebase account the portal signs you into, so
   progress follows you between machines. The browser copy stays the
   working save; the cloud is a mirror that syncs every 45 seconds
   and whenever you leave.

   Conflicts resolve on lifetime chips. That figure survives every
   reset — recalibrating, collapsing and ascending all leave it alone —
   so it only ever climbs, and the bigger number is always the save
   that has been played further. Comparing clocks instead would
   corrupt progress the moment a device had the wrong time.
   ================================================================ */
let cloudReady = false, cloudUser = null, cloudTimer = null, cloudDirty = false;

function cloudChip(text, cls){
  const el = $('cloud');
  el.className = 'hint' + (cls ? ' ' + cls : '');
  el.textContent = text;
}

function initCloud(){
  if (typeof firebaseConfig === 'undefined' || firebaseConfig.apiKey === 'PASTE_YOURS'){
    cloudChip('local only');
    return;
  }
  try{ firebase.initializeApp(firebaseConfig); }
  catch(e){ /* another script on the page already did it */ }

  const auth = firebase.auth();
  const db = firebase.firestore();

  auth.onAuthStateChanged(async user => {
    cloudUser = user;
    if (!user){
      cloudReady = false;
      cloudChip('sign in to sync');
      $('cloud').title = 'Open the portal and sign in — progress will then follow your account.';
      return;
    }

    cloudChip('syncing…', 'saving');
    try{
      const doc = await db.collection('users').doc(user.uid).collection('games').doc('plinko').get();
      const remote = doc.exists ? doc.data().save : null;

      if (remote && typeof remote === 'string'){
        const d = JSON.parse(remote);
        // whichever save has earned more is the one further along
        if ((d.earned || 0) > (S.earned || 0)){
          S = Object.assign(FRESH(), d);
          S.lv   = Object.assign(FRESH().lv, d.lv || {});
          S.pv   = Object.assign(FRESH().pv, d.pv || {});
          S.sv   = Object.assign(FRESH().sv, d.sv || {});
          S.opt  = Object.assign({}, DEFAULT_OPT, d.opt || {});
          S.tree = d.tree || {}; invalidateGen(); invalidateGen();
          S.cons = d.cons || {};
          S.active = Array.isArray(d.active) ? d.active : [];
          S.bz   = d.bz || {};
          S.quests = Array.isArray(d.quests) ? d.quests : [];
          S.ball = d.ball || 'std';
          S.bench = Array.isArray(d.bench) ? d.bench : [];
          S.equipped = Array.isArray(d.equipped) ? d.equipped : [];
          S.fx = d.fx || {};
          S.selOrb = null;
          S.ms   = d.ms || {};
          balls.length = 0;
          applyTheme(S.opt.theme);
          $('dist').style.display = S.opt.showDist ? '' : 'none';
          buildBoard(); buildSettings(); buildVault();
          buildTree(); paintTree();
          paintHud();
          toast('Loaded the further-along save from your account');
        }
      }

      cloudReady = true;
      cloudChip('synced', 'synced');
      $('cloud').title = 'Saving to your Jarvis Portal account';
      cloudSave();
      if (cloudTimer) clearInterval(cloudTimer);
      cloudTimer = setInterval(() => { if (cloudDirty) cloudSave(); }, 45000);
    }catch(err){
      console.warn('Cloud save unavailable:', err);
      cloudReady = false;
      cloudChip('sync failed');
      $('cloud').title = String(err.message || err);
    }
  });
}

async function cloudSave(){
  if (!cloudReady || !cloudUser) return;
  cloudDirty = false;
  try{
    await firebase.firestore()
      .collection('users').doc(cloudUser.uid)
      .collection('games').doc('plinko')
      .set({ save: JSON.stringify(S), at: Date.now() });
    cloudChip('synced', 'synced');
  }catch(err){
    cloudDirty = true;
    cloudChip('sync failed');
    console.warn('Cloud save failed:', err);
  }
}

let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
}

/* ---------------- offline ----------------
   Credited at a poor rate on purpose. Away time should be worth
   something, never more than playing. */
function offline(){
  if (!S.opt.offline) return;
  const rate = eff('auto') * eff('multi');
  if (!S.lastSeen || rate <= 0) return;
  const away = Math.min((Date.now() - S.lastSeen)/1000, 8*3600);
  if (away < 60) return;
  const mid = slots.length ? slotMult(slots[Math.floor(slots.length/2)]) * 2.4 : 0;
  const got = away * rate * mid * 0.35 * peff('dawn') * cEff('hourglass');
  if (got > 0){
    S.cash += got; S.earned += got;
    toast('Away ' + Math.floor(away/60) + ' min · +' + fmt(got) + ' chips');
  }
}
