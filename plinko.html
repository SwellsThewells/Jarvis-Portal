<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E0D0C">
<title>Jarvis Plinko</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ================================================================
   JARVIS PLINKO — precision instrument

   Warm paper stock, ink-black type, hairline rules, one vermillion
   accent. Upgrades are ledger rows, not cards.
   ================================================================ */

@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

:root{
  --paper:  #F2EFE7;
  --card:   #FBF9F4;
  --ink:    #16130E;
  --muted:  #6C665B;
  --faint:  #A39C8E;
  --rule:   rgba(22,19,14,.13);
  --rule2:  rgba(22,19,14,.07);
  --hot:    #C6402A;
  --cool:   #2C5C86;

  --serif: "Instrument Serif", Georgia, serif;
  --sans:  "IBM Plex Sans", system-ui, sans-serif;
  --mono:  "IBM Plex Mono", ui-monospace, monospace;
}

*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:14px;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{ font:inherit; color:inherit; }
::-webkit-scrollbar{ width:9px; }
::-webkit-scrollbar-thumb{ background:var(--rule); }

.wrap{ display:grid; grid-template-columns:minmax(0,1fr) 348px; height:100vh; }
@media(max-width:940px){
  body{ overflow:auto; }
  .wrap{ grid-template-columns:1fr; height:auto; }
}

/* ---------------- the machine ---------------- */
.machine{ display:flex; flex-direction:column; min-width:0; border-right:1px solid var(--rule); }

.head{
  display:flex; align-items:flex-end; gap:16px;
  padding:20px 26px 15px; border-bottom:1px solid var(--rule); flex:none;
}
.back{
  font-family:var(--mono); font-size:15px; line-height:1;
  color:var(--faint); text-decoration:none; padding-bottom:5px;
}
.back:hover{ color:var(--hot); }
.wordmark{ font-family:var(--serif); font-size:31px; line-height:.9; letter-spacing:-.01em; }
.wordmark i{ font-style:italic; color:var(--hot); }
.sub{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--faint); padding-bottom:6px;
}

.readout{ margin-left:auto; text-align:right; }
.readout .n{
  font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:29px; font-weight:500; line-height:1; letter-spacing:-.02em;
}
.readout .l{
  font-family:var(--mono); font-size:9px; letter-spacing:.24em;
  text-transform:uppercase; color:var(--faint); margin-top:5px;
}

canvas{ display:block; width:100%; flex:1; min-height:0; }
@media(max-width:940px){ canvas{ height:58vh; flex:none; } }

.dist{ display:flex; align-items:flex-end; gap:1px; height:26px; padding:0 26px; flex:none; opacity:.6; }
.dist i{ flex:1; background:var(--ink); min-height:1px; transition:height .25s ease; }

.deck{
  display:flex; align-items:center; gap:18px;
  padding:13px 26px 16px; border-top:1px solid var(--rule); flex:none;
}
.drop{
  padding:11px 30px; background:var(--ink); color:var(--paper);
  border:0; border-radius:2px;
  font-family:var(--mono); font-size:11px; font-weight:500;
  letter-spacing:.18em; text-transform:uppercase; cursor:pointer;
}
.drop:hover{ background:var(--hot); }
.drop:active{ transform:translateY(1px); }

.gauges{ display:flex; gap:24px; }
.g .v{ font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:14px; font-weight:500; }
.g .k{
  font-family:var(--mono); font-size:8.5px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--faint); margin-top:3px;
}
.hint{
  margin-left:auto; font-family:var(--mono);
  font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); cursor:default;
}
.hint.synced{ color:var(--cool); }
.hint.saving{ color:var(--hot); }

/* ---------------- ledger ---------------- */
.ledger{
  display:flex; flex-direction:column; min-height:0; height:100vh;
  background:var(--card); overflow:hidden;
}
@media(max-width:940px){ .ledger{ height:auto; } }
.tabs{
  display:flex; flex:none; border-bottom:1px solid var(--rule);
  overflow-x:auto; scrollbar-width:none;
}
.tabs::-webkit-scrollbar{ height:0; }
.tabs button{
  flex:0 0 auto; padding:14px 13px; background:none; border:0;
  border-bottom:1px solid transparent; margin-bottom:-1px;
  font-family:var(--mono); font-size:9px; font-weight:500;
  letter-spacing:.12em; text-transform:uppercase; color:var(--faint);
  cursor:pointer; white-space:nowrap;
}
.tabs button.on{ color:var(--ink); border-bottom-color:var(--hot); }
.scroll{ overflow-y:auto; flex:1 1 auto; min-height:140px; }

.bulk{ display:flex; padding:10px 20px; border-bottom:1px solid var(--rule2); }
.bulk button{
  flex:1; padding:7px 0; background:none;
  border:1px solid var(--rule2); border-right:0;
  font-family:var(--mono); font-size:9.5px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--muted); cursor:pointer;
}
.bulk button:last-child{ border-right:1px solid var(--rule2); }
.bulk button.on{ background:var(--ink); border-color:var(--ink); color:var(--card); }

.up{
  display:block; width:100%; text-align:left;
  padding:14px 20px; background:none; border:0;
  border-bottom:1px solid var(--rule2); cursor:pointer;
}
.up:hover:not(:disabled){ background:rgba(198,64,42,.05); }
.up:disabled{ cursor:default; }
.up:disabled .nm, .up:disabled .cost{ color:var(--faint); }
.up .r{ display:flex; align-items:baseline; gap:10px; }
.up .nm{ font-size:14px; font-weight:600; letter-spacing:-.005em; }
.up .eff{
  margin-left:auto; font-family:var(--mono);
  font-variant-numeric:tabular-nums; font-size:11px; color:var(--cool);
}
.up .ds{ font-size:11.5px; color:var(--muted); line-height:1.5; margin:5px 0 8px; }
.up .foot{ display:flex; align-items:baseline; }
.up .cost{ font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:11.5px; font-weight:500; }
.up.afford .cost{ color:var(--hot); }
.up .lv{
  margin-left:auto; font-family:var(--mono); font-size:9.5px;
  letter-spacing:.14em; text-transform:uppercase; color:var(--faint);
}
.up.pr .cost{ color:var(--cool); }
.up.pr:hover:not(:disabled){ background:rgba(44,92,134,.06); }
.up.sp .cost{ color:var(--hot); }
.up.sp:hover:not(:disabled){ background:rgba(198,64,42,.05); }
.up.fx .cost{ color:#B8860B; }
.up.fx:hover:not(:disabled){ background:rgba(184,134,11,.08); }
.up.bz .cost{ color:#2F7F6B; }
.up.bz:hover:not(:disabled){ background:rgba(47,127,107,.07); }

.prismhead, .qhead{
  display:flex; align-items:baseline; gap:10px;
  padding:18px; border-bottom:1px solid var(--rule);
}
.prismhead .n, .qhead .n{ font-family:var(--mono); font-size:22px; font-weight:500; color:var(--cool); }
.qhead .n{ color:var(--hot); }
.prismhead .k, .qhead .k{
  font-family:var(--mono); font-size:9px; letter-spacing:.22em;
  text-transform:uppercase; color:var(--faint);
}

.sect{ padding:16px 20px 6px; }
.sect h4{
  margin:0 0 2px; font-family:var(--mono); font-size:9px; font-weight:500;
  letter-spacing:.24em; text-transform:uppercase; color:var(--faint);
}

/* tree */
.trow{ position:relative; padding:0 14px; }
.trow .tier{
  font-family:var(--mono); font-size:8.5px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--faint); padding:14px 6px 7px;
}
.tnodes{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.tnode{
  position:relative; text-align:left; padding:10px 9px;
  border:1px solid var(--rule); border-radius:6px;
  background:var(--card); cursor:pointer; color:inherit;
  transition:border-color .16s, transform .14s, background .16s;
}
.tnode:hover:not(:disabled){ transform:translateY(-2px); border-color:var(--ink); }
.tnode:disabled{ cursor:default; }
.tnode.locked{ opacity:.38; }
.tnode.owned{ border-color:var(--hot); background:rgba(198,64,42,.06); }
.tnode .nm{ font-size:11.5px; font-weight:600; line-height:1.25; }
.tnode .lv{ font-family:var(--mono); font-size:9px; color:var(--faint); margin-top:3px; }
.tnode .ef{ font-family:var(--mono); font-size:9.5px; color:var(--cool); margin-top:5px; }
.tnode .cs{ font-family:var(--mono); font-size:10px; margin-top:5px; color:var(--hot); }
.tnode.locked .cs, .tnode:disabled .cs{ color:var(--faint); }
.tnode.child::before{
  content:''; position:absolute; left:50%; top:-15px;
  width:1px; height:15px; background:var(--rule);
}
.tnode.owned.child::before{ background:var(--hot); }
.tdesc{ font-size:10.5px; color:var(--muted); line-height:1.5; margin-top:6px; }

/* record */
.stats{ padding:18px 20px; }
.row{ display:flex; align-items:baseline; gap:6px; padding:7px 0; font-size:12.5px; }
.row .k{ color:var(--muted); white-space:nowrap; }
.row .dots{ flex:1; border-bottom:1px dotted var(--rule); transform:translateY(-3px); }
.row .v{ font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:12px; }

.ms{
  display:flex; align-items:center; gap:10px;
  padding:10px 20px; border-bottom:1px solid var(--rule2); font-size:12.5px;
}
.ms .dot{ width:7px; height:7px; border-radius:50%; flex:none; border:1px solid var(--faint); }
.ms.done .dot{ background:var(--hot); border-color:var(--hot); }
.ms.done .lbl{ color:var(--muted); text-decoration:line-through; }
.ms .req{
  margin-left:auto; font-family:var(--mono);
  font-variant-numeric:tabular-nums; font-size:10.5px; color:var(--faint);
}

/* settings */
.opt{ display:flex; align-items:center; gap:12px; padding:12px 20px; border-bottom:1px solid var(--rule2); }
.opt .t{ min-width:0; flex:1; }
.opt .t b{ display:block; font-size:13px; font-weight:600; }
.opt .t span{ display:block; font-size:11px; color:var(--muted); line-height:1.45; margin-top:2px; }
.sw{
  flex:none; min-width:62px; padding:6px 0;
  background:none; border:1px solid var(--rule); border-radius:2px;
  font-family:var(--mono); font-size:9px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--muted); cursor:pointer;
}
.sw:hover{ border-color:var(--faint); color:var(--ink); }
.numin{
  flex:none; width:92px; padding:7px 9px;
  background:var(--paper); border:1px solid var(--rule); border-radius:2px;
  color:var(--ink); font-family:var(--mono); font-size:12px; text-align:right;
}
.numin:focus{ outline:none; border-color:var(--hot); }
.sw.on{ background:var(--ink); border-color:var(--ink); color:var(--paper); }

.swatches{ display:flex; gap:8px; padding:4px 20px 16px; flex-wrap:wrap; }
.sws{ width:60px; padding:0; cursor:pointer; background:none; border:1px solid var(--rule); border-radius:2px; overflow:hidden; }
.sws.on{ border-color:var(--hot); }
.sws .bar{ display:flex; height:24px; }
.sws .bar i{ flex:1; }
.sws .nm{
  display:block; padding:4px 0 5px;
  font-family:var(--mono); font-size:8px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--muted);
}
.sws.on .nm{ color:var(--ink); }

/* prestige rail */
.prestige{
  padding:16px 20px; border-top:1px solid var(--rule); flex:none;
  max-height:46vh; overflow-y:auto;
}
.meter{ height:2px; background:var(--rule); margin-bottom:13px; }
.meter i{ display:block; height:100%; background:var(--cool); width:0; transition:width .4s ease; }
.pbtn{
  width:100%; padding:12px;
  background:none; border:1px solid var(--cool); border-radius:2px;
  color:var(--cool); font-family:var(--mono); font-size:10px; font-weight:500;
  letter-spacing:.18em; text-transform:uppercase; cursor:pointer;
}
.pbtn:hover:not(:disabled){ background:var(--cool); color:var(--card); }
.pbtn:disabled{ border-color:var(--rule); color:var(--faint); cursor:default; }
.cBtn{ border-color:var(--hot); color:var(--hot); }
.cBtn:hover:not(:disabled){ background:var(--hot); color:var(--paper); }
.aBtn{ border-color:#7A5EA8; color:#7A5EA8; }
.aBtn:hover:not(:disabled){ background:#7A5EA8; color:var(--card); }
.rBtn{ border-color:#9C6B2F; color:#9C6B2F; }
.rBtn:hover:not(:disabled){ background:#9C6B2F; color:var(--card); }
.tBtn{ border-color:#2F7F6B; color:#2F7F6B; }
.tBtn:hover:not(:disabled){ background:#2F7F6B; color:var(--card); }
.pnote{ margin:10px 0 0; font-size:11px; color:var(--muted); line-height:1.6; }

.foot2{ display:flex; border-top:1px solid var(--rule); flex:none; }
.foot2 button{
  flex:1; padding:11px; background:none; border:0;
  border-right:1px solid var(--rule);
  font-family:var(--mono); font-size:9px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--faint); cursor:pointer;
}
.foot2 button:last-child{ border-right:0; }
.foot2 button:hover{ color:var(--hot); }

.toast{
  position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
  background:var(--ink); color:var(--paper);
  padding:10px 20px; border-radius:2px;
  font-family:var(--mono); font-size:11px; letter-spacing:.06em;
  opacity:0; pointer-events:none; transition:opacity .3s ease;
}
.toast.show{ opacity:1; }

/* ---------------- cosmos: constellations, bazaar, quests ---------------- */
.chead{
  display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  padding:18px; border-bottom:1px solid var(--rule);
}
.chead div{ display:flex; align-items:baseline; gap:7px; }
.chead .n{ font-family:var(--mono); font-size:20px; font-weight:500; }
.chead .n.ae{ color:#7A5EA8; }
.chead .n.sh{ color:#2F7F6B; }
.chead .k{
  font-family:var(--mono); font-size:8.5px; letter-spacing:.22em;
  text-transform:uppercase; color:var(--faint);
}

.cons{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; padding:0 14px 14px; }
.con{
  position:relative; text-align:left; padding:11px 10px;
  border:1px solid var(--rule); border-radius:6px;
  background:var(--card); cursor:pointer; color:inherit;
  transition:border-color .16s, background .16s;
}
.con:hover:not(:disabled){ border-color:var(--ink); }
.con:disabled{ cursor:default; opacity:.5; }
.con.active{ border-color:#7A5EA8; background:rgba(122,94,168,.08); }
.con .nm{ font-size:12px; font-weight:600; }
.con .ds{ font-size:10.5px; color:var(--muted); line-height:1.4; margin-top:4px; }
.con .ef{ font-family:var(--mono); font-size:9.5px; color:var(--cool); margin-top:5px; }
.con .cs{ font-family:var(--mono); font-size:10px; color:#7A5EA8; margin-top:4px; }
.con .tag{
  position:absolute; top:8px; right:9px;
  font-family:var(--mono); font-size:7.5px; letter-spacing:.14em;
  text-transform:uppercase; color:#7A5EA8;
}

.quest{
  padding:14px 20px; border-bottom:1px solid var(--rule2);
}
.quest .qt{ display:flex; align-items:baseline; gap:8px; }
.quest .qn{ font-size:13px; font-weight:600; }
.quest .qr{
  margin-left:auto; font-family:var(--mono); font-size:10px; color:#2F7F6B;
}
.quest .qd{ font-size:11px; color:var(--muted); margin:4px 0 8px; }
.qbar{ height:3px; background:var(--rule); }
.qbar i{ display:block; height:100%; background:#2F7F6B; width:0; transition:width .3s ease; }
.quest.done{ opacity:.55; }

.balls{ display:flex; gap:7px; padding:0 20px 16px; flex-wrap:wrap; }
.ballb{
  padding:8px 12px; border:1px solid var(--rule); border-radius:2px;
  background:none; cursor:pointer;
  font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--muted);
}
.ballb.on{ background:var(--ink); border-color:var(--ink); color:var(--paper); }
.ballb:disabled{ opacity:.35; cursor:default; }

body.dark .drop{ background:var(--hot); color:#120C0A; }
body.dark .drop:hover{ background:var(--ink); color:var(--paper); }
body.dark .sw.on{ background:var(--hot); border-color:var(--hot); color:#120C0A; }
body.dark .bulk button.on{ background:var(--hot); border-color:var(--hot); color:#120C0A; }
body.dark .toast{ background:var(--hot); color:#120C0A; }
body.dark ::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.16); }
body.dark .tnode{ background:rgba(255,255,255,.03); }
body.dark .tnode.owned{ background:rgba(232,103,78,.12); }
body.dark .con{ background:rgba(255,255,255,.03); }

/* ---------------- the forge ---------------- */
.fbench{ display:grid; grid-template-columns:repeat(auto-fill,minmax(74px,1fr)); gap:8px; padding:0 18px 16px; }
.orb{
  position:relative; aspect-ratio:1; border:1px solid var(--rule); border-radius:8px;
  background:var(--card); cursor:pointer; color:inherit; padding:6px 4px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  transition:border-color .14s, transform .14s;
}
.orb:hover{ transform:translateY(-2px); border-color:var(--ink); }
.orb.sel{ border-color:var(--hot); box-shadow:0 0 0 1px var(--hot); }
.orb .ball{
  width:26px; height:26px; border-radius:50%;
  box-shadow:inset -3px -3px 6px rgba(0,0,0,.35), inset 2px 2px 4px rgba(255,255,255,.35);
}
.orb .tt{ font-family:var(--mono); font-size:9px; color:var(--faint); }
.orb .nm2{ font-size:9px; line-height:1.1; text-align:center; color:var(--muted); }
.orb .bs{ font-family:var(--mono); font-size:8.5px; color:var(--cool); }
.fslots{ display:grid; grid-template-columns:repeat(auto-fill,minmax(74px,1fr)); gap:8px; padding:0 18px 16px; }
.fslot{
  aspect-ratio:1; border:1px dashed var(--rule); border-radius:8px;
  display:grid; place-items:center; font-family:var(--mono); font-size:9px; color:var(--faint);
}
.frow{ display:flex; gap:8px; padding:0 18px 14px; }
.frow button{
  flex:1; padding:9px; background:none; border:1px solid var(--rule); border-radius:2px;
  font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--muted); cursor:pointer;
}
.frow button:hover:not(:disabled){ border-color:var(--hot); color:var(--hot); }
.frow button:disabled{ opacity:.4; cursor:default; }

/* ================================================================
   BACKDROPS

   One per theme, sitting behind everything at very low opacity.
   All of them are slow — 40 seconds and up — so they read as the
   room breathing rather than as motion competing with the board.
   ================================================================ */
.bg{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  opacity:.5;
}
.wrap{ position:relative; z-index:1; }

/* Paper — grain drifting like dust in light */
body.theme-paper .bg{
  background-image:radial-gradient(circle, rgba(22,19,14,.22) .6px, transparent .7px);
  background-size:22px 22px;
  animation:drift 90s linear infinite;
  opacity:.35;
}
@keyframes drift{ to{ background-position:220px 220px; } }

/* Ink — slow embers rising */
body.theme-ink .bg{
  background-image:
    radial-gradient(circle at 20% 80%, rgba(232,103,78,.10), transparent 42%),
    radial-gradient(circle at 78% 30%, rgba(232,103,78,.07), transparent 38%);
  animation:breathe 46s ease-in-out infinite;
}
@keyframes breathe{ 50%{ transform:translateY(-3%) scale(1.06); opacity:.75; } }

/* Midnight — a very slow aurora */
body.theme-midnight .bg{
  background-image:
    radial-gradient(ellipse 70% 45% at 30% 12%, rgba(127,196,216,.14), transparent 60%),
    radial-gradient(ellipse 60% 40% at 72% 8%, rgba(242,146,91,.09), transparent 60%);
  animation:aurora 62s ease-in-out infinite;
}
@keyframes aurora{
  33%{ transform:translateX(4%) skewX(-2deg); }
  66%{ transform:translateX(-4%) skewX(2deg); }
}

/* Blueprint — the drawing grid easing across the page */
body.theme-blueprint .bg{
  background-image:
    linear-gradient(rgba(220,233,242,.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(220,233,242,.07) 1px, transparent 1px);
  background-size:46px 46px;
  animation:sheet 70s linear infinite;
}
@keyframes sheet{ to{ background-position:46px 46px; } }

/* Sepia — a soft vignette that swells and settles */
body.theme-sepia .bg{
  background-image:radial-gradient(ellipse 80% 70% at 50% 40%, transparent 40%, rgba(46,36,23,.16) 100%);
  animation:vignette 54s ease-in-out infinite;
}
@keyframes vignette{ 50%{ opacity:.72; transform:scale(1.04); } }

@media(prefers-reduced-motion: reduce){
  .bg{ animation:none !important; }
}

<script>
/* ================================================================
   JARVIS PLINKO

   The balls genuinely bounce. Every peg contact is a circle collision
   with reflection, restitution and a little jitter — which slot a ball
   ends in is emergent, not rolled. The bell curve under the board is
   the real landing distribution, filling in as you play.
   ================================================================ */

const C = document.getElementById('board');
const ctx = C.getContext('2d');
const $ = id => document.getElementById(id);

/* small element builder — the cosmos and forge panels rely on it */
function el(tag, cls, html){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
}

/* ---------------- numbers ----------------
   Idle games outrun every built-in formatter: suffixes while they
   last, then scientific. Doubles give out around 1e308. */
const SUF = ['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','Ud','Dd','Td','Qad','Qid'];

function fmt(n){
  if (!isFinite(n)) return '∞';
  if (n < 0) return '-' + fmt(-n);
  if (n < 1000) return n < 10 ? (Math.round(n*10)/10).toString() : Math.floor(n).toString();
  if (S && S.opt && S.opt.sci) return n.toExponential(2).replace('e+','e');
  const tier = Math.floor(Math.log10(n) / 3);
  if (tier < SUF.length){
    const s = n / Math.pow(1000, tier);
    return (s < 10 ? s.toFixed(2) : s < 100 ? s.toFixed(1) : Math.floor(s)) + SUF[tier];
  }
  return n.toExponential(2).replace('e+','e');
}

/* ---------------- themes ----------------
   Each one carries both the CSS variables and the canvas colours, so
   the board repaints in the same palette as the panel around it. */
const THEMES = {
  paper: { name:'Paper', vars:{
      paper:'#F2EFE7', card:'#FBF9F4', ink:'#16130E', muted:'#6C665B', faint:'#A39C8E',
      rule:'rgba(22,19,14,.13)', rule2:'rgba(22,19,14,.07)', hot:'#C6402A', cool:'#2C5C86' },
    peg:'rgba(22,19,14,.20)', ball:'#C6402A', slotInk:'#16130E', slotHot:'#C6402A',
    label:'rgba(22,19,14,.5)' },

  ink: { name:'Ink', dark:true, vars:{
      paper:'#0E0D0C', card:'#161514', ink:'#F0ECE4', muted:'#A29B90', faint:'#6B655C',
      rule:'rgba(240,236,228,.16)', rule2:'rgba(240,236,228,.075)', hot:'#E8674E', cool:'#84B9E0' },
    peg:'rgba(240,236,228,.24)', ball:'#E8674E', slotInk:'#F0ECE4', slotHot:'#E8674E',
    label:'rgba(240,236,228,.58)' },

  midnight: { name:'Midnight', dark:true, vars:{
      paper:'#080A0F', card:'#101319', ink:'#E8ECF3', muted:'#98A2B3', faint:'#5E6879',
      rule:'rgba(232,236,243,.15)', rule2:'rgba(232,236,243,.07)', hot:'#F2925B', cool:'#7FC4D8' },
    peg:'rgba(232,236,243,.22)', ball:'#F2925B', slotInk:'#E8ECF3', slotHot:'#F2925B',
    label:'rgba(232,236,243,.55)' },

  blueprint: { name:'Blueprint', vars:{
      paper:'#0D1B26', card:'#122430', ink:'#DCE9F2', muted:'#8AA6BA', faint:'#54728A',
      rule:'rgba(220,233,242,.16)', rule2:'rgba(220,233,242,.08)', hot:'#FFB845', cool:'#5FD0E0' },
    peg:'rgba(220,233,242,.24)', ball:'#FFB845', slotInk:'#DCE9F2', slotHot:'#FFB845',
    label:'rgba(220,233,242,.55)' },

  sepia: { name:'Sepia', vars:{
      paper:'#EDE2CE', card:'#F6EEDF', ink:'#2E2417', muted:'#6F6046', faint:'#A8977A',
      rule:'rgba(46,36,23,.16)', rule2:'rgba(46,36,23,.08)', hot:'#8C5A2B', cool:'#3D6B63' },
    peg:'rgba(46,36,23,.22)', ball:'#8C5A2B', slotInk:'#2E2417', slotHot:'#8C5A2B',
    label:'rgba(46,36,23,.55)' }
};

let TH = THEMES.paper;

function applyTheme(key){
  TH = THEMES[key] || THEMES.paper;
  const root = document.documentElement.style;
  for (const k in TH.vars) root.setProperty('--' + k, TH.vars[k]);
  /* form controls, scrollbars and the browser's own chrome follow this */
  document.documentElement.style.colorScheme = TH.dark ? 'dark' : 'light';
  document.body.classList.toggle('dark', !!TH.dark);
  /* one class per theme so each gets its own backdrop */
  Object.keys(THEMES).forEach(k => document.body.classList.toggle('theme-' + k, k === key));
  document.querySelectorAll('.sws').forEach(b => b.classList.toggle('on', b.dataset.theme === key));
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', TH.vars.paper);
}

const isDark = () => !!(THEMES[S.opt.theme] || {}).dark;

/* the toggle remembers which light and dark theme you last used
   rather than always snapping back to the defaults */
function toggleDark(){
  if (isDark()){
    S.opt.lastDark = S.opt.theme;
    setOpt('theme', S.opt.lastLight || 'paper');
  } else {
    S.opt.lastLight = S.opt.theme;
    setOpt('theme', S.opt.lastDark || 'ink');
  }
}

/* ---------------- state ---------------- */
const DEFAULT_OPT = {
  /* dark by default; the light themes are still a click away */
  theme: 'ink',
  lastLight: 'paper',
  lastDark: 'ink',
  showDist: true,      // landing histogram under the board
  showLabels: true,    // × multiplier printed in each slot
  confirmReset: true,  // ask before prestiging
  offline: true,       // credit time away
  sci: false,          // scientific notation instead of suffixes
  maxBalls: 420,       // hard cap on balls in flight
  hideBalls: false     // resolve drops instantly instead of drawing them
};

const FRESH = () => ({
  cash:0, earned:0, best:0, drops:0,
  prisms:0, prismsEarned:0,
  started: Date.now(), lastSeen: Date.now(),
  opt: Object.assign({}, DEFAULT_OPT),
  lv:{ value:0, auto:0, multi:0, slots:0, luck:0, rows:0, bounce:0 },
  pv:{ gain:0, gold:0, boost:0, head:0 },   // prism shop — lost on collapse
  sv:{ res:0, yield:0, found:0, spark:0 },  // spectra shop — permanent
  spectra:0, spectraEarned:0,
  quanta:0, quantaEarned:0,
  tree:{},                                   // quanta tree — lost on transcension
  aether:0, aetherEarned:0,
  cons:{}, active:[],                        // constellations owned / equipped
  shards:0, bz:{},                           // quest currency and the bazaar
  quests:[], questAt:0,
  ball:'std',
  alloy:0, alloyEarned:0,
  bench:[], equipped:[], mergeCount:0, bestOrb:0,
  selOrb:null,
  flux:0, surgeUntil:0, fx:{}, fluxSpent:0,
  ms:{}                                      // milestones already claimed
});
let S = FRESH();

/* ---------------- upgrades ----------------
   Costs deliberately outgrow their effects, so each level buys
   proportionally less. Without that the whole thing runs away to
   Infinity inside an afternoon. */
const MAX_ROW_LV = 8;      // 8 base rows + 8. Deeper than 16 is both
                           // undrawable and mathematically fatal, since
                           // payout scales exponentially with rows.

const UPGRADES = [
  { id:'value', name:'Chip Weight',
    desc:'Every ball is worth more before its slot multiplier applies.',
    cost: l => 10 * Math.pow(1.16, l),
    eff:  l => 1 + l * 0.5,
    show: v => '×' + fmt(v) },
  { id:'auto', name:'Auto Dropper',
    desc:'Drops balls for you, without the clicking.',
    cost: l => 60 * Math.pow(1.30, l),
    eff:  l => l === 0 ? 0 : 0.5 * Math.pow(1.12, l - 1),
    show: v => fmt(v) + '/s' },
  { id:'multi', name:'Extra Balls',
    desc:'Each drop releases more than one ball.',
    cost: l => 500 * Math.pow(2.2, l),
    eff:  l => 1 + l,
    show: v => v + ' per drop' },
  { id:'slots', name:'Slot Payouts',
    desc:'Raises every slot multiplier across the board.',
    cost: l => 300 * Math.pow(1.34, l),
    eff:  l => 1 + l * 0.22,
    show: v => '×' + (Math.round(v*100)/100) },
  { id:'luck', name:'Edge Bias',
    desc:'Nudges balls outward, where the big multipliers live.',
    cost: l => 900 * Math.pow(1.45, l),
    eff:  l => Math.min(0.5, l * 0.05),
    show: v => '+' + Math.round(v*100) + '% drift',
    max: 10 },
  { id:'rows', name:'Deeper Board',
    desc:'Another row of pegs. More rows, richer extremes.',
    cost: l => 4000 * Math.pow(3.6, l),
    eff:  l => 8 + Math.min(l, MAX_ROW_LV + nEff('deep')),
    show: v => v + ' rows',
    max: () => MAX_ROW_LV + nEff('deep') },
  { id:'bounce', name:'Livelier Pegs',
    desc:'Bouncier collisions. Balls scatter further from centre.',
    cost: l => 1500 * Math.pow(1.6, l),
    eff:  l => Math.min(0.86, 0.45 + l * 0.03),
    show: v => Math.round(v*100) + '% bounce',
    max: 14 },
  { id:'floor', name:'Backstop',
    desc:'Lifts what the crowded middle slots pay — where most balls actually land.',
    cost: l => 3000 * Math.pow(1.6, l),
    eff:  l => l * 0.18,
    show: v => '+' + v.toFixed(2) + ' base' },
  { id:'jackpot', name:'Jackpot Pins',
    desc:'A chance for any landing to pay five times over.',
    cost: l => 6000 * Math.pow(1.7, l),
    eff:  l => Math.min(0.4, l * 0.02),
    show: v => Math.round(v*100) + '% for 5×',
    max: 20 },
  { id:'echo', name:'Ricochet',
    desc:'A chance a landed ball kicks a free one back up the board.',
    cost: l => 12000 * Math.pow(1.8, l),
    eff:  l => Math.min(0.5, l * 0.025),
    show: v => Math.round(v*100) + '% free ball',
    max: 20 },
  { id:'funnel', name:'Funnel',
    desc:'Narrows the drop, so balls start with a harder push outward.',
    cost: l => 20000 * Math.pow(1.9, l),
    eff:  l => l * 0.6,
    show: v => '+' + v.toFixed(1) + ' spread',
    max: 15 }
];

const U = {};
UPGRADES.forEach(u => U[u.id] = u);
const lvl  = id => S.lv[id] || 0;
const eff  = id => U[id].eff(lvl(id));
const cost = id => U[id].cost(lvl(id));
const capOf = u => !u ? undefined : (typeof u.max === 'function' ? u.max() : u.max);
const maxed = id => { const c = capOf(U[id]); return c !== undefined && lvl(id) >= c; };

const prismMult = () =>
  (1 + S.prisms * 0.5) * peff('boost') * msMult() *
  seff('res') * nEff('density') * nEff('singularity') *
  cEff('forge') * bz('purse') * nEff('well') * genTotal('mult') * orbEff('mult') *
  (surgeActive() ? SURGE_MULT() : 1) * fEff('coil');

/* Exponent below 1 on purpose. At 1 or above each prestige feeds the
   next and it runs away. At 0.4 numbers climb forever, watchably. */
const PRISM_EXP = 0.4;
const prismsAvailable = () => Math.floor(Math.pow(Math.max(0, S.earned) / 1e6, PRISM_EXP));
const gainMult = () => nEff('prism2') * genTotal('gain') * cEff('crown') * (1 + orbEff('gain'));
const prismsOnReset = () => Math.max(0, Math.floor((prismsAvailable() - S.prismsEarned) * peff('gain') * nEff('facet') * gainMult()));
const nextPrismAt = () => 1e6 * Math.pow(S.prismsEarned + 1, 1 / PRISM_EXP);

/* ---------------- the prism shop ----------------
   Bought with prisms, kept through every recalibration. This is the
   layer that makes the second hour different from the first rather
   than just larger. */
const PRISM_UP = [
  { id:'boost', name:'Refraction',
    desc:'Multiplies every payout. Straightforward, and never stops.',
    cost: l => Math.ceil(2 * Math.pow(3, l)),
    eff:  l => Math.pow(1.4, l),
    show: v => '×' + fmt(v) },
  { id:'gold', name:'Gilding',
    desc:'Chance for a ball to come out golden and pay twenty-five times.',
    cost: l => Math.ceil(4 * Math.pow(2.6, l)),
    eff:  l => Math.min(0.25, l * 0.015),
    show: v => (v*100).toFixed(1) + '% golden',
    max: 17 },
  { id:'gain', name:'Clarity',
    desc:'More prisms from each recalibration.',
    cost: l => Math.ceil(6 * Math.pow(3.4, l)),
    eff:  l => 1 + l * 0.15,
    show: v => '×' + (Math.round(v*100)/100) + ' prisms' },
  { id:'head', name:'Momentum',
    desc:'Start every run with free levels of Chip Weight and Auto Dropper.',
    cost: l => Math.ceil(5 * Math.pow(2.8, l)),
    eff:  l => l * 3,
    show: v => v + ' free levels' },
  { id:'shine', name:'Lustre',
    desc:'Golden balls pay more than the usual twenty-five times.',
    cost: l => Math.ceil(8 * Math.pow(2.9, l)),
    eff:  l => 25 + l * 12,
    show: v => v + '× golden' },
  { id:'tide', name:'Undertow',
    desc:'Surges run longer for the same flux.',
    cost: l => Math.ceil(6 * Math.pow(2.7, l)),
    eff:  l => 1 + l * 0.4,
    show: v => '×' + v.toFixed(1) + ' surge time',
    max: 12 },
  { id:'dawn', name:'Nightshift',
    desc:'Time away is credited at a better rate.',
    cost: l => Math.ceil(7 * Math.pow(2.6, l)),
    eff:  l => 1 + l * 0.5,
    show: v => '×' + v.toFixed(1) + ' offline',
    max: 14 },
  { id:'seed', name:'Float',
    desc:'Begin each recalibration with chips already banked.',
    cost: l => Math.ceil(10 * Math.pow(3, l)),
    eff:  l => l,
    show: v => v > 0 ? 'seeded start' : 'none' }
];
const PU = {};
PRISM_UP.forEach(u => PU[u.id] = u);
const plvl = id => (S.pv && S.pv[id]) || 0;
const peff = id => PU[id].eff(plvl(id));
const pcost = id => PU[id].cost(plvl(id));
const pmaxed = id => !!PU[id] && PU[id].max !== undefined && plvl(id) >= PU[id].max;

/* ================================================================
   LAYER TWO — COLLAPSE

   Prisms reset chips. Collapsing resets the prisms themselves, and
   pays out in SPECTRA. Same shape one level up: the prism shop goes,
   the spectra shop stays, and every run afterwards starts richer.
   ================================================================ */
const COLLAPSE_AT = 500;          // prisms earned before it unlocks
const SPECTRA_EXP = 0.5;

const spectraAvailable = () =>
  Math.floor(Math.pow(Math.max(0, S.prismsEarned) / COLLAPSE_AT, SPECTRA_EXP) * sYield() * nEff('lens') * gainMult());
const spectraOnCollapse = () => Math.max(0, spectraAvailable() - S.spectraEarned);
const collapseUnlocked = () => S.prismsEarned >= COLLAPSE_AT || S.spectraEarned > 0;

const SPECTRA_UP = [
  { id:'res', name:'Resonance',
    desc:'A flat multiplier on everything you earn. Endless.',
    cost: l => Math.ceil(1 * Math.pow(2.8, l)),
    eff:  l => Math.pow(1.8, l),
    show: v => '×' + fmt(v) },
  { id:'yield', name:'Refinement',
    desc:'More spectra from each collapse.',
    cost: l => Math.ceil(3 * Math.pow(4, l)),
    eff:  l => 1 + l * 0.35,
    show: v => '×' + (Math.round(v*100)/100) + ' spectra' },
  { id:'found', name:'Foundation',
    desc:'Begin every collapse with free levels in each prism upgrade.',
    cost: l => Math.ceil(4 * Math.pow(3.2, l)),
    eff:  l => l,
    show: v => v + ' free levels' },
  { id:'spark', name:'Conduction',
    desc:'Golden balls yield more flux, and rim landings start yielding it too.',
    cost: l => Math.ceil(2 * Math.pow(2.4, l)),
    eff:  l => l,
    show: v => v > 0 ? '+' + v + ' flux' : 'none' }
];
const SU = {};
SPECTRA_UP.forEach(u => SU[u.id] = u);
const slvl = id => (S.sv && S.sv[id]) || 0;
const seff = id => SU[id].eff(slvl(id));
const scost = id => SU[id].cost(slvl(id));
const sYield = () => SU.yield.eff(slvl('yield'));

/* ================================================================
   LAYER THREE — ASCEND

   Chips reset for prisms. Prisms reset for spectra. Spectra reset for
   QUANTA, which buy nodes on a tree that nothing ever takes away.

   Where the earlier shops are flat lists you grind, the tree is a set
   of choices: nodes unlock other nodes, so an early Quanta goes down
   one branch rather than all of them.
   ================================================================ */
const ASCEND_AT = 40;             // lifetime spectra before it unlocks
const QUANTA_EXP = 0.55;

const quantaAvailable = () =>
  Math.floor(Math.pow(Math.max(0, S.spectraEarned) / ASCEND_AT, QUANTA_EXP) * (1 + node('flux2')*0.25) * gainMult());
const quantaOnAscend = () => Math.max(0, quantaAvailable() - S.quantaEarned);
const ascendUnlocked = () => S.spectraEarned >= ASCEND_AT || S.quantaEarned > 0;

/* Each node: cost in quanta, max levels, what it needs first, and the
   row it sits on so the tree can be drawn without hand-placing anything. */
const TREE = [
  { id:'density', row:0, name:'Density',   max:99, cost: l => Math.ceil(1*Math.pow(2.3,l)),
    desc:'A flat multiplier on everything. Never stops.',
    eff: l => Math.pow(1.5,l), show: v => '×'+fmt(v) },
  { id:'cadence', row:0, name:'Cadence',   max:20, cost: l => Math.ceil(1*Math.pow(2.1,l)),
    desc:'The auto dropper releases faster.',
    eff: l => 1 + l*0.25, show: v => '×'+v.toFixed(2)+' rate' },
  { id:'facet',   row:0, name:'Facet',     max:20, cost: l => Math.ceil(2*Math.pow(2.4,l)),
    desc:'More prisms from every recalibration.',
    eff: l => 1 + l*0.2, show: v => '×'+v.toFixed(2)+' prisms' },

  { id:'array',   row:1, needs:'density', max:20, name:'Refraction Array',
    cost: l => Math.ceil(4*Math.pow(2.6,l)),
    desc:'Every slot on the board pays more.',
    eff: l => 1 + l*0.35, show: v => '×'+v.toFixed(2)+' slots' },
  { id:'cascade', row:1, needs:'cadence', max:12, name:'Cascade',
    cost: l => Math.ceil(5*Math.pow(3,l)),
    desc:'An extra ball on every drop.',
    eff: l => l, show: v => '+'+v+' balls' },
  { id:'lens',    row:1, needs:'facet',   max:20, name:'Clarity Lens',
    cost: l => Math.ceil(6*Math.pow(2.8,l)),
    desc:'More spectra from every collapse.',
    eff: l => 1 + l*0.3, show: v => '×'+v.toFixed(2)+' spectra' },

  { id:'rain',    row:2, needs:'cascade', max:15, name:'Golden Rain',
    cost: l => Math.ceil(12*Math.pow(2.7,l)),
    desc:'Raises the golden ball chance beyond the prism cap.',
    eff: l => l*0.02, show: v => '+'+(v*100).toFixed(0)+'% golden' },
  { id:'core',    row:2, needs:'lens',    max:10, name:'Momentum Core',
    cost: l => Math.ceil(15*Math.pow(3.2,l)),
    desc:'Start every collapse with free prism shop levels.',
    eff: l => l*2, show: v => v+' free levels' },
  { id:'deep',    row:2, needs:'array',   max:6,  name:'Deeper Still',
    cost: l => Math.ceil(20*Math.pow(4,l)),
    desc:'Raises the board past sixteen rows.',
    eff: l => l, show: v => '+'+v+' rows' },

  { id:'flux2',   row:3, needs:'rain',    max:12, name:'Conduit',
    cost: l => Math.ceil(40*Math.pow(3,l)),
    desc:'More flux per golden ball, and more quanta when you ascend.',
    eff: l => l, show: v => '+'+v+' flux' },
  { id:'singularity', row:3, needs:'core', max:99, name:'Singularity',

/* ================================================================
   THE TREE KEEPS GROWING

   Past the handcrafted tiers the tree generates its own. Clear a
   tier — one level in every node — and the next appears. Names and
   effects are derived from the tier number rather than randomised,
   so the same tier is identical on every device and after every
   reload; nothing about your tree depends on when you looked at it.
   ================================================================ */
const BASE_TIERS = 5;

const GEN_KINDS = [
  { k:'mult', label:'Amplifier', desc:'A flat multiplier on everything you earn.',
    eff:(l,t) => Math.pow(1.3 + t*0.02, l), show:v => '×'+fmt(v) },
  { k:'rate', label:'Governor',  desc:'The auto dropper runs faster.',
    eff:(l,t) => 1 + l*(0.25 + t*0.02), show:v => '×'+v.toFixed(2)+' rate' },
  { k:'gain', label:'Distiller', desc:'More of every prestige currency.',
    eff:(l,t) => 1 + l*(0.1 + t*0.01), show:v => '×'+v.toFixed(2)+' gains' },
  { k:'slot', label:'Escapement',desc:'Every slot on the board pays more.',
    eff:(l,t) => 1 + l*(0.2 + t*0.015), show:v => '×'+v.toFixed(2)+' slots' },
  { k:'gold', label:'Gilder',    desc:'Raises the golden ball chance.',
    eff:(l,t) => Math.min(0.4, l*0.012), show:v => '+'+Math.round(v*100)+'% golden' },
  { k:'flux', label:'Dynamo',    desc:'More flux from every golden ball.',
    eff:(l,t) => l, show:v => '+'+v+' flux' }
];

const GEN_PREFIX = ['Deep','Outer','Silent','Hollow','Bright','Iron','Pale','Vast',
                    'First','Last','Quiet','Wandering','Folded','Endless'];

/* deterministic: tier number in, same three nodes out, every time.
   Cached, because this used to be rebuilt on every lookup and the
   lookups happen thousands of times a second. */
const tierCache = {};
function genTier(t){
  if (tierCache[t]) return tierCache[t];
  const out = [];
  for (let i = 0; i < 3; i++){
    /* 5 and 11 are coprime with the pool sizes (6 and 14), so the same
       three names don't come back around for 42 tiers. Multiplying by
       3 and 7 as I first had it repeated every second tier. */
    const kind = GEN_KINDS[(t*5 + i) % GEN_KINDS.length];
    const pre  = GEN_PREFIX[(t*11 + i*5) % GEN_PREFIX.length];
    const id   = 'g' + t + '_' + i;
    const scale = Math.pow(4.2, t - BASE_TIERS);
    out.push({
      id, row:t, gen:true, kind:kind.k, tier:t,
      name: pre + ' ' + kind.label,
      desc: kind.desc,
      max: 99,
      needs: null,                       // a whole tier gates the next
      cost: l => Math.ceil(220 * scale * (1 + i*0.4) * Math.pow(2.6 + t*0.06, l)),
      eff:  l => kind.eff(l, t),
      show: kind.show
    });
  }
  tierCache[t] = out;
  return out;
}

/* how deep the tree currently goes: clear every node in a tier to
   open the next one */
function treeDepth(){
  let t = BASE_TIERS;
  while (t < BASE_TIERS + 200){
    const tier = genTier(t);
    if (!tier.every(nd => (S.tree && S.tree[nd.id]) > 0)) return t;
    t++;
  }
  return t;
}

/* base tier 4 must be cleared before generation starts */
function baseCleared(){
  return TREE.filter(t => t.row === BASE_TIERS - 1).every(t => node(t.id) > 0);
}

function allTiers(){
  const rows = [];
  for (let r = 0; r < BASE_TIERS; r++) rows.push(TREE.filter(t => t.row === r));
  if (baseCleared()){
    const depth = treeDepth();
    for (let t = BASE_TIERS; t <= depth; t++) rows.push(genTier(t));
  }
  return rows;
}

/* generated nodes are summed by kind, so the economy does not need to
   know how many exist */
/* Totals only move when a node is bought or a reset wipes the tree,
   so they are computed once and reused until then. Recomputing them
   per slot per frame was the single most expensive thing on screen. */
let genCache = null;
function invalidateGen(){ genCache = null; }

function genTotal(kind){
  if (genCache) return genCache[kind];
  genCache = { mult:1, rate:1, gain:1, slot:1, gold:0, flux:0 };
  if (S.tree){
    Object.keys(S.tree).forEach(id => {
      const m = /^g(\d+)_(\d+)$/.exec(id);
      if (!m) return;
      const lv = S.tree[id];
      if (!lv) return;
      const nd = genTier(+m[1])[+m[2]];
      if (!nd) return;
      const v = nd.eff(lv);
      if (nd.kind === 'gold' || nd.kind === 'flux') genCache[nd.kind] += v;
      else genCache[nd.kind] *= v;
    });
  }
  return genCache[kind];
}

const TN = {};
TREE.forEach(t => TN[t.id] = t);

/* look a node up whether it is handcrafted or generated */
function nodeDef(id){
  if (TN[id]) return TN[id];
  const m = /^g(\d+)_(\d+)$/.exec(id);
  return m ? genTier(+m[1])[+m[2]] : null;
}
const node  = id => (S.tree && S.tree[id]) || 0;
const nEff  = id => { const d = nodeDef(id); return d ? d.eff(node(id)) : 1; };
const nCost = id => { const d = nodeDef(id); return d ? d.cost(node(id)) : Infinity; };
const nMax  = id => { const d = nodeDef(id); return d ? node(id) >= d.max : true; };
const nOpen = id => {
  const d = nodeDef(id);
  if (!d) return false;
  if (d.gen){
    /* a generated tier opens once the tier above it is cleared */
    if (d.tier === BASE_TIERS) return baseCleared();
    return genTier(d.tier - 1).every(x => node(x.id) > 0);
  }
  return !d.needs || node(d.needs) > 0;
};

/* ================================================================
   LAYER FIVE — REFORGE

   Aether resets for ALLOY, and alloy runs the Forge: a bench of
   plinko balls you merge two at a time. Two of a kind make the next
   kind up, forever, and anything on the bench can be equipped for a
   small passive boost.
   ================================================================ */
const REFORGE_AT = 15;                 // lifetime aether before it unlocks
const ALLOY_EXP = 0.45;

const alloyAvailable = () =>
  Math.floor(Math.pow(Math.max(0, S.aetherEarned) / REFORGE_AT, ALLOY_EXP) * (1 + orbEff('gain')));
const alloyOnReforge = () => Math.max(0, alloyAvailable() - S.alloyEarned);
const reforgeUnlocked = () => S.aetherEarned >= REFORGE_AT || S.alloyEarned > 0;

/* ---- the balls themselves ----
   Tier 1 is bought; every tier above it only exists because two of
   the tier below were merged. Names and effects come from the tier
   number, so tier 40 is the same ball for everyone. */
const ORB_KIND = [
  { k:'mult', n:'Weighted',  desc:'payouts',        eff:t => 1 + t*0.05,  show:v => '×'+v.toFixed(2)+' pay' },
  { k:'rate', n:'Quick',     desc:'drop rate',      eff:t => 1 + t*0.04,  show:v => '×'+v.toFixed(2)+' rate' },
  { k:'gold', n:'Gilded',    desc:'golden chance',  eff:t => t*0.004,     show:v => '+'+(v*100).toFixed(1)+'% gold' },
  { k:'slot', n:'Faceted',   desc:'slot values',    eff:t => 1 + t*0.045, show:v => '×'+v.toFixed(2)+' slots' },
  { k:'flux', n:'Charged',   desc:'flux',           eff:t => Math.floor(t/2), show:v => '+'+v+' flux' },
  { k:'gain', n:'Prismatic', desc:'prestige gains', eff:t => t*0.03,      show:v => '+'+(v*100).toFixed(0)+'% gains' }
];
const ORB_MAT = ['Glass','Clay','Copper','Bronze','Iron','Steel','Silver','Gold','Cobalt',
                 'Onyx','Opal','Amber','Jade','Ruby','Sapphire','Obsidian','Platinum','Void'];

function orb(t){
  const kind = ORB_KIND[(t*5) % ORB_KIND.length];
  const mat  = ORB_MAT[(t*7) % ORB_MAT.length];
  const hue  = (t * 47) % 360;
  return {
    t, kind:kind.k,
    name: kind.n + ' ' + mat + (t > ORB_MAT.length ? ' ' + Math.ceil(t/ORB_MAT.length) : ''),
    boost: kind.eff(t),
    show: kind.show(kind.eff(t)),
    what: kind.desc,
    hue
  };
}

/* what the equipped balls are worth, summed by kind */
function orbEff(kind){
  let mult = 1, add = 0;
  (S.equipped || []).forEach(t => {
    const o = orb(t);
    if (o.kind !== kind) return;
    if (kind === 'gold' || kind === 'flux' || kind === 'gain') add += o.boost;
    else mult *= o.boost;
  });
  return (kind === 'gold' || kind === 'flux' || kind === 'gain') ? add : mult;
}

const equipSlots = () => Math.min(8, 2 + Math.floor(S.alloyEarned / 12));
const orbCost = () => Math.ceil(2 * Math.pow(1.16, (S.bench || []).length + (S.equipped || []).length));

function buyOrb(){
  const c = orbCost();
  if (S.alloy < c) return toast('Need ' + fmt(c - S.alloy) + ' more alloy');
  S.alloy -= c;
  S.bench = (S.bench || []).concat(1);
  save(); paintForge(); paintHud();
}

/* two of a kind become one of the next kind up */
function mergeOrbs(a, b){
  const bench = S.bench || [];
  if (a === b || bench[a] !== bench[b]) return;
  const t = bench[a];
  const keep = bench.filter((_, i) => i !== a && i !== b);
  keep.push(t + 1);
  S.bench = keep;
  S.mergeCount = (S.mergeCount || 0) + 1;
  if (t + 1 > (S.bestOrb || 0)) S.bestOrb = t + 1;
  save(); paintForge(); paintHud();
  toast('Merged into ' + orb(t+1).name);
  if (typeof sfx !== 'undefined') {}
}

function mergeAll(){
  let did = 0, guard = 0;
  while (guard++ < 500){
    const bench = S.bench || [];
    const seen = {};
    let pair = null;
    for (let i = 0; i < bench.length; i++){
      if (seen[bench[i]] !== undefined){ pair = [seen[bench[i]], i]; break; }
      seen[bench[i]] = i;
    }
    if (!pair) break;
    const t = bench[pair[0]];
    const keep = bench.filter((_, i) => i !== pair[0] && i !== pair[1]);
    keep.push(t + 1);
    S.bench = keep;
    if (t + 1 > (S.bestOrb || 0)) S.bestOrb = t + 1;
    did++;
  }
  S.mergeCount = (S.mergeCount || 0) + did;
  save(); paintForge(); paintHud();
  toast(did ? did + ' merges' : 'Nothing left to pair up');
}

function equipOrb(i){
  const bench = S.bench || [];
  if (bench[i] === undefined) return;
  if ((S.equipped || []).length >= equipSlots()) return toast('All ' + equipSlots() + ' slots are full');
  S.equipped = (S.equipped || []).concat(bench[i]);
  S.bench = bench.filter((_, k) => k !== i);
  save(); paintForge(); paintHud();
}

function unequipOrb(i){
  const eq = S.equipped || [];
  if (eq[i] === undefined) return;
  S.bench = (S.bench || []).concat(eq[i]);
  S.equipped = eq.filter((_, k) => k !== i);
  save(); paintForge(); paintHud();
}

const QUEST_POOL = [
  { id:'drop',  text: g => 'Drop ' + fmt(g) + ' balls',        goal: () => 40 + Math.floor(S.drops/50),  track:'drops' },
  { id:'earn',  text: g => 'Earn ' + fmt(g) + ' chips',        goal: () => Math.max(1000, S.earned*0.02), track:'earned' },
  { id:'rim',   text: g => 'Land ' + fmt(g) + ' rim slots',    goal: () => 8 + Math.floor((S.rimHits||0)/60), track:'rimHits' },
  { id:'gold',  text: g => 'Catch ' + fmt(g) + ' golden balls',goal: () => 3 + Math.floor((S.goldHits||0)/40), track:'goldHits' }
];

function rollQuests(){
  S.quests = [];
  const pool = QUEST_POOL.slice();
  for (let i = 0; i < 3 && pool.length; i++){
    const q = pool.splice(Math.floor(Math.random()*pool.length), 1)[0];
    const goal = Math.ceil(q.goal());
    S.quests.push({ id:q.id, goal, base:(S[q.track]||0), reward: Math.ceil((2 + i*2) * cEff('lantern')), done:false });
  }
  S.questAt = Date.now();
  save();
}

function questProgress(q){
  const def = QUEST_POOL.find(x => x.id === q.id);
  return Math.max(0, (S[def.track]||0) - q.base);
}

function checkQuests(){
  if (!S.quests || !S.quests.length || Date.now() - S.questAt > QUEST_EVERY()){ rollQuests(); return; }
  let paid = 0;
  S.quests.forEach(q => {
    if (!q.done && questProgress(q) >= q.goal){ q.done = true; S.shards += q.reward; paid += q.reward; }
  });
  if (paid){
    toast('Quest complete · +' + paid + ' shards');
    save();
    if (currentTab === 'cosmos') paintCosmos();
  }
}

  { id:'rows',  label:'Fill the board to 16 rows', test: () => eff('rows') >= 16 },
  { id:'rim',   label:'Land a rim slot',           test: () => S.rimHits >= 1 },
  { id:'rim1k', label:'Land 1,000 rim slots',      test: () => S.rimHits >= 1000 },
  { id:'gold',  label:'Catch a golden ball',       test: () => S.goldHits >= 1 }
];

const msDone = () => MILESTONES.filter(m => S.ms && S.ms[m.id]).length;
const msMult = () => 1 + msDone() * 0.04;

function checkMilestones(){
  let got = 0;
  MILESTONES.forEach(m => {
    if (!S.ms[m.id] && m.test()){ S.ms[m.id] = 1; got++; }
  });
  if (got){
    toast(got === 1 ? 'Milestone reached · +4% forever' : got + ' milestones · +' + (got*4) + '% forever');
    if (currentTab === 'stats') paintStats();
  }
}

/* ---------------- board ---------------- */
let W = 0, H = 0, DPR = 1;
let pegs = [], slots = [], pegR = 5, ballR = 5;
let landed = [];          // histogram of where balls actually finish

function layout(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const r = C.getBoundingClientRect();
  W = r.width; H = r.height;
  C.width = Math.floor(W * DPR);
  C.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildBoard();
}

/* Pegs bucketed by row. A falling ball only ever touches the row it is
   passing through, so collisions stop being balls x every peg — the
   difference is roughly tenfold on a full board. */
let pegRows = [], rowTop = 0, rowGap = 1;

function indexPegs(){
  pegRows = [];
  if (!pegs.length){ return; }
  const ys = [...new Set(pegs.map(p => Math.round(p.y)))].sort((a,b) => a-b);
  rowTop = ys[0];
  rowGap = ys.length > 1 ? (ys[1] - ys[0]) : 1;
  pegs.forEach(p => {
    const r = Math.max(0, Math.round((p.y - rowTop) / rowGap));
    (pegRows[r] = pegRows[r] || []).push(p);
  });
}

function buildBoard(){
  const rows = eff('rows');
  const top = 44, slotH = 40;
  const gapY = (H - top - slotH - 14) / rows;
  const gapX = Math.min(gapY * 1.15, (W - 70) / (rows + 1));

  pegR = Math.max(2.5, Math.min(5, gapX * 0.13));
  ballR = Math.max(3, pegR * 1.05);

  pegs = [];
  for (let r = 0; r < rows; r++){
    const count = r + 3, y = top + r * gapY;
    const spread = (count - 1) * gapX;
    for (let i = 0; i < count; i++) pegs.push({ x: W/2 - spread/2 + i*gapX, y, hit:0 });
  }

  const lastY = top + (rows-1) * gapY;
  const bottom = pegs.filter(p => Math.abs(p.y - lastY) < 0.5);
  slots = [];
  const n = bottom.length - 1;
  for (let i = 0; i < n; i++){
    const mid = (i - (n-1)/2) / ((n-1)/2 || 1);
    slots.push({ x0:bottom[i].x, x1:bottom[i+1].x, y:H - slotH - 6, h:slotH, edge:Math.abs(mid), flash:0 });
  }
  landed = new Array(slots.length).fill(0);
  indexPegs();
  staticDirty = true;
  sampleDist();
  buildDist();
}

/* Payout climbs steeply toward the rim; the exponent scales with row
   count, so a deeper board makes the outer slots dramatically richer. */
function slotMult(slot){
  const peak = Math.pow(1.75, eff('rows') / 2.4);
  return (0.2 + eff('floor') + cEff('anvil') + Math.pow(slot.edge, 3.1) * peak)
         * eff('slots') * nEff('array') * genTotal('slot') * orbEff('slot') * prismMult() * eff('value');
}

/* ================================================================
   HIDDEN BALLS

   With the board hidden there is nothing to look at, so simulating
   every bounce is wasted work. Instead the board is sampled once —
   real physics, a few thousand balls — and the resulting landing
   distribution is used to resolve drops instantly.

   The payouts are the genuine article, not a guess: the curve comes
   from the same collision code you watch when the board is visible,
   so hiding the balls changes the frame cost and nothing else.
   ================================================================ */
let distTable = null, staticDirty = true;

function sampleDist(){
  distTable = null;
  if (!slots.length || !pegs.length) return;

  const N = 2500;
  const counts = new Array(slots.length).fill(0);
  const rest = eff('bounce'), drift = eff('luck');
  const min = pegR + ballR, min2 = min * min;
  const spread = 1.2 + eff('funnel');

  for (let k = 0; k < N; k++){
    let x = W/2 + (Math.random()-0.5)*14, y = 16;
    let vx = (Math.random()-0.5)*spread, vy = 0;

    for (let step = 0; step < 900; step++){
      vy += GRAV;
      if (drift > 0){
        const off = (x - W/2) / (W/2);
        vx += Math.sign(off || (Math.random()-0.5)) * drift * 0.5;
      }
      x += vx; y += vy;

      const row = ((y - rowTop) / rowGap) | 0;
      for (let r = row - 1; r <= row + 1; r++){
        const bucket = pegRows[r];
        if (!bucket) continue;
        let hit = false;
        for (let p = 0; p < bucket.length; p++){
          const peg = bucket[p];
          const dx = x - peg.x, dy = y - peg.y;
          if (dx*dx + dy*dy < min2){
            const d = Math.sqrt(dx*dx + dy*dy) || 0.01;
            const nx = dx/d, ny = dy/d;
            x = peg.x + nx*min; y = peg.y + ny*min;
            const dot = vx*nx + vy*ny;
            vx = (vx - 2*dot*nx) * rest;
            vy = (vy - 2*dot*ny) * rest;
            vx += (Math.random()-0.5) * 1.1;
            hit = true; break;
          }
        }
        if (hit) break;
      }

      if (x < ballR){ x = ballR; vx = Math.abs(vx)*rest; }
      if (x > W - ballR){ x = W - ballR; vx = -Math.abs(vx)*rest; }
      const sp2 = vx*vx + vy*vy;
      if (sp2 > 196){ const sp = Math.sqrt(sp2); vx *= 14/sp; vy *= 14/sp; }

      if (y > slots[0].y){
        let idx = -1;
        for (let i2 = 0; i2 < slots.length; i2++)
          if (x >= slots[i2].x0 && x < slots[i2].x1){ idx = i2; break; }
        if (idx < 0) idx = x < W/2 ? 0 : slots.length - 1;
        counts[idx]++;
        break;
      }
    }
  }

  /* cumulative table, so a drop is one random number and a scan */
  const total = counts.reduce((a,b) => a+b, 0) || 1;
  let acc = 0;
  distTable = counts.map(c => (acc += c / total));
}

function sampleSlot(){
  if (!distTable) return Math.floor(slots.length/2);
  const r = Math.random();
  for (let i = 0; i < distTable.length; i++) if (r <= distTable[i]) return i;
  return distTable.length - 1;
}

/* resolve a drop without simulating it */
function resolveHidden(gold, kind){
  const idx = sampleSlot();
  let won = slotMult(slots[idx]);
  if (gold){
    won *= peff('shine');
    S.goldHits = (S.goldHits||0) + 1;
    let fg = 1 + seff('spark') + nEff('flux2') + genTotal('flux') + orbEff('flux');
        if (Math.random() < fEff('arc')) fg *= 2;      // Arc Welder
        S.flux = (S.flux||0) + fg;
  }
  if (kind === 'heavy') won *= 1.6;
  if (Math.random() < eff('jackpot')) won *= 5;
  if (idx === 0 || idx === slots.length - 1){
    S.rimHits = (S.rimHits||0) + 1;
    if (fEff('static') > 0) S.flux = (S.flux||0) + fEff('static');
  }

  S.cash += won; S.earned += won;
  if (won > S.best) S.best = won;
  landed[idx] = (landed[idx] || 0) + 1;

  /* ricochets still happen, they just resolve straight away too */
  if (Math.random() < eff('echo') + cEff('chain') + nEff('storm')) resolveHidden(false, 'std');
}

/* ---------------- balls ---------------- */
const balls = [];
const GRAV = 0.42;

function dropBall(){
  S.drops++;
  const hiddenNow = S.opt.hideBalls;

  if (hiddenNow){
    const g = Math.random() < Math.min(0.9, peff('gold') + nEff('rain') + cEff('shower')
                                            + nEff('storm') + genTotal('gold') + orbEff('gold'));
    resolveHidden(g, curBall().id);
    return;
  }

  if (balls.length >= (S.opt.maxBalls || 420)) return;
  const kind = curBall().id;
  let spread = 1.2 + eff('funnel');
  if (kind === 'charge') spread += 7;        // flung outward
  if (kind === 'heavy')  spread *= 0.5;      // barely drifts
  balls.push({
    x: W/2 + (Math.random()-0.5)*14, y: 16,
    vx:(Math.random()-0.5)*spread, vy:0, life:0,
    gold: Math.random() < Math.min(0.9, peff('gold') + nEff('rain') + cEff('shower')
                                        + nEff('storm') + genTotal('gold') + orbEff('gold')),
    kind: curBall().id
  });
}
function dropSet(){ const n = eff('multi') + nEff('cascade'); for (let i=0;i<n;i++) dropBall(); }

function physics(){
  const rest = eff('bounce'), drift = eff('luck');

  for (let i = balls.length - 1; i >= 0; i--){
    const b = balls[i];
    b.vy += GRAV;

    if (drift > 0){
      const off = (b.x - W/2) / (W/2);
      b.vx += Math.sign(off || (Math.random()-0.5)) * drift * 0.5;
    }

    b.x += b.vx; b.y += b.vy; b.life++;

    /* only the row the ball is in, plus its neighbours */
    const min = pegR + ballR, min2 = min * min;
    const row = ((b.y - rowTop) / rowGap) | 0;
    for (let r = row - 1; r <= row + 1; r++){
      const bucket = pegRows[r];
      if (!bucket) continue;
      let hit = false;
      for (let p = 0; p < bucket.length; p++){
        const peg = bucket[p];
        const dx = b.x - peg.x, dy = b.y - peg.y;
        if (dx*dx + dy*dy < min2){
          const d = Math.sqrt(dx*dx + dy*dy) || 0.01;
          const nx = dx/d, ny = dy/d;
          b.x = peg.x + nx*min; b.y = peg.y + ny*min;
          const dot = b.vx*nx + b.vy*ny;
          b.vx = (b.vx - 2*dot*nx) * rest;
          b.vy = (b.vy - 2*dot*ny) * rest;
          b.vx += (Math.random()-0.5) * 1.1;  // the jitter that makes a distribution
          peg.hit = 1;
          hit = true;
          break;
        }
      }
      if (hit) break;
    }

    if (b.x < ballR){ b.x = ballR; b.vx = Math.abs(b.vx)*rest; }
    if (b.x > W - ballR){ b.x = W - ballR; b.vx = -Math.abs(b.vx)*rest; }

    const sp2 = b.vx*b.vx + b.vy*b.vy;             // sqrt only when it matters
    if (sp2 > 196){ const sp = Math.sqrt(sp2); b.vx *= 14/sp; b.vy *= 14/sp; }

    if (slots.length && b.y > slots[0].y){
      let idx = -1;
      for (let k = 0; k < slots.length; k++){
        if (b.x >= slots[k].x0 && b.x < slots[k].x1){ idx = k; break; }
      }
      if (idx < 0) idx = b.x < W/2 ? 0 : slots.length - 1;

      let won = slotMult(slots[idx]);
      if (b.gold){
        won *= peff('shine');
        S.goldHits = (S.goldHits||0) + 1;
        let fg = 1 + seff('spark') + nEff('flux2') + genTotal('flux') + orbEff('flux');
        if (Math.random() < fEff('arc')) fg *= 2;      // Arc Welder
        S.flux = (S.flux||0) + fg;
      }
      if (b.kind === 'heavy') won *= 1.6;
      if (Math.random() < eff('jackpot')){ won *= 5; slots[idx].flash = 1.8; }
      if (Math.random() < eff('echo') + cEff('chain') + nEff('storm')){
        // a free ball kicked straight back up, no stake attached
        balls.push({ x: (slots[idx].x0 + slots[idx].x1) / 2,
                     y: slots[idx].y - 14,
                     vx:(Math.random()-0.5)*3, vy:-9 - Math.random()*4,
                     life:0, gold:false });
      }
      if (idx === 0 || idx === slots.length - 1){
        S.rimHits = (S.rimHits||0) + 1;
        if (seff('spark') > 0) S.flux = (S.flux||0) + seff('spark') * 0.25;
        if (fEff('static') > 0) S.flux = (S.flux||0) + fEff('static');   // Static Charge
      }

      S.cash += won; S.earned += won;
      if (won > S.best) S.best = won;
      slots[idx].flash = b.gold ? 1.6 : 1;
      landed[idx]++;
      balls.splice(i, 1);
      continue;
    }

    /* the Splitter breaks in two once it is a third of the way down */
    if (b.kind === 'split' && !b.split && b.y > H * 0.35){
      b.split = true; b.kind = 'std';
      balls.push({ x:b.x, y:b.y, vx:-b.vx - 1.4, vy:b.vy, life:b.life, gold:b.gold, kind:'std', split:true });
      b.vx += 1.4;
    }

    if (b.life > 1200) balls.splice(i, 1);
  }
}

/* ---------------- drawing ---------------- */
/* ================================================================
   The pegs and the slot labels barely change, so they are drawn once
   to an offscreen canvas and blitted. Redrawing 300 arcs and 24 text
   labels every frame was most of the render cost — text in particular
   is expensive to lay out.
   ================================================================ */
let bg = null, bgCtx = null, bgSig = '';

function slotSig(){
  return slots.length + ':' + (slots.length ? Math.round(slotMult(slots[0])) + ':' +
         Math.round(slotMult(slots[Math.floor(slots.length/2)])) : '') + ':' +
         S.opt.showLabels + ':' + S.opt.theme;
}

function drawStatic(){
  if (!bg){ bg = document.createElement('canvas'); bgCtx = bg.getContext('2d'); }
  if (bg.width !== Math.floor(W*DPR) || bg.height !== Math.floor(H*DPR)){
    bg.width = Math.floor(W*DPR); bg.height = Math.floor(H*DPR);
  }
  bgCtx.setTransform(DPR,0,0,DPR,0,0);
  bgCtx.clearRect(0,0,W,H);

  for (const sl of slots){
    const t = sl.edge;
    bgCtx.globalAlpha = 0.10 + t*0.30;
    bgCtx.fillStyle = t > 0.55 ? TH.slotHot : TH.slotInk;
    bgCtx.fillRect(sl.x0 + 1, sl.y + sl.h - 3 - t*10, sl.x1 - sl.x0 - 2, 3 + t*10);
    bgCtx.globalAlpha = 1;
    if (S.opt.showLabels){
      bgCtx.fillStyle = TH.label;
      bgCtx.font = '500 9px "IBM Plex Mono", monospace';
      bgCtx.textAlign = 'center';
      bgCtx.fillText('×' + fmt(slotMult(sl)), (sl.x0+sl.x1)/2, sl.y + 13);
    }
  }
  for (const p of pegs){
    bgCtx.beginPath();
    bgCtx.arc(p.x, p.y, pegR, 0, 6.2832);
    bgCtx.fillStyle = TH.peg;
    bgCtx.fill();
  }
  bgSig = slotSig();
  staticDirty = false;
}

function draw(){
  ctx.clearRect(0, 0, W, H);

  if (staticDirty || !bg || bgSig !== slotSig()) drawStatic();
  ctx.drawImage(bg, 0, 0, W, H);

  if (S.opt.hideBalls){
    ctx.fillStyle = TH.label;
    ctx.font = '500 11px "IBM Plex Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('BALLS HIDDEN — STILL EARNING', W/2, H/2);
    return;
  }

  /* only slots currently flashing need repainting over the cached layer */
  for (const s of slots){
    if (s.flash > 0.02){
      const t = s.edge;
      ctx.globalAlpha = Math.min(1, s.flash*0.55);
      ctx.fillStyle = TH.slotHot;
      ctx.fillRect(s.x0 + 1, s.y + s.h - 3 - t*10, s.x1 - s.x0 - 2, 3 + t*10);
      ctx.globalAlpha = 1;
      s.flash *= 0.86;
    } else s.flash = 0;
  }

  /* likewise only pegs still lit from a recent hit */
  ctx.fillStyle = TH.slotHot;
  for (const p of pegs){
    if (p.hit > 0.05){
      ctx.globalAlpha = 0.4 + p.hit*0.6;
      ctx.beginPath();
      ctx.arc(p.x, p.y, pegR, 0, 6.2832);
      ctx.fill();
      p.hit *= 0.9;
    } else p.hit = 0;
  }
  ctx.globalAlpha = 1;

  for (const b of balls){
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.gold ? ballR * 1.35 : ballR, 0, 6.2832);
    ctx.fillStyle = b.gold ? '#E8A72C' : TH.ball;
    ctx.fill();
    if (b.gold){
      ctx.beginPath();
      ctx.arc(b.x, b.y, ballR * 2.2, 0, 6.2832);
      ctx.fillStyle = 'rgba(232,167,44,.18)';
      ctx.fill();
    }
  }
}

/* ---------------- the distribution strip ---------------- */
function buildDist(){
  $('dist').innerHTML = slots.map(() => '<i></i>').join('');
}
function paintDist(){
  const bars = $('dist').children;
  const top = Math.max(1, ...landed);
  for (let i = 0; i < bars.length; i++){
    bars[i].style.height = Math.max(1, (landed[i] / top) * 100) + '%';
  }
}

/* ---------------- loop ---------------- */
let carry = 0, last = performance.now(), acc = 0;
let physAcc = 0;
const STEP = 1/60;

/* Rebuilding a panel throws away and recreates every row, which is
   expensive and also fights with scrolling. Skip it unless the numbers
   on show have moved, and never mid-scroll. */
let lastSig = {}, scrollingUntil = 0;

/* Deliberately excludes the running totals: those tick constantly, and
   including them would rebuild the panel several times a second, which
   is the problem this is here to avoid. The totals are refreshed in
   place by touchPanel() instead. */
function panelSig(kind){
  if (kind === 'tree')
    return Math.floor(Math.log10(Math.max(1, S.quanta))*20) + '|' + JSON.stringify(S.tree || {});
  if (kind === 'flux')
    return JSON.stringify(S.fx || {});
  return [JSON.stringify(S.cons||{}), (S.active||[]).join(','),
          JSON.stringify(S.bz||{}),
          (S.quests||[]).map(q => q.done ? 1 : 0).join('')].join('|');
}

/* update the numbers and button states without touching the DOM tree */
function touchPanel(kind){
  if (kind === 'flux'){
    const f = $('fluxN');
    if (f) f.textContent = fmt(Math.floor(S.flux || 0));
    const sb = $('surgeBtn2');
    if (sb){
      const on = surgeActive();
      sb.textContent = on ? surgeLeft() + 's' : SURGE_COST + ' flux';
      sb.classList.toggle('on', on);
      sb.disabled = S.flux < SURGE_COST;
    }
    const db = $('dischargeBtn');
    if (db){
      db.textContent = S.flux >= 25 ? fmt(dischargeValue()) : '25 flux';
      db.disabled = S.flux < 25;
    }
    document.querySelectorAll('.up.fx[data-fx]').forEach(b => {
      const u = FU[b.dataset.fx];
      if (!u) return;
      const lv = fLvl(u.id);
      b.disabled = lv >= u.max || S.flux < u.cost(lv);
    });
  } else {
    const a = $('aethN'), sh = $('shardN');
    if (a) a.textContent = fmt(S.aether);
    if (sh) sh.textContent = fmt(S.shards);
    document.querySelectorAll('.up.bz[data-bz]').forEach(b => {
      const u = BZ[b.dataset.bz];
      if (!u) return;
      const lv = bzLvl(u.id);
      b.disabled = lv >= u.max || S.shards < u.cost(lv);
    });
    (S.quests || []).forEach((q, i) => {
      const bar = document.querySelectorAll('.qbar i')[i];
      if (bar) bar.style.width = Math.min(100, questProgress(q)/q.goal*100) + '%';
    });
  }
}

function maybePaint(kind, fn){
  if (performance.now() < scrollingUntil) return;
  const sig = panelSig(kind);
  if (lastSig[kind] === sig) return;
  lastSig[kind] = sig;
  fn();
}

/* any scroll inside the side panel pauses rebuilds for a moment */
addEventListener('scroll', e => {
  if (e.target && e.target.classList && e.target.classList.contains('scroll'))
    scrollingUntil = performance.now() + 400;
}, true);

function frame(now){
  const dt = Math.min((now - last)/1000, 0.25);
  last = now;

  const rate = eff('auto') * nEff('cadence') * cEff('engine') * genTotal('rate') * orbEff('rate')
             * (surgeActive() ? fEff('overcharge') : 1);
  if (rate > 0){
    carry += rate * dt * (eff('multi') + nEff('cascade'));
    while (carry >= 1){ dropBall(); carry--; }
  }

  /* Fixed timestep. physics() is tuned for one step per 60th of a
     second, so it must run on the clock rather than once per frame —
     otherwise a busy moment (scrolling a long list, switching tabs)
     drops the frame rate and the balls visibly fall in slow motion.
     Capped at 4 catch-up steps so a long stall can't spiral. */
  physAcc += dt;
  let steps = 0;
  while (physAcc >= STEP && steps < 4){ physics(); physAcc -= STEP; steps++; }
  if (physAcc > STEP * 4) physAcc = 0;      // came back from a stall; don't fast-forward

  draw();

  acc += dt;
  if (acc > 0.12){
    const trickle = fEff('reservoir');
    if (trickle > 0) S.flux = (S.flux || 0) + trickle * acc;
    acc = 0;
    paintHud(); paintDist(); checkMilestones(); checkQuests();
    if (currentTab === 'tree') maybePaint('tree', paintTree);
    /* these three rebuild their whole panel, so they only refresh when
       something they display has actually changed */
    if (currentTab === 'cosmos'){ maybePaint('cosmos', paintCosmos); touchPanel('cosmos'); }
    if (currentTab === 'flux'){   maybePaint('flux', paintFlux);     touchPanel('flux'); }
  }
  requestAnimationFrame(frame);
}

/* ---------------- interface ---------------- */
let lastEarned = 0, lastRateAt = 0, shownRate = 0;

function paintHud(){
  // actual chips/sec, measured rather than predicted
  const now = performance.now();
  if (lastRateAt && now > lastRateAt){
    const inst = (S.earned - lastEarned) / ((now - lastRateAt) / 1000);
    shownRate = shownRate * 0.8 + inst * 0.2;      // smoothed
  }
  lastEarned = S.earned; lastRateAt = now;

  $('cash').textContent = fmt(S.cash);
  $('perSec').textContent = fmt(shownRate);
  $('ballCount').textContent = balls.length;
  $('best').textContent = fmt(S.best);

  document.querySelectorAll('.up[data-id]').forEach(btn => {
    const id = btn.dataset.id;
    if (!U[id]) return;
    const isMax = maxed(id);
    const { n, spend } = affordable(id, buyAmount);
    const single = cost(id);
    btn.disabled = isMax || n < 1;
    btn.classList.toggle('afford', !isMax && n >= 1);
    btn.querySelector('.cost').textContent = isMax ? 'Maxed'
      : n > 1 ? fmt(spend) + ' chips · ' + n + ' levels'
      : fmt(single) + ' chips';
    btn.querySelector('.lv').textContent = isMax ? 'lv ' + lvl(id) + ' · max' : 'lv ' + lvl(id);
    btn.querySelector('.eff').textContent = U[id].show(eff(id));
  });
  paintPrisms();

  const gain = prismsOnReset();
  $('pBtn').disabled = gain < 1;

let buyAmount = 1;   // 1, 10, or 'max'

/* How many levels are affordable right now, capped so a Max click on a
   cheap upgrade can't lock the tab up counting to a million. */
function affordable(id, want){
  let n = 0, spend = 0, lv = lvl(id);
  const cap = want === 'max' ? 500 : want;
  while (n < cap){
    const cap = capOf(U[id]);
    if (cap !== undefined && lv + n >= cap) break;
    const c = U[id].cost(lv + n);
    if (spend + c > S.cash) break;
    spend += c; n++;
  }
  return { n, spend };
}

function buy(id){
  if (maxed(id)) return;
  const { n, spend } = affordable(id, buyAmount);
  if (n < 1) return;
  S.cash -= spend;
  S.lv[id] = lvl(id) + n;
  if (id === 'rows') buildBoard();
  checkMilestones();
  paintHud();
}

let treeRows = -1;

function paintTree(){
  /* the tree grows, so rebuild whenever a new tier has opened */
  const rows = allTiers().length;
  if (rows !== treeRows){ treeRows = rows; buildTree(); }

  const q = $('quantaN');
  if (q) q.textContent = fmt(S.quanta);
  const d = $('treeDepth');
  if (d) d.textContent = rows + ' tiers';

  document.querySelectorAll('.tnode').forEach(b => {
    const id = b.dataset.node, t = nodeDef(id);
    if (!t) return;
    const open = nOpen(id), max = nMax(id), c = nCost(id);
    b.classList.toggle('locked', !open);
    b.classList.toggle('owned', node(id) > 0);
    b.disabled = !open || max || S.quanta < c;
    b.querySelector('.lv').textContent =
      !open ? (t.gen ? 'clear the tier above' : 'needs ' + nodeDef(t.needs).name)
      : max  ? 'level ' + node(id) + ' · max'
             : 'level ' + node(id) + ' / ' + t.max;
    b.querySelector('.ef').textContent = t.show(nEff(id));
    b.querySelector('.cs').textContent = max ? '' : fmt(c) + ' quanta';
  });
}

function buyNode(id){
  if (!nOpen(id) || nMax(id)) return;
  const c = nCost(id);
  if (S.quanta < c) return;
  const before = allTiers().length;
  S.quanta -= c;
  S.tree[id] = node(id) + 1;
  invalidateGen();
  if (id === 'deep') buildBoard();     // the board can physically grow
  save(); lastSig.tree = null; paintTree(); paintHud();
  const d = nodeDef(id);
  toast(d.name + ' → level ' + node(id));
  if (allTiers().length > before) toast('A new tier opened up');
}

/* the reserve is worth more the fuller it is, so hoarding has a point */
function dischargeValue(){
  const f = S.flux || 0;
  if (f < 25) return 0;
  const perSec = eff('auto') * (eff('multi') + nEff('cascade')) *
                 (slots.length ? slotMult(slots[Math.floor(slots.length/2)]) * 2.4 : 1);
  return perSec * Math.pow(f, 1.15) * 0.6;
}

function buyCon(id){
  const c = CN[id], lv = conLvl(id), cost = c.cost(lv);
  if (S.aether < cost) return toast('Need ' + fmt(cost - S.aether) + ' more aether');
  S.aether -= cost;
  S.cons[id] = lv + 1;
  if (lv === 0 && (S.active||[]).length < conSlots()){ S.active = (S.active||[]).concat(id); }
  save(); paintCosmos(); paintHud();
  toast(c.name + ' → level ' + (lv+1));
}

function toggleCon(id){
  S.active = S.active || [];
  const i = S.active.indexOf(id);
  if (i >= 0) S.active.splice(i,1);
  else {
    if (S.active.length >= conSlots()) return toast('All ' + conSlots() + ' slots are full — unequip one first');
    S.active.push(id);
  }
  save(); paintCosmos(); paintHud();
}
